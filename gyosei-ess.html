<script>window.SET = {"id":"gyosei-ess","code":"行政法記述","title":"記述特訓 行政法（4題）","lead":"記述式は1問20点で、部分点があります。白紙は0点ですが、キーワードが1つ入れば点になります。①まず「誰が・何を・どうする」の骨組みを書き、②条文のキーワードを入れ、③40字前後に整える、の順で書いてください。1題5分が目安です。","minutes":20,"questions":[{"id":"q01","area":"記述式","topic":"申請型義務付け訴訟（記述）","basis":["行政事件訴訟法11条1項・37条の3・38条1項"],"tip":"記述式は「被告」「訴訟類型」「併合」の3点セットが定番。被告を「A市長」と書くと減点になる。","kind":"essay","format":"記述 40字程度","stem":"Xは、A市長に対して法令に基づく許可を申請したが、A市長は拒否処分をした。Xがこの許可を得るために、行政事件訴訟法上、誰を被告として、どのような訴訟を、どのように提起すべきか。40字程度で記述しなさい。","model":"A市を被告とし、拒否処分の取消訴訟と許可の義務付け訴訟を併合して提起する。","explain":"申請に対する拒否処分がされた場合の申請型義務付け訴訟（行政事件訴訟法37条の3第1項2号）。この場合、拒否処分の取消訴訟又は無効等確認の訴えを併合して提起しなければならない（同条3項2号）。被告は、処分をした行政庁（A市長）ではなく、その所属する公共団体であるA市（38条1項・11条1項）。「誰を・何を・どのように」をすべて入れる。","elements":[{"label":"被告はA市（行政庁の所属する公共団体）","kw":["A市を被告","A市が被告","市を被告"],"pts":5},{"label":"拒否処分の取消訴訟（又は無効等確認訴訟）","kw":["取消"],"pts":5},{"label":"許可処分の義務付け訴訟","kw":["義務付け"],"pts":5},{"label":"両者を併合して提起する","kw":["併合"],"pts":5}]},{"id":"q02","area":"記述式","topic":"非申請型義務付け訴訟の要件（記述）","basis":["行政事件訴訟法37条の2"],"tip":"「重大な損害」「他に適当な方法がない」は義務付け・差止めの共通ワード。仮の義務付け・仮の差止めは「償うことのできない損害」「緊急の必要」「本案に理由があるとみえる」。","kind":"essay","format":"記述 40字程度","stem":"Xの隣地では、建築基準法に違反する建築物の工事が進められている。Xは、この建築物が完成すると火災の際に延焼の危険が生じるとして、Y市長が建築主に対して是正命令を発するよう求める訴訟を提起したいと考えている。行政事件訴訟法上、この訴訟は何と呼ばれ、損害と他の救済手段に関してどのような要件を満たす必要があるか。40字程度で記述しなさい。","model":"非申請型義務付け訴訟であり、重大な損害を生ずるおそれがあり、他に適当な方法がないことが必要。","explain":"行政事件訴訟法37条の2第1項。申請権のない第三者が、行政庁に一定の処分を求めるのが非申請型（直接型）義務付け訴訟。要件は①一定の処分がされないことにより重大な損害を生ずるおそれ（重損要件）、②その損害を避けるため他に適当な方法がないこと（補充性）、③法律上の利益を有する者であること（原告適格、同条3項）。差止め訴訟（37条の4）も「重大な損害・他に適当な方法がない」で同じ構造。","elements":[{"label":"非申請型（直接型）の義務付け訴訟","kw":["義務付け"],"pts":6},{"label":"重大な損害を生ずるおそれ","kw":["重大な損害"],"pts":7},{"label":"損害を避けるため他に適当な方法がない","kw":["他に適当な方法","他に適切な方法","ほかに適当な方法"],"pts":7}]},{"id":"q03","area":"記述式","topic":"事情判決（記述）","basis":["行政事件訴訟法31条1項"],"tip":"「却下」と書くと大きく減点。事情判決は中身を判断したうえでの「棄却」。","kind":"essay","format":"記述 40字程度","stem":"Xは、Y県知事がした処分の取消訴訟を提起した。審理の結果、裁判所は処分が違法であると判断したが、処分を前提として大規模な公共工事がすでに完成しており、処分を取り消すと公の利益に著しい障害を生ずると認めた。この場合、裁判所はどのような判決をすることができ、その判決の主文で何をしなければならないか。40字程度で記述しなさい。","model":"請求を棄却する事情判決をすることができ、判決の主文で処分が違法であることを宣言しなければならない。","explain":"行政事件訴訟法31条1項。処分が違法でも、取り消すことで公の利益に著しい障害を生ずる場合、原告の受ける損害の程度、その損害の賠償又は防止の程度・方法その他一切の事情を考慮したうえで、取消しが公共の福祉に適合しないと認めるときは、請求を棄却できる。この場合、判決の主文で処分が違法であることを宣言しなければならない。行政不服審査法の事情裁決（45条3項）も同じ構造で、「違法又は不当」を宣言する。","elements":[{"label":"請求を棄却する","kw":["棄却"],"pts":5},{"label":"事情判決","kw":["事情判決"],"pts":5},{"label":"判決の主文で","kw":["主文"],"pts":5},{"label":"処分が違法であることを宣言","kw":["違法であることを宣言","違法を宣言","違法である旨を宣言","違法であると宣言","違法であることを宣"],"pts":5}]},{"id":"q04","area":"記述式","topic":"行政代執行の要件（記述）","basis":["行政代執行法2条・3条"],"tip":"「他の手段で確保困難」「放置が著しく公益に反する」の2点をセットで暗記。","kind":"essay","format":"記述 40字程度","stem":"Y市長は、Xに対し、法律に基づき、違法に設置された看板を撤去するよう命じたが、Xはこれに従わない。Y市長が行政代執行法に基づいて代執行をするためには、Xの義務の不履行のほかに、どのような要件を満たす必要があるか。40字程度で記述しなさい。","model":"他の手段によってその履行を確保することが困難で、不履行を放置することが著しく公益に反すること。","explain":"行政代執行法2条。代執行の対象は、法律（又は法律の委任に基づく命令・規則・条例）により直接命ぜられ、又は行政庁により命ぜられた「代替的作為義務」（他人が代わってすることができる行為）。要件は、①義務の不履行、②他の手段によってその履行を確保することが困難、③その不履行を放置することが著しく公益に反すると認められること。手続は、原則として文書による戒告（3条1項）→代執行令書による通知（同条2項）。","elements":[{"label":"他の手段によって履行を確保することが","kw":["他の手段"],"pts":5},{"label":"困難であること","kw":["困難"],"pts":5},{"label":"不履行を放置することが","kw":["放置"],"pts":5},{"label":"著しく公益に反すると認められること","kw":["著しく公益","公益に反"],"pts":5}]}]};
