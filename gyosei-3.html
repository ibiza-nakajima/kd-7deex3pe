<script>window.SET = {"id":"gyosei-3","code":"行政法3","title":"行政法③ 国家賠償・地方自治法","lead":"国家賠償法の判例と損失補償、地方自治法の条文知識（直接請求・議会と長・住民訴訟・公の施設など）を確認します。","minutes":40,"questions":[{"id":"q01","area":"国賠：1条","topic":"1条の公権力の行使・職務","basis":["国家賠償法1条","最判昭62.2.6","最判昭31.11.30","最判昭30.4.19","最判昭57.4.1"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"国家賠償法1条に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["一連の職務上の行為の過程で他人に被害を生じさせた場合、どの公務員のどの違法行為によるものかを特定できなくても、一定の場合には国又は公共団体は損害賠償責任を免れない。","公務員に故意又は重大な過失があったときは、国又は公共団体は、その公務員に対して求償権を有する。","公務員個人は、被害者に対して直接損害賠償責任を負わない。","公務員が自己の利をはかる意図をもってした行為であっても、客観的に職務執行の外形をそなえる行為によって他人に損害を加えたときは、国家賠償法1条の責任が生ずる。","公立学校における教師の教育活動は、国家賠償法1条1項の「公権力の行使」に含まれない。"],"why":["正しい。最判昭57.4.1。","正しい。1条2項。軽過失では求償できない。","正しい。最判昭30.4.19。","正しい。外形標準説（最判昭31.11.30・非番の警察官による強盗殺人事件）。","誤り（これが正解）。最判昭62.2.6は、公立学校の教師の教育活動も「公権力の行使」に含まれるとした。"],"answer":4},{"id":"q02","area":"国賠：1条","topic":"規制権限の不行使・違法性","basis":["最判平16.4.27（筑豊じん肺）","最判平16.10.15（関西水俣病）","最判昭61.2.27（パトカー追跡）","最判平19.1.25","国家賠償法4条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"国家賠償法1条の違法性に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["警察官のパトカーによる追跡中に逃走車両が第三者に損害を与えた場合、追跡行為は、その必要性や方法の相当性を問わず、直ちに違法となる。","公務員による規制権限の不行使は、権限を定めた法令の趣旨・目的や権限の性質等に照らし、具体的事情の下で、その不行使が許容される限度を逸脱して著しく合理性を欠くと認められるときは、国家賠償法1条1項の適用上違法となる。","国家賠償法1条の「公務員」は国家公務員・地方公務員に限られ、民間の法人の職員が含まれることはない。","国家賠償法1条に基づく損害賠償請求には、民法の消滅時効の規定は適用されない。","規制権限の行使は公務員の裁量に委ねられているから、その不行使が国家賠償法上違法となることはない。"],"why":["誤り。最判昭61.2.27は、追跡が不必要であるか、開始・継続・方法が不相当である場合に限り違法とした。","正しい。筑豊じん肺訴訟（最判平16.4.27）、関西水俣病訴訟（最判平16.10.15）。","誤り。最判平19.1.25は、児童養護施設（社会福祉法人）の職員の養育監護行為を県の公権力の行使に当たる公務員の行為とした。","誤り。4条により民法の規定が適用される。","誤り。上記のとおり、著しく合理性を欠く場合には違法となる。"],"answer":1},{"id":"q03","area":"国賠：2条・損失補償","topic":"2条の営造物責任","basis":["国家賠償法2条・3条","最判昭45.8.20（高知落石）","最判昭53.7.4（防護柵転落）","最判昭59.1.26（大東水害）"],"tip":"","kind":"mc","format":"妥当なもの","stem":"国家賠償法2条に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["国家賠償法2条の「公の営造物」は不動産に限られ、動産は含まれない。","河川管理の瑕疵の有無は、道路管理と同一の基準で判断され、財政的制約は考慮されない。","営造物の設置又は管理の瑕疵とは、営造物が通常有すべき安全性を欠いていることをいい、これに基づく賠償責任については過失の存在を必要としない。","道路の防護柵を子どもが乗り越えて転落した場合、それが通常予測できない異常な行動による事故であっても、設置管理者は常に賠償責任を負う。","営造物の設置管理者と費用負担者とが異なるときは、被害者は設置管理者に対してのみ損害賠償を請求できる。"],"why":["誤り。動産も含まれると解されている。","誤り。大東水害訴訟（最判昭59.1.26）は、河川管理の特質や財政的・技術的・社会的制約を考慮して判断するとした。","正しい。高知落石事件（最判昭45.8.20）。無過失責任。","誤り。最判昭53.7.4は、通常の用法に即しない異常な行動による事故として責任を否定した。","誤り。費用負担者にも請求できる（3条1項）。"],"answer":2},{"id":"q04","area":"国賠：2条・損失補償","topic":"国家賠償法の諸規定と判例","basis":["国家賠償法2条2項・4条・6条","最判昭53.7.17","最判昭57.3.12"],"tip":"","kind":"mc","format":"個数","stem":"国家賠償に関する次の記述ア〜オのうち、法令の規定および判例に照らし、\u003cb>妥当なものはいくつ\u003c/b>あるか。","items":["国家賠償法は、外国人が被害者である場合には、相互の保証があるときに限り、適用される。","国又は公共団体の損害賠償の責任については、国家賠償法の規定によるほか、民法の規定による。","公の営造物の設置又は管理の瑕疵による損害について、他に損害の原因について責に任ずべき者があるときは、国又は公共団体は、これに対して求償権を有する。","失火責任法は国家賠償法4条の「民法」に含まれないので、公務員の失火による国家賠償責任には適用されない。","裁判官がした争訟の裁判が国家賠償法上違法となるのは、裁判官が違法又は不当な目的をもって裁判をしたなど、付与された権限の趣旨に明らかに背いて行使したと認め得るような特別の事情がある場合に限られる。"],"itemOk":[true,true,true,false,true],"itemWhy":["正しい。6条。","正しい。4条。","正しい。2条2項。","誤り。最判昭53.7.17は、失火責任法も「民法」に含まれ、公務員に重大な過失がある場合に限り責任が生ずるとした。","正しい。最判昭57.3.12。"],"options":["一つ","二つ","三つ","四つ","五つ"],"answer":3},{"id":"q05","area":"国賠：2条・損失補償","topic":"正当な補償","basis":["憲法29条3項","最判昭48.10.18","最大判昭43.11.27","最判昭58.2.18","最大判昭28.12.23"],"tip":"国家賠償＝違法な行為、損失補償＝適法な行為。出発点の違いで肢を切れることが多い。","kind":"mc","format":"妥当なもの","stem":"損失補償に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["損失補償の規定を欠く法令に基づいて財産権を制限することは、当然に違憲無効となる。","道路工事の結果、警察法規上の基準に適合させるため地下の石油タンクを移設せざるを得なくなった場合の損失は、道路法上の補償の対象となる。","土地収用法における損失の補償は、収用の前後を通じて被収用者の有する財産価値を等しくさせるような完全な補償をなすべきである。","損失補償は、違法な公権力の行使によって生じた損失を填補するものである。","農地改革における農地買収の対価は、市場価格によらなければ、憲法29条3項の「正当な補償」に当たらない。"],"why":["誤り。河川附近地制限令事件（最大判昭43.11.27）は、直接憲法29条3項を根拠に補償を請求する余地があるとし、当然に違憲無効とはしなかった。","誤り。最判昭58.2.18は、警察規制による損失であり補償の対象外とした。","正しい。最判昭48.10.18。","誤り。損失補償は適法な公権力の行使による特別の犠牲の填補。違法な行為は国家賠償の問題。","誤り。最大判昭28.12.23は、合理的に算出された相当な額で足りるとした（相当補償説）。"],"answer":2},{"id":"q06","area":"国賠：1条","topic":"立法・司法・課税と違法性","basis":["最大判平27.12.16","最判昭53.10.20（芦別事件）","最判平5.3.11"],"tip":"","kind":"mc","format":"妥当なもの","stem":"国家賠償法上の違法性に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["検察官が公訴を提起した事件について無罪判決が確定した場合には、公訴の提起は当然に国家賠償法上違法となる。","税務署長が所得金額を過大に認定した更正処分は、そのことから直ちに国家賠償法上違法となる。","国家賠償請求は、公務員個人を被告として提起しなければならない。","国が公務員の不法行為について責任を負うのは、選任監督に過失がある場合に限られる。","国会議員の立法行為（立法不作為を含む）が国家賠償法上違法となるのは、法律の規定が憲法上保障された権利を違法に侵害することが明白であるにもかかわらず、国会が正当な理由なく長期にわたって改廃等の立法措置を怠る場合などに限られる。"],"why":["誤り。芦別事件（最判昭53.10.20）は、無罪判決が確定しても公訴提起が当然に違法となるわけではないとした。","誤り。最判平5.3.11は、職務上通常尽くすべき注意義務を尽くすことなく漫然と更正をした場合に限り違法とした。","誤り。被告は国又は公共団体。公務員個人は直接責任を負わない。","誤り。国家賠償法1条には、民法715条ただし書のような選任監督上の免責規定はない。","正しい。再婚禁止期間違憲訴訟（最大判平27.12.16）など。"],"answer":4},{"id":"q07","area":"地自：組織・条例","topic":"地方公共団体の種類と事務","basis":["地方自治法1条の3・2条・14条・252条の20・284条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"地方公共団体に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["指定都市は、市長の権限に属する事務を分掌させるため、条例で、その区域を分けて区を設ける。","特別区は、普通地方公共団体である。","法定受託事務についても、地方公共団体は、法令に違反しない限りにおいて条例を制定することができる。","地方公共団体の事務は、自治事務と法定受託事務とに区分される。","地方公共団体の組合には、一部事務組合と広域連合がある。"],"why":["正しい。252条の20第1項。","誤り（これが正解）。特別区は特別地方公共団体（1条の3第3項）。","正しい。14条1項・2条2項。","正しい。2条8項・9項。","正しい。284条1項。"],"answer":1},{"id":"q08","area":"地自：組織・条例","topic":"条例と規則","basis":["地方自治法14条・15条・74条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"条例および規則に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["普通地方公共団体は、法令に特別の定めがあるものを除くほか、条例中に、条例に違反した者に対し、2年以下の拘禁刑、100万円以下の罰金、拘留、科料若しくは没収の刑又は5万円以下の過料を科する旨の規定を設けることができる。","条例の制定又は改廃の請求は、選挙権を有する者の総数の3分の1以上の連署をもって、議会の議長に対して行う。","地方税の賦課徴収並びに分担金、使用料及び手数料の徴収に関する条例も、条例の制定改廃請求の対象となる。","普通地方公共団体は、義務を課し、又は権利を制限するには、法令に特別の定めがある場合を除くほか、規則によらなければならない。","普通地方公共団体の長は、規則中に、規則に違反した者に対し、刑罰を科する旨の規定を設けることができる。"],"why":["正しい。14条3項（刑法改正により懲役・禁錮は拘禁刑に一本化された）。","誤り。50分の1以上の連署で、長に対して行う（74条1項）。","誤り。これらの条例は請求の対象外（74条1項括弧書）。","誤り。義務を課し権利を制限するには条例による（14条2項）。","誤り。規則で定められるのは5万円以下の過料のみ（15条2項）。"],"answer":0},{"id":"q09","area":"地自：住民の権利","topic":"直接請求","basis":["地方自治法74条〜76条・80条・81条・86条"],"tip":"請求先は「条例＝長」「監査＝監査委員」「解散・議員・長の解職＝選挙管理委員会」「主要公務員の解職＝長」。表にして覚える。","kind":"mc","format":"個数","stem":"直接請求に関する次の記述ア〜オのうち、地方自治法の規定に照らし、\u003cb>妥当なものはいくつ\u003c/b>あるか。","items":["事務の監査の請求は、選挙権を有する者の総数の50分の1以上の者の連署をもって、監査委員に対して行う。","議会の解散の請求は、原則として選挙権を有する者の総数の3分の1以上の者の連署をもって、選挙管理委員会に対して行う。","長の解職の請求は、原則として選挙権を有する者の総数の3分の1以上の者の連署をもって、議会の議長に対して行う。","副知事又は副市町村長の解職の請求は、原則として選挙権を有する者の総数の3分の1以上の者の連署をもって、普通地方公共団体の長に対して行う。","条例の制定改廃の請求があったときは、長は、請求を受理した日から20日以内に議会を招集し、意見を付けてこれを議会に付議しなければならない。"],"itemOk":[true,true,false,true,true],"itemWhy":["正しい。75条1項。","正しい。76条1項。大規模団体には連署数の特例がある。","誤り。長・議員の解職請求は選挙管理委員会に対して行う（80条・81条）。","正しい。86条1項。","正しい。74条3項。"],"options":["一つ","二つ","三つ","四つ","五つ"],"answer":3},{"id":"q10","area":"地自：議会・執行機関","topic":"議会の招集と運営","basis":["地方自治法100条〜102条の2・115条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"普通地方公共団体の議会に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["議会は、条例で定めるところにより、定例会及び臨時会とせず、毎年、条例で定める日から翌年の当該日の前日までを会期とすることができる。","議会は、当該普通地方公共団体の事務に関する調査を行い、選挙人その他の関係人の出頭及び証言並びに記録の提出を請求することができる。","議会の会議は公開が原則であるが、議長又は議員3人以上の発議により、出席議員の3分の2以上の多数で議決したときは、秘密会を開くことができる。","議会は長が招集するので、議長が臨時会の招集を請求しても、長が招集しないときは、臨時会を開くことはできない。","議長は、議会運営委員会の議決を経て、長に対し、会議に付議すべき事件を示して臨時会の招集を請求することができる。"],"why":["正しい。通年会期（102条の2第1項）。","正しい。100条1項（百条調査権）。","正しい。115条1項。","誤り（これが正解）。長が所定の期間内に招集しないときは、議長が臨時会を招集できる（101条5項）。","正しい。101条2項。"],"answer":3},{"id":"q11","area":"地自：議会・執行機関","topic":"長と議会の関係","basis":["地方自治法176条・178条・179条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"長と議会との関係に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["長の不信任の議決は、議員数の過半数の者が出席し、その過半数の者の同意で足りる。","議会において長の不信任の議決をしたときは、議長は直ちにその旨を長に通知しなければならず、長はその通知を受けた日から10日以内に議会を解散することができる。","議会の議決が法令に違反すると認めるときでも、長はこれを再議に付すことはできない。","条例の制定又は改廃に関する議決について長が再議に付した場合、議会が出席議員の過半数で再び同じ議決をすれば、その議決は確定する。","議会が成立しないときであっても、長は専決処分をすることはできない。"],"why":["誤り。議員数の3分の2以上が出席し、その4分の3以上の同意が必要（178条3項）。解散後初めての議会では過半数の同意で足りる。","正しい。178条1項。","誤り。違法な議決は再議に付さなければならない（176条4項）。","誤り。出席議員の3分の2以上の同意が必要（176条3項）。","誤り。議会が成立しないときなどは専決処分ができる（179条1項）。"],"answer":1},{"id":"q12","area":"地自：住民の権利","topic":"住民監査請求と住民訴訟","basis":["地方自治法242条・242条の2・252条の36"],"tip":"事務監査請求（選挙権者の50分の1・すべての事務）と住民監査請求（住民1人から・財務会計行為）の違いが頻出。","kind":"mc","format":"妥当でないもの","stem":"住民監査請求および住民訴訟に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["住民監査請求は、正当な理由がない限り、当該行為のあった日又は終わった日から1年を経過したときは、することができない。","住民訴訟は、住民監査請求をした住民に限り、提起することができる。","住民訴訟の対象は、財務会計上の行為又は怠る事実に限られる。","包括外部監査契約は、都道府県、指定都市及び中核市には締結が義務付けられている。","住民監査請求は、当該普通地方公共団体の住民であって、かつ選挙権を有する者でなければすることができない。"],"why":["正しい。242条2項。","正しい。監査請求前置（242条の2第1項）。","正しい。","正しい。252条の36第1項・同法施行令。","誤り（これが正解）。住民であれば足り、選挙権の有無は問わない。1人でもできる（242条1項）。"],"answer":4},{"id":"q13","area":"地自：施設・関与・財務","topic":"公の施設","basis":["地方自治法244条〜244条の4"],"tip":"","kind":"mc","format":"妥当なもの","stem":"公の施設に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["普通地方公共団体は、正当な理由がない限り、住民が公の施設を利用することを拒んではならず、利用について不当な差別的取扱いをしてはならない。","公の施設の設置及び管理に関する事項は、長の定める規則で定める。","指定管理者は、地方公共団体が出資する法人に限られる。","指定管理者の指定をするにあたり、議会の議決を経る必要はない。","指定管理者がした公の施設を利用する権利に関する処分についての審査請求は、指定管理者に対してしなければならない。"],"why":["正しい。244条2項・3項。","誤り。条例で定める（244条の2第1項）。","誤り。法人その他の団体であれば足りる（244条の2第3項）。","誤り。あらかじめ議会の議決を経なければならない（244条の2第6項）。","誤り。普通地方公共団体の長に対してする（244条の4第1項）。"],"answer":0},{"id":"q14","area":"地自：施設・関与・財務","topic":"国の関与","basis":["地方自治法245条の2・245条の5・250条の7・250条の13・251条の5"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"国の関与および係争処理に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["各大臣は、自治事務の処理が法令の規定に違反していると認めるとき等には、是正の要求をすることができる。","国地方係争処理委員会は、総務省に置かれる。","普通地方公共団体は、法律又はこれに基づく政令によらなくても、その事務の処理に関し国の行政機関の関与を受けることがある。","普通地方公共団体の長その他の執行機関は、国の関与に不服があるときは、国地方係争処理委員会に対し審査の申出をすることができる。","国地方係争処理委員会の勧告等に不服があるときは、普通地方公共団体の長等は、高等裁判所に対し、国の関与の取消し等を求める訴えを提起することができる。"],"why":["正しい。245条の5。","正しい。250条の7第1項。","誤り（これが正解）。関与の法定主義（245条の2）により、法律又はこれに基づく政令によらなければ関与を受けない。","正しい。250条の13第1項。","正しい。251条の5第1項。"],"answer":2},{"id":"q15","area":"地自：施設・関与・財務","topic":"財務","basis":["地方自治法112条・149条・208条・211条・233条・234条"],"tip":"","kind":"mc","format":"組合せ","stem":"普通地方公共団体の財務に関する次の記述ア〜オのうち、地方自治法の規定に照らし、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","items":["予算は、長が会計年度ごとに調製し、年度開始前に議会の議決を経なければならない。","普通地方公共団体の会計年度は、毎年4月1日に始まり、翌年3月31日に終わる。","契約は随意契約によることが原則であり、一般競争入札は政令で定める場合に限り行うことができる。","予算を議会に提出する権限は、長と議員の双方にある。","決算は、会計管理者が調製し、直接議会の認定に付さなければならない。"],"itemOk":[true,true,false,false,false],"itemWhy":["正しい。211条1項。","正しい。208条1項。","誤り。一般競争入札が原則で、指名競争入札・随意契約・せり売りは政令で定める場合に限られる（234条1項・2項）。","誤り。予算の提出権は長に専属する（112条1項ただし書・149条2号）。","誤り。会計管理者が調製して長に提出し、監査委員の審査を経て、長が議会の認定に付す（233条）。"],"options":["ア・イ","ア・ウ","ア・エ","イ・オ","ウ・エ"],"answer":0},{"id":"q16","area":"地自：議会・執行機関","topic":"執行機関と補助機関","basis":["地方自治法161条・163条・168条・180条の5・196条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"執行機関および補助機関に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["長は、副知事又は副市町村長を任期中に解職することはできない。","副知事及び副市町村長の定数は、法律で1人と定められている。","会計管理者は、長が議会の同意を得て選任する。","監査委員は、議会が選挙する。","都道府県には、執行機関として、教育委員会、選挙管理委員会、人事委員会、監査委員等を置かなければならない。"],"why":["誤り。いつでも解職できる（163条）。","誤り。条例で定める（161条2項）。","誤り。補助機関である職員のうちから長が命ずる（168条2項）。","誤り。長が議会の同意を得て選任する（196条1項）。","正しい。180条の5第1項・2項。"],"answer":4},{"id":"q17","area":"地自：住民の権利","topic":"住民の権利","basis":["地方自治法10条・18条・19条・242条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"住民に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["日本国民たる年齢満18年以上の者で引き続き1年以上市町村の区域内に住所を有するものは、その普通地方公共団体の議会の議員及び長の選挙権を有する。","都道府県知事の被選挙権は、日本国民で年齢満30年以上のものが有する。","住民監査請求は、外国人の住民もすることができる。","住民は、法律の定めるところにより、その属する普通地方公共団体の役務の提供をひとしく受ける権利を有し、その負担を分任する義務を負う。","市町村の区域内に住所を有する者は、当該市町村及びこれを包括する都道府県の住民とする。"],"why":["誤り（これが正解）。引き続き3か月以上（18条）。","正しい。19条2項。","正しい。住民であれば国籍を問わない。","正しい。10条2項。","正しい。10条1項。"],"answer":0},{"id":"q18","area":"地自：住民の権利","topic":"住民訴訟の手続","basis":["地方自治法242条10項・242条の2・242条の3","最判平24.4.20"],"tip":"","kind":"mc","format":"妥当なもの","stem":"住民訴訟に関する次の記述のうち、地方自治法の規定および判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["住民訴訟で勝訴した原告は、弁護士報酬の支払を請求することはできない。","議会は、住民訴訟の係属中であっても、その対象である損害賠償請求権を放棄する議決をすることは一切できない。","いわゆる4号請求の住民訴訟で損害賠償の請求を命ずる判決が確定した場合、長は、判決確定の日から60日以内の日を期限として、損害賠償金の支払を請求しなければならない。","住民訴訟は、監査の結果の通知があった日から6か月以内に提起しなければならない。","4号請求の住民訴訟の被告は、損害賠償責任を負うとされる職員個人である。"],"why":["誤り。相当と認められる額の支払を請求できる（242条の2第12項）。","誤り。最判平24.4.20は、放棄の議決は裁量権の逸脱・濫用に当たるときは違法無効になるとしつつ、一律には否定しなかった。現行法では、監査請求後に放棄の議決をする場合はあらかじめ監査委員の意見を聴く（242条10項）。","正しい。242条の3第1項。","誤り。30日以内（242条の2第2項1号）。","誤り。被告は執行機関又は職員（長など）であり、「職員個人に損害賠償を請求することを求める」訴訟（242条の2第1項4号）。"],"answer":2},{"id":"q19","area":"地自：議会・執行機関","topic":"議員","basis":["地方自治法90条〜93条・103条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"普通地方公共団体の議会の議員に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["議員の定数は、地方自治法で人口に応じた上限が定められている。","議員は、当該普通地方公共団体に対し請負をする者に当たる場合でも、各会計年度における請負の対価の総額が政令で定める額を超えないときは、兼業禁止の対象とならない。","議長は、当該普通地方公共団体の長が議員の中から指名する。","議員は、衆議院議員又は参議院議員と兼ねることができる。","議員の任期は2年である。"],"why":["誤り。条例で定める（90条・91条）。法定上限は廃止された。","正しい。92条の2（令和4年改正。政令で定める額は300万円）。","誤り。議会が議員の中から選挙する（103条1項）。","誤り。兼職禁止（92条1項）。","誤り。4年（93条1項）。"],"answer":1}]};
