<script>window.SET = {"id":"shoho-2","code":"商法強化","title":"商法・会社法 直前強化（誤答9問＋頻出8問）","lead":"商法・会社法は5問20点です。深追いせず「機関設計・株主総会・取締役・株式・募集株式」の基本ルールだけで2問以上を確実に取りにいきます。前半9問は前回の誤答の解き直しです。","minutes":25,"questions":[{"id":"q01","area":"商法総則・商行為","topic":"商行為の特則","basis":["商法504条・511条・512条・521条","民法404条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"商行為に関する次の記述のうち、商法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["商人間の留置権は、当事者の別段の意思表示によっても排除することができない。","商行為の代理人が本人のためにすることを示さないでこれをした場合であっても、その行為は、本人に対してその効力を生ずる。","商人がその営業の範囲内において他人のために行為をしたときでも、報酬の約束がなければ相当な報酬を請求することはできない。","数人の者がその一人又は全員のために商行為となる行為によって債務を負担したときは、その債務は各自が分割して負担する。","商行為によって生じた債務の法定利率は、年6分である。"],"why":["誤り。別段の意思表示があれば排除できる（521条ただし書）。","正しい。商法504条本文。","誤り。相当な報酬を請求できる（512条）。","誤り。連帯債務となる（511条1項）。","誤り。平成29年の民法改正にあわせて商事法定利率は廃止され、民法の法定利率（404条）による。"],"answer":1},{"id":"q02","area":"会社法（設立・株式）","topic":"株式","basis":["会社法107条・126条・127条・188条・453条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"株式に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["株主に対してする通知は、株主名簿に記載された株主の住所にあてて発すれば足りる。","株式会社は、その発行する全部の株式の内容として、譲渡による取得について株式会社の承認を要することを定款で定めることができる。","単元株式数は、1000及び発行済株式の総数の200分の1に当たる数を超えることはできない。","株主は、その有する株式を譲渡することができる。","株式会社は、自己株式についても剰余金の配当をすることができる。"],"why":["正しい。126条1項。","正しい。107条1項1号（譲渡制限株式）。","正しい。188条2項・会社法施行規則34条。","正しい。127条（株式譲渡自由の原則）。","誤り（これが正解）。自己株式に剰余金の配当はできない（453条括弧書）。"],"answer":4},{"id":"q03","area":"会社法（機関）","topic":"株主総会","basis":["会社法295条・299条・309条・310条・831条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"株主総会に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["公開会社の株主総会の招集通知は、総会の日の1週間前までに発すれば足りる。","株主は、議決権を代理人によって行使することはできない。","株主総会の決議の取消しの訴えは、決議の日から6か月以内に提起しなければならない。","株主総会の特別決議は、出席した株主の議決権の過半数で成立する。","取締役会設置会社においては、株主総会は、会社法に規定する事項及び定款で定めた事項に限り、決議をすることができる。"],"why":["誤り。2週間前まで（299条1項）。","誤り。代理人によって行使できる（310条1項）。","誤り。3か月以内（831条1項）。","誤り。原則として出席株主の議決権の3分の2以上の多数が必要（309条2項）。","正しい。295条2項。"],"answer":4},{"id":"q04","area":"会社法（機関）","topic":"機関設計","basis":["会社法326条〜328条・333条・335条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"株式会社の機関設計に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["すべての株式会社は、取締役会を置かなければならない。","監査役は、株式会社若しくはその子会社の取締役若しくは支配人その他の使用人を兼ねることができる。","公開会社である大会社（監査等委員会設置会社及び指名委員会等設置会社を除く。）は、監査役会及び会計監査人を置かなければならない。","指名委員会等設置会社は、監査役を置かなければならない。","会計参与には、公認会計士・監査法人のみがなることができ、税理士はなることができない。"],"why":["誤り。公開会社等を除き任意（327条1項・326条2項）。","誤り。兼任禁止（335条2項）。","正しい。328条1項。","誤り。監査役を置いてはならない（327条4項）。","誤り。税理士・税理士法人もなれる（333条1項）。"],"answer":2},{"id":"q05","area":"会社法（計算・再編）","topic":"募集株式の発行","basis":["会社法2条21号・199条・201条・210条・828条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"募集株式の発行等に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["株式の発行が法令・定款に違反し又は著しく不公正な方法により行われる場合において、株主が不利益を受けるおそれがあるときは、株主はその発行をやめることを請求することができる。","公開会社において、払込金額が引受人に特に有利な金額である場合でも、取締役会の決議のみで募集事項を決定することができる。","公開会社が取締役会の決議で募集事項を定めた場合には、払込期日の2週間前までに、株主に対し募集事項を通知又は公告しなければならない。","新株予約権とは、株式会社に対して行使することにより、当該株式会社の株式の交付を受けることができる権利をいう。","公開会社における新株発行の無効の訴えは、株式の発行の効力が生じた日から6か月以内に提起しなければならない。"],"why":["正しい。210条。","誤り（これが正解）。有利発行には株主総会の特別決議が必要（201条1項・199条3項・309条2項5号）。","正しい。201条3項・4項。","正しい。2条21号。","正しい。828条1項2号（非公開会社は1年）。"],"answer":1},{"id":"q06","area":"会社法（計算・再編）","topic":"剰余金の配当","basis":["会社法445条・454条・458条・459条・462条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"剰余金の配当に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["剰余金の配当をする場合には、配当により減少する剰余金の額の10分の1を、準備金の額が資本金の4分の1に達するまで、資本準備金又は利益準備金として計上しなければならない。","株式会社は、金銭以外の財産を配当することは一切できない。","剰余金の配当は、いかなる場合も取締役会の決議ですることはできない。","分配可能額を超えて剰余金の配当がされた場合でも、配当を受けた株主は会社に対して金銭等を返還する義務を負わない。","株式会社の純資産額が300万円を下回る場合でも、剰余金の配当をすることができる。"],"why":["正しい。445条4項・会社計算規則22条。","誤り。現物配当も可能（454条4項）。","誤り。中間配当（454条5項）や会計監査人設置会社の特則（459条）がある。","誤り。返還義務を負う（462条1項）。","誤り。配当できない（458条）。"],"answer":0},{"id":"q07","area":"会社法（設立・株式）","topic":"株主の権利","basis":["会社法125条・189条・303条・308条・433条"],"tip":"","kind":"mc","format":"個数","stem":"株主の権利に関する次の記述ア〜オのうち、会社法の規定に照らし、\u003cb>妥当なものはいくつ\u003c/b>あるか。","items":["公開会社である取締役会設置会社では、総株主の議決権の100分の1以上又は300個以上の議決権を6か月前から引き続き有する株主は、議題の提案をすることができる。","株主は、株式会社の営業時間内は、いつでも、請求の理由を明らかにして、株主名簿の閲覧又は謄写の請求をすることができる。","総株主の議決権の100分の3以上の議決権を有する株主は、会計帳簿の閲覧又は謄写の請求をすることができる。","単元未満株主は、定款の定めによっても、残余財産の分配を受ける権利を制限されることはない。","株主総会における議決権は1株につき1個であり、株式会社が単元株式数を定款で定めている場合も同様である。"],"itemOk":[true,true,true,true,false],"itemWhy":["正しい。303条2項。","正しい。125条2項。","正しい。433条1項。","正しい。189条2項5号。","誤り。単元株式数を定めた場合は1単元につき1個（308条1項ただし書）。"],"options":["一つ","二つ","三つ","四つ","五つ"],"answer":3},{"id":"q08","area":"会社法（機関）","topic":"代表取締役","basis":["会社法349条・350条・354条・362条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"代表取締役に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["代表取締役の権限に加えた制限は、善意の第三者にも対抗することができる。","表見代表取締役の規定により会社が責任を負うのは、第三者が悪意であっても同様である。","取締役会設置会社において、代表取締役は株主総会の決議で選定しなければならない。","株式会社は、代表取締役その他の代表者がその職務を行うについて第三者に加えた損害を賠償する責任を負う。","代表取締役は、いかなる場合も重要な財産の処分を単独で決定することができる。"],"why":["誤り。善意の第三者に対抗できない（349条5項）。","誤り。善意の第三者に対して責任を負う（354条）。","誤り。取締役会が選定する（362条3項）。","正しい。350条。","誤り。重要な財産の処分は取締役会の決議事項（362条4項1号）。"],"answer":3},{"id":"q09","area":"基礎法学","topic":"法令用語","basis":["基礎法学（法令用語）"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"法令用語に関する次の記述のうち、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["「みなす」とは、反対の証拠があれば覆すことができる事実の推定をいう。","「善意」とは、ある事実を知らないことをいう。","「及び」と「並びに」はいずれも併合的接続詞であり、接続が段階的になる場合、小さい接続に「及び」、大きい接続に「並びに」を用いる。","「又は」と「若しくは」はいずれも選択的接続詞であり、段階がある場合、大きい選択に「又は」、小さい選択に「若しくは」を用いる。","「以上」「以下」は、基準となる数値を含む。"],"why":["誤り（これが正解）。それは「推定する」。「みなす」は反証を許さず、法律上同一に扱う。","正しい。道徳的な善悪とは関係がない。","正しい。","正しい。","正しい。「超える」「未満」は含まない。"],"answer":0},{"id":"q10","area":"商法総則・商行為","topic":"商行為の特則","basis":["商法509条・511条・512条・521条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"商行為に関する次の記述のうち、商法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["商人がその営業の範囲内において他人のために行為をしたときでも、報酬の特約がなければ報酬を請求することはできない。","商人間の留置権は、留置物と被担保債権との間に個別的な牽連関係がなければ成立しない。","数人の者がその一人又は全員のために商行為となる行為によって債務を負担したときは、その債務は、各自が連帯して負担する。","商人が平常取引をする者からその営業の部類に属する契約の申込みを受けたときは、承諾の通知を発しなくても、直ちに契約が成立したものとみなされる。","商行為によって生じた債務の法定利率は年6分とされている。"],"why":["誤り。相当な報酬を請求することができる（512条）。","誤り。商人間の留置権には個別的な牽連関係は不要（521条）。","正しい。商法511条1項。","誤り。遅滞なく諾否の通知を発しなければならず、これを怠ったときに承諾したものとみなされる（509条）。","誤り。商事法定利率の規定は平成29年改正で削除され、民法の法定利率による。"],"answer":2},{"id":"q11","area":"会社法（機関）","topic":"株主総会の招集・決議・訴え","basis":["会社法299条・309条・339条・341条・830条・831条"],"tip":"","kind":"mc","format":"個数","stem":"株主総会に関する次の記述ア〜オのうち、会社法の規定に照らし、\u003cb>妥当なものはいくつ\u003c/b>あるか。","items":["公開会社において株主総会を招集するには、取締役は、株主総会の日の2週間前までに株主に対して招集通知を発しなければならない。","株主総会の特別決議は、原則として、議決権を行使することができる株主の議決権の過半数を有する株主が出席し、出席した株主の議決権の3分の2以上に当たる多数をもって行う。","累積投票によらずに選任された取締役を解任する株主総会の決議は、特別決議によらなければならない。","株主総会の決議の取消しの訴えは、決議の日から3か月以内に提起しなければならない。","株主総会の決議の無効確認の訴えは、決議の日から3か月以内に提起しなければならない。"],"itemOk":[true,true,false,true,false],"itemWhy":["正しい。299条1項。","正しい。309条2項。","誤り。普通決議で解任できる（339条1項・341条）。特別決議が必要なのは、累積投票で選任された取締役や監査役の解任。","正しい。831条1項。","誤り。決議の不存在・無効確認の訴えには期間制限がない（830条）。"],"options":["一つ","二つ","三つ","四つ","五つ"],"answer":2},{"id":"q12","area":"会社法（機関）","topic":"取締役・取締役会","basis":["会社法331条・356条・362条・365条・423条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"取締役および取締役会に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["取締役会は、重要な財産の処分及び譲受けの決定を、代表取締役に委任することができる。","取締役会設置会社においては、取締役は3人以上でなければならない。","取締役会設置会社では、代表取締役は株主総会の決議によってのみ選定される。","利益相反取引について取締役会の承認を受けた場合には、その取引によって会社に損害が生じても、取締役が任務を怠ったものと推定されることはない。","取締役会設置会社の取締役が自己のために会社と取引をしようとするときは、株主総会の承認を受けなければならない。"],"why":["誤り。重要な財産の処分及び譲受けは取締役に委任できない取締役会の専決事項（362条4項1号）。","正しい。331条5項。","誤り。代表取締役は取締役会が取締役の中から選定する（362条2項3号・3項）。","誤り。承認を受けていても、損害が生じれば任務懈怠が推定される（423条3項）。","誤り。取締役会設置会社では「取締役会」の承認（356条1項2号・365条1項）。"],"answer":1},{"id":"q13","area":"会社法（機関）","topic":"機関設計","basis":["会社法326条・327条"],"tip":"「公開会社→取締役会必須」「取締役会→原則監査役必須」「委員会型→会計監査人必須・監査役不可」の3本柱。","kind":"mc","format":"組合せ","stem":"株式会社の機関設計に関する次の記述ア〜オのうち、会社法の規定に照らし、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","items":["公開会社は、取締役会を置かなければならない。","監査等委員会設置会社及び指名委員会等設置会社は、会計監査人を置かなければならない。","公開会社でない株式会社は、取締役会を置くことができない。","取締役会設置会社は、公開会社でない会計参与設置会社であっても、必ず監査役を置かなければならない。","監査等委員会設置会社は、監査役を置くことができる。"],"itemOk":[true,true,false,false,false],"itemWhy":["正しい。327条1項1号。","正しい。327条5項。","誤り。公開会社でない会社も、定款で取締役会を置くことができる（326条2項）。","誤り。公開会社でない会計参与設置会社は、監査役を置かなくてよい（327条2項ただし書）。","誤り。監査等委員会設置会社・指名委員会等設置会社は監査役を置くことができない（327条4項）。"],"options":["ア・イ","ア・ウ","イ・ウ","イ・エ","イ・オ"],"answer":0},{"id":"q14","area":"会社法（設立・株式）","topic":"設立","basis":["会社法25条・28条・30条・49条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"株式会社の設立に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["発起人は、設立時発行株式を1株も引き受けなくてもよい。","発起設立においては、発起人以外の者も設立時発行株式を引き受けることができる。","現物出資に関する事項は、定款に記載しなくても効力を有する。","株式会社は、定款の認証を受けた時に成立する。","株式会社の設立に際して作成される定款は、公証人の認証を受けなければ、その効力を生じない。"],"why":["誤り。各発起人は1株以上引き受けなければならない（25条2項）。","誤り。発起設立では発起人が設立時発行株式の全部を引き受ける（25条1項1号）。発起人以外の者が引き受けるのは募集設立。","誤り。現物出資は変態設立事項で、定款に記載しなければ効力を生じない（28条）。","誤り。本店所在地で設立の登記をすることによって成立する（49条）。","正しい。30条1項。"],"answer":4},{"id":"q15","area":"会社法（設立・株式）","topic":"株式の基本","basis":["会社法107条・109条・127条・214条・308条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"株式に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["株式会社が有する自己株式についても、株主総会における議決権が認められる。","株式会社は、定款に定めがなくても、株券を発行しなければならない。","株式会社は、株主を、その有する株式の内容及び数に応じて平等に取り扱う必要はない。","株式会社は、その発行する全部の株式の内容として、譲渡による株式の取得について会社の承認を要する旨を定款で定めることができる。","株主は、その有する株式を譲渡することができない。"],"why":["誤り。自己株式には議決権がない（308条2項）。","誤り。株券を発行するのは定款で定めた場合に限る（214条）。","誤り。株主平等原則（109条1項）。","正しい。107条1項1号。","誤り。株式は譲渡することができる（127条）。"],"answer":3},{"id":"q16","area":"会社法（計算・再編）","topic":"募集株式の発行","basis":["会社法199条・201条・208条・210条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"募集株式の発行に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["募集株式の発行が著しく不公正な方法により行われる場合でも、株主はその発行の差止めを請求することはできない。","公開会社でない株式会社は、募集事項を取締役会の決議によって決定しなければならず、株主総会で決定することはできない。","公開会社において、払込金額が特に有利な金額である募集株式の発行は、取締役会の決議のみで行うことができる。","公開会社が募集株式を発行する場合、払込金額が引受人に特に有利な金額であるときを除き、募集事項は取締役会の決議によって定める。","募集株式の引受人は、払込期日までに払込みをしなかった場合でも、当然に株主となる。"],"why":["誤り。法令・定款違反又は著しく不公正な方法による場合で、株主が不利益を受けるおそれがあるときは差止めを請求できる（210条）。","誤り。公開会社でない会社では、募集事項は株主総会の特別決議で決定する（199条2項）。","誤り。有利発行には株主総会の特別決議が必要で、取締役は理由を説明しなければならない（199条3項・201条1項）。","正しい。201条1項・199条2項。","誤り。払込みをしないときは、株主となる権利を失う（208条5項）。"],"answer":3},{"id":"q17","area":"会社法（計算・再編）","topic":"剰余金の配当","basis":["会社法309条・454条・458条・461条・462条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"剰余金の配当に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["剰余金の配当は、分配可能額を超えてもすることができる。","金銭以外の財産で配当する場合において、株主に金銭分配請求権を与えないときでも、株主総会の普通決議で足りる。","取締役会設置会社は、定款の定めがなくても、取締役会の決議により一事業年度の途中に1回に限り剰余金の配当（中間配当）をすることができる。","分配可能額を超えて剰余金の配当がされた場合、配当を受けた株主は、善意であれば会社に対して金銭を支払う義務を負わない。","株式会社の純資産額が300万円を下回る場合には、剰余金の配当をすることができない。"],"why":["誤り。分配可能額を超えて配当することはできない（461条1項）。","誤り。金銭分配請求権を与えない現物配当は特別決議が必要（309条2項10号）。","誤り。中間配当には定款の定めが必要（454条5項）。","誤り。株主は善意・悪意を問わず、交付を受けた金銭等の帳簿価額に相当する金銭を支払う義務を負う（462条1項）。","正しい。458条。"],"answer":4}]};
