<script>window.SET = {"id":"minpo-3","code":"民法強化1","title":"民法 直前強化① 総則・物権","lead":"前回落とした意思表示・時効・物権変動・共有・条件を中心に、本試験で繰り返し出る「原則と例外」を確認します。肢を読むたびに「誰が・誰に対して・何ができるか」を意識してください。","minutes":20,"questions":[{"id":"q01","area":"能力・失踪","topic":"制限行為能力者","basis":["民法5条・9条・13条・21条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"制限行為能力者に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["成年被後見人が成年後見人の同意を得てした法律行為は、取り消すことができない。","被保佐人が保佐人の同意を得ずに日用品の購入をした場合には、保佐人はこれを取り消すことができる。","未成年者が法定代理人の同意を得ずにした法律行為は、単に権利を得、又は義務を免れる法律行為であっても、取り消すことができる。","成年被後見人がした日用品の購入その他日常生活に関する行為は、取り消すことができない。","制限行為能力者が行為能力者であることを信じさせるため詐術を用いたときであっても、その行為を取り消すことができる。"],"why":["誤り。成年被後見人は同意どおりに行動できるとは限らないため、同意を得た行為でも取り消すことができる。","誤り。日用品の購入など日常生活に関する行為は、保佐人の同意を要しない（13条1項ただし書）。","誤り。単に権利を得、又は義務を免れる行為は同意不要で、取り消せない（5条1項ただし書）。","正しい。9条ただし書。","誤り。詐術を用いたときは取り消すことができない（21条）。"],"answer":3},{"id":"q02","area":"意思表示","topic":"心裡留保・虚偽表示","basis":["民法93条・94条","最判昭45.7.24"],"tip":"","kind":"mc","format":"妥当なもの","stem":"心裡留保および虚偽表示に関する次の記述のうち、民法の規定および判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["心裡留保による意思表示は、相手方が表意者の真意を知ることができた場合であっても有効である。","通謀虚偽表示の無効を対抗することができない「善意の第三者」として保護されるためには、善意であれば足り、無過失であることや登記を備えていることは必要とされない。","AがBと通謀してA所有の土地をBに仮装譲渡した場合、Bの一般債権者は、当然に94条2項の第三者に当たる。","心裡留保により無効となる意思表示の無効は、善意の第三者にも対抗することができる。","虚偽表示の当事者から目的物を譲り受けた第三者が悪意であれば、その者からさらに譲り受けた善意の転得者も保護されない。"],"why":["誤り。相手方が真意でないことを知り、又は知ることができたときは無効（93条1項ただし書）。","正しい。判例（大判昭12.8.10、最判昭44.5.27など）。","誤り。単なる一般債権者は第三者に当たらない。目的物を差し押さえた債権者は当たる。","誤り。心裡留保による無効は、善意の第三者に対抗できない（93条2項）。","誤り。転得者自身が善意であれば保護される（最判昭45.7.24）。"],"answer":1},{"id":"q03","area":"意思表示","topic":"錯誤","basis":["民法95条"],"tip":"錯誤は「重要な錯誤→取消し」「重過失→原則不可（相手方悪意・重過失、共通錯誤は例外）」「第三者は善意無過失」。","kind":"mc","format":"組合せ","stem":"錯誤に関する次の記述ア〜オのうち、民法の規定に照らし、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","items":["法律行為の基礎とした事情についての認識が真実に反する錯誤（動機の錯誤）は、その事情が法律行為の基礎とされていることが表示されていたときに限り、取り消すことができる。","錯誤に基づく意思表示は、その錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものであるときは、取り消すことができる。","錯誤が表意者の重大な過失によるものであった場合には、相手方が表意者に錯誤があることを知っていたときでも、表意者は取り消すことができない。","錯誤による意思表示の取消しは善意の第三者に対抗することができず、第三者に過失があるかどうかは問わない。","錯誤による意思表示は、無効である。"],"itemOk":[true,true,false,false,false],"itemWhy":["正しい。95条2項。","正しい。95条1項。","誤り。相手方が錯誤を知り又は重大な過失で知らなかったとき、相手方も同一の錯誤に陥っていたときは、重過失があっても取り消せる（95条3項）。","誤り。保護されるのは「善意でかつ過失がない」第三者（95条4項）。","誤り。平成29年改正で「取消し」に変わった（95条1項）。"],"options":["ア・イ","ア・ウ","ア・エ","ウ・エ","エ・オ"],"answer":0},{"id":"q04","area":"意思表示","topic":"詐欺・強迫","basis":["民法96条・177条","大判昭17.9.30"],"tip":"","kind":"mc","format":"妥当なもの","stem":"詐欺および強迫に関する次の記述のうち、民法の規定および判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["強迫による意思表示の取消しは、善意でかつ過失がない第三者に対抗することができない。","相手方に対する意思表示について第三者が詐欺を行った場合、相手方がその事実を知り、又は知ることができたときに限り、その意思表示を取り消すことができる。","第三者が強迫を行った場合は、相手方がその事実を知り又は知ることができたときに限り、意思表示を取り消すことができる。","詐欺による意思表示の取消しは、善意の第三者に対抗することができないが、この第三者は過失があっても保護される。","詐欺による取消しの後に相手方から目的不動産を譲り受けた第三者との関係は96条3項で処理され、第三者が善意無過失であれば登記の有無を問わず保護される。"],"why":["誤り。強迫による取消しは、善意無過失の第三者にも対抗できる（96条3項は詐欺のみ）。","正しい。96条2項。","誤り。第三者による強迫の場合、相手方の善意・悪意を問わず取り消せる。","誤り。保護されるのは善意でかつ過失がない第三者（96条3項）。","誤り。取消し後の第三者とは対抗関係（177条）となり、先に登記を備えた方が優先する（大判昭17.9.30）。"],"answer":1},{"id":"q05","area":"代理","topic":"無権代理と相続","basis":["最判昭40.6.18","最判昭37.4.20","最判昭48.7.3","最判平5.1.21","最判平10.7.17"],"tip":"","kind":"mc","format":"妥当なもの","stem":"無権代理と相続に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["本人が追認を拒絶した後に死亡し、無権代理人が本人を相続した場合には、無権代理人は追認拒絶の効果を主張することができない。","無権代理人が本人を他の相続人と共同相続した場合には、他の共同相続人全員が追認しなくても、無権代理人の相続分に相当する部分については当然に有効となる。","無権代理人が本人を単独で相続した場合には、本人が自ら法律行為をしたのと同様の法律上の地位を生じ、無権代理人は追認を拒絶することができない。","本人が無権代理人を相続した場合、本人が追認を拒絶すれば、無権代理人が負うべきであった117条の責任を承継することもない。","本人が無権代理人を相続した場合には、本人は無権代理行為の追認を拒絶することができず、無権代理行為は当然に有効となる。"],"why":["誤り。追認拒絶により無権代理行為の効力が本人に及ばないことが確定しているため、無権代理人も追認拒絶の効果を主張できる（最判平10.7.17）。","誤り。他の共同相続人全員の追認がない限り、無権代理人の相続分についても当然には有効とならない（最判平5.1.21）。","正しい。最判昭40.6.18。","誤り。本人は無権代理人の117条の責任を相続により承継する（最判昭48.7.3）。","誤り。本人は追認を拒絶できる（最判昭37.4.20）。"],"answer":2},{"id":"q06","area":"時効","topic":"時効の援用・完成猶予","basis":["民法145条・150条","最判平11.10.21","最大判昭41.4.20"],"tip":"","kind":"mc","format":"個数","stem":"時効に関する次の記述ア〜オのうち、民法の規定および判例に照らし、\u003cb>妥当なものはいくつ\u003c/b>あるか。","items":["後順位抵当権者は、先順位抵当権の被担保債権の消滅時効を援用することができない。","裁判外で催告をした場合、6か月を経過するまでは時効は完成しないが、その期間中にされた再度の催告は、時効の完成猶予の効力を有しない。","保証人は、主たる債務の消滅時効を援用することができる。","物上保証人は、被担保債権の消滅時効を援用することができる。","債務者が消滅時効の完成後に債務を承認した場合には、時効完成の事実を知らなかったときでも、その後その時効を援用することは信義則上許されない。"],"itemOk":[true,true,true,true,true],"itemWhy":["正しい。最判平11.10.21。順位上昇の利益は反射的利益にすぎない。","正しい。150条1項・2項。","正しい。145条かっこ書。","正しい。145条かっこ書。","正しい。最大判昭41.4.20。"],"options":["一つ","二つ","三つ","四つ","五つ"],"answer":4},{"id":"q07","area":"時効","topic":"取得時効","basis":["民法162条・187条","最判昭42.7.21","最判昭33.8.28"],"tip":"","kind":"mc","format":"妥当なもの","stem":"取得時効に関する次の記述のうち、民法の規定および判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["賃借人として土地を占有している者も、20年間占有を継続すれば、所有権を時効取得することができる。","取得時効の完成後に原所有者から不動産を譲り受け登記を備えた第三者に対しても、時効取得者は登記なくして所有権を対抗できる。","自己の所有物については、取得時効が成立する余地はない。","占有者の承継人は、自己の占有のみを主張することも、前の占有者の占有を併せて主張することもできるが、前の占有者の占有を併せて主張する場合には、その瑕疵も承継する。","10年の取得時効が成立するためには、占有の全期間を通じて善意無過失であることが必要である。"],"why":["誤り。賃借人の占有は「所有の意思」のない他主占有で、所有権の時効取得はできない（162条）。","誤り。時効完成後の第三者とは対抗関係になり、登記が必要（最判昭33.8.28）。時効完成「前」の第三者には登記なく対抗できる。","誤り。自己の物についても取得時効は成立し得る（最判昭42.7.21）。","正しい。187条。","誤り。善意無過失は「占有の開始の時」に判断する（162条2項）。"],"answer":3},{"id":"q08","area":"物権変動","topic":"不動産物権変動と登記（判例）","basis":["民法177条・899条の2・939条","最判昭42.1.20","最判平8.10.29","最判昭25.12.19"],"tip":"","kind":"mc","format":"組合せ","stem":"不動産の物権変動と登記に関する次の記述ア〜オのうち、民法の規定および判例に照らし、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","items":["AがBに不動産を売却した後、詐欺を理由に契約を取り消したが、その後BがCに当該不動産を譲渡した場合、AとCは対抗関係に立ち、先に登記を備えた方が優先する。","背信的悪意者からの転得者は、転得者自身が背信的悪意者と評価されない場合でも、所有権の取得を第一譲受人に対抗することができない。","遺産分割によって法定相続分を超える権利を取得した相続人は、その超える部分についても、登記なくして第三者に対抗することができる。","不動産の不法占拠者に対して所有権に基づく明渡しを請求するには、所有者は登記を備えていなければならない。","共同相続人の一人が相続を放棄した場合、他の相続人は、放棄によって増加した持分の取得を、登記なくして第三者に対抗することができる。"],"itemOk":[true,false,false,false,true],"itemWhy":["正しい。取消し後の第三者とは対抗関係（大判昭17.9.30）。","誤り。転得者自身が背信的悪意者でなければ、第一譲受人に対抗できる（最判平8.10.29）。","誤り。法定相続分を超える部分は、登記がなければ第三者に対抗できない（899条の2第1項）。","誤り。不法占拠者は177条の「第三者」に当たらず、登記なく明渡しを請求できる（最判昭25.12.19）。","正しい。放棄は初めから相続人でなかったことになる（939条）ため、登記なく対抗できる（最判昭42.1.20）。"],"options":["ア・イ","ア・ウ","ア・オ","イ・オ","エ・オ"],"answer":2},{"id":"q09","area":"所有権・共有","topic":"共有（令和3年改正）","basis":["民法249条・251条・252条・255条・256条"],"tip":"変更＝全員（軽微変更は過半数）、管理＝持分の過半数、保存＝単独。","kind":"mc","format":"妥当なもの","stem":"共有に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["共有物を使用する共有者は、別段の合意の有無にかかわらず、他の共有者に対して自己の持分を超える使用の対価を償還する義務を負わない。","共有者の一人が持分を放棄したときは、その持分は国庫に帰属する。","各共有者はいつでも共有物の分割を請求することができ、共有者間で分割をしない旨の契約をすることは一切できない。","共有物の保存行為をするには、各共有者の持分の価格の過半数の同意が必要である。","共有物に変更を加える行為であっても、その形状又は効用の著しい変更を伴わないものは、各共有者の持分の価格に従い、その過半数で決することができる。"],"why":["誤り。別段の合意がある場合を除き、自己の持分を超える使用の対価を償還する義務を負う（249条2項）。","誤り。他の共有者に帰属する（255条）。","誤り。5年を超えない期間内は分割をしない旨の契約をすることができる（256条1項ただし書）。","誤り。保存行為は各共有者が単独でできる（252条5項）。","正しい。いわゆる軽微変更は管理行為として持分の過半数で決する（251条1項かっこ書・252条1項）。"],"answer":4},{"id":"q10","area":"無効・取消し・条件","topic":"条件・期限","basis":["民法127条・130条・133条・134条・136条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"条件および期限に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["条件が成就することによって利益を受ける当事者が不正にその条件を成就させたときは、相手方は、その条件が成就しなかったものとみなすことができる。","停止条件付法律行為は、その法律行為の時からその効力を生ずる。","不能の停止条件を付した法律行為は、無条件となる。","期限は、債権者の利益のために定めたものと推定される。","停止条件付法律行為は、その条件が単に債権者の意思のみに係るときは無効とする。"],"why":["正しい。130条2項。","誤り。停止条件が成就した時から効力を生ずる（127条1項）。","誤り。不能の停止条件を付した法律行為は無効（133条1項）。不能の「解除」条件なら無条件（同条2項）。","誤り。債務者の利益のために定めたものと推定される（136条1項）。","誤り。無効となるのは、条件が単に「債務者」の意思のみに係るとき（134条）。"],"answer":0},{"id":"q11","area":"担保物権","topic":"抵当権","basis":["民法304条・372条・379条・388条","最判平元.10.27","最判昭44.3.28"],"tip":"","kind":"mc","format":"妥当なもの","stem":"抵当権に関する次の記述のうち、民法の規定および判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["抵当権者が物上代位権を行使するためには、払渡し又は引渡しの後に差押えをすれば足りる。","土地に抵当権を設定した当時その土地の上に建物がなかった場合でも、その後に土地所有者が建物を建築したときは、法定地上権が成立する。","抵当権者は、抵当不動産の賃借人が支払う賃料についても、物上代位権を行使することができる。","抵当権の効力は、抵当権設定当時に存在した従物には及ばない。","抵当不動産の第三取得者は、抵当権消滅請求をすることができない。"],"why":["誤り。払渡し又は引渡しの「前」に差し押さえなければならない（372条・304条1項ただし書）。","誤り。法定地上権は、抵当権設定当時に土地上に建物が存在することが要件（388条）。","正しい。最判平元.10.27。","誤り。設定当時の従物にも抵当権の効力が及ぶ（最判昭44.3.28）。","誤り。第三取得者は抵当権消滅請求をすることができる（379条）。"],"answer":2},{"id":"q12","area":"能力・失踪","topic":"相手方の催告権（比較）","basis":["民法20条・114条・115条"],"tip":"確答なし→追認：行為能力者になった本人・法定代理人。確答なし→取消し：被保佐人・被補助人本人。無権代理→追認拒絶。","kind":"mc","format":"妥当なもの","stem":"相手方の催告権に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["相手方が被保佐人本人に対して保佐人の追認を得るよう催告した場合、被保佐人が期間内に追認を得た旨の通知を発しないときは、その行為を追認したものとみなされる。","無権代理の相手方が本人に対し相当の期間を定めて追認するかどうかを確答すべき旨の催告をした場合、本人がその期間内に確答をしないときは、追認したものとみなされる。","制限行為能力者の法定代理人に対して催告がされ、法定代理人が期間内に確答を発しないときは、その行為を取り消したものとみなされる。","制限行為能力者が行為能力者となった後、相手方がその者に対し1か月以上の期間を定めて追認するかどうかを催告した場合、その者が期間内に確答を発しないときは、その行為を追認したものとみなされる。","無権代理の相手方の催告権は、相手方が契約の時に代理権がないことを知らなかった場合に限り行使できる。"],"why":["誤り。被保佐人・被補助人本人への催告に通知がないときは「取り消したもの」とみなされる（20条4項）。","誤り。無権代理の催告に確答がないときは「追認を拒絶したもの」とみなされる（114条）。","誤り。法定代理人への催告に確答がないときは「追認したもの」とみなされる（20条2項）。","正しい。20条1項。","誤り。催告権は相手方が悪意でも行使できる。善意が必要なのは取消権（115条）。"],"answer":3}]};
