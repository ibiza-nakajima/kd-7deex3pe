<title>民法② 債権・親族・相続</title>

<style>
/* Layout: one narrow column, one question per screen, thumb-sized answer rows, sticky progress bar */
:root{
  --paper:#F4F5F8; --surface:#FFFFFF; --ink:#1A2033; --muted:#5A6174; --line:#D8DBE4;
  --accent:#27408B; --accent-soft:#E7EBF7; --ok:#1E7A4C; --ok-soft:#E2F2E9; --ng:#B42318; --ng-soft:#FBE8E6; --mid:#9A6700; --mid-soft:#FBF1DC;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-head:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141C; --surface:#1A1E29; --ink:#E7E9F0; --muted:#A1A7B7; --line:#2D3341;
  --accent:#93A8F0; --accent-soft:#222B45; --ok:#5DC48E; --ok-soft:#173224; --ng:#F08B80; --ng-soft:#3A1F1C; --mid:#E3B341; --mid-soft:#3A2F14; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141C; --surface:#1A1E29; --ink:#E7E9F0; --muted:#A1A7B7; --line:#2D3341;
  --accent:#93A8F0; --accent-soft:#222B45; --ok:#5DC48E; --ok-soft:#173224; --ng:#F08B80; --ng-soft:#3A1F1C; --mid:#E3B341; --mid-soft:#3A2F14; color-scheme:dark}
html{-webkit-text-size-adjust:100%;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.set-name{font-family:var(--f-head);font-size:16px;letter-spacing:.04em;min-width:0}
.bar a{color:var(--accent);font-size:13.5px;text-decoration:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.chip.on i{background:var(--ok)} .chip.off i{background:var(--ng)}
.track{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.track span{display:block;height:100%;background:var(--accent);transition:width .25s}
h1,h2{font-family:var(--f-head);font-weight:700;text-wrap:balance;margin:0;line-height:1.4}
h1{font-size:26px} h2{font-size:20px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px}
.qhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--f-head);font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.tag{font-size:12.5px;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);padding:1px 8px;border-radius:4px}
.stem b{color:var(--accent)}
.items{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.items div{display:grid;grid-template-columns:1.6em 1fr;gap:4px}
.items div > *{min-width:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;text-align:left;width:100%;font:inherit;color:var(--ink);
  background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;min-height:56px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt span:last-child{min-width:0}
.opt .n{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.opt:focus-visible,.btn:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.is-right{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-right .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.is-wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.is-wrong .n{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.opt.dim{opacity:.6}
.verdict{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:1.5px solid}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok)} .verdict.ng{background:var(--ng-soft);border-color:var(--ng)}
.verdict strong{font-size:19px;font-family:var(--f-head)}
.verdict.ok strong{color:var(--ok)} .verdict.ng strong{color:var(--ng)}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 14px}
summary{cursor:pointer;padding:12px 0;font-weight:700}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.why{display:flex;flex-direction:column;gap:12px;padding-bottom:14px}
.why div{display:grid;grid-template-columns:2.6em 1fr;gap:6px}
.why div > *{min-width:0}
.mk{font-weight:700;font-variant-numeric:tabular-nums}
.mk.o{color:var(--ok)} .mk.x{color:var(--ng)}
.basis{margin:0;padding:0 0 14px 1.2em;display:flex;flex-direction:column;gap:6px}
.tip{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:15px}
.tip b{color:var(--accent)}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:14px 18px;min-height:52px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--surface);width:100%;text-align:center;text-decoration:none;display:block;box-sizing:border-box}
.btn.ghost{background:transparent;color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 180px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.note{font-size:14px;color:var(--muted)}
.savenote{font-size:13px;color:var(--muted)}
textarea{width:100%;box-sizing:border-box;font:inherit;font-size:17px;line-height:1.8;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:120px;resize:vertical}
.count{font-size:14px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.count.over{color:var(--ng)}
.model{font-family:var(--f-head);font-size:18px;line-height:1.8;background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.checks label > *{min-width:0}
.checks input{width:22px;height:22px;accent-color:var(--accent)}
.pts{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.score{font-family:var(--f-head);font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.score small{font-size:18px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats > div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--muted)}
.areas{display:flex;flex-direction:column;gap:10px}
.area{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.area > *{min-width:0}
.area .nm{font-weight:700;font-size:15px}
.area .val{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);white-space:nowrap}
.area .meter{grid-column:1 / -1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.area .meter span{display:block;height:100%}
.lv{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px;white-space:nowrap}
.lv.weak{background:var(--ng-soft);color:var(--ng)} .lv.mid{background:var(--mid-soft);color:var(--mid)} .lv.good{background:var(--ok-soft);color:var(--ok)}
.misslist{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:15px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:700;color:var(--muted);font-size:12.5px}
td.o{color:var(--ok);font-weight:700} td.x{color:var(--ng);font-weight:700}
.copybox{width:100%;box-sizing:border-box;font-size:13px;min-height:160px;font-family:ui-monospace,Menlo,monospace}
.toast{font-size:14px;color:var(--ok);min-height:1.4em}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<script>
const SET = {"id":"minpo-2","code":"民法2","title":"民法② 債権・親族・相続","lead":"債務不履行・責任財産の保全・多数当事者・契約各論・不法行為と、親族・相続（近年の改正点を含む）を確認します。最後に記述式を1問解きます。","minutes":45,"questions":[{"id":"q01","area":"債権：効力・保全","topic":"債務不履行","basis":["民法412条の2・415条・419条・420条・541条〜543条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"債務不履行に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["債務不履行による契約の解除には、債務者の帰責事由が必要である。","債務の履行が不能であっても、債権者はその債務の履行を請求することができる。","当事者が損害賠償の額を予定した場合、裁判所がその額を増減することは一切できない。","債務の不履行が、契約その他の債務の発生原因及び取引上の社会通念に照らして債務者の責めに帰することができない事由によるものであるときは、債権者は損害賠償を請求できない。","金銭債務の不履行については、債務者は不可抗力をもって抗弁とすることができる。"],"why":["誤り。平成29年改正後、解除に債務者の帰責事由は不要（541条・542条）。債権者に帰責事由があるときは解除できない（543条）。","誤り。履行不能のときは履行を請求できない（412条の2第1項）。","誤り。改正で「裁判所はその額を増減することができない」との文言は削除された。公序良俗違反などにより制限され得る。","正しい。415条1項ただし書。","誤り。不可抗力をもって抗弁とすることができない（419条3項）。"],"answer":3},{"id":"q02","area":"債権：効力・保全","topic":"債権者代位権","basis":["民法423条〜423条の7"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"債権者代位権に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["債権者は、その債権の期限が到来しない間は、保存行為を除き、被代位権利を行使することができない。","被代位権利の目的が可分であるときは、債権者は、自己の債権の額の限度においてのみ被代位権利を行使することができる。","債権者が被代位権利を行使した場合でも、債務者は、被代位権利について自ら取立てその他の処分をすることを妨げられない。","登記をしなければ権利の得喪を第三者に対抗できない財産の譲受人は、譲渡人が第三者に対して有する登記手続請求権を譲渡人が行使しないときは、その権利を行使することができる。","被代位権利が金銭の支払を目的とするものであっても、債権者は、相手方に対し、自己に直接支払うよう求めることはできない。"],"why":["正しい。423条2項。","正しい。423条の2。","正しい。423条の5。","正しい。423条の7（登記請求権の代位）。","誤り（これが正解）。金銭の支払又は動産の引渡しを目的とするときは、自己に直接支払・引渡しを求めることができる（423条の3）。"],"answer":4},{"id":"q03","area":"債権：効力・保全","topic":"詐害行為取消権","basis":["民法424条・424条の7・424条の9・425条・426条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"詐害行為取消権に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["詐害行為取消請求に係る訴えは、受益者及び債務者を被告として提起しなければならない。","詐害行為取消請求に係る訴えは、債務者が債権者を害することを知って行為をしたことを債権者が知った時から2年を経過したときは提起することができず、行為の時から10年を経過したときも同様である。","債権者は、受益者に対して金銭の支払を求める場合でも、自己に直接支払うよう求めることはできない。","財産権を目的としない行為も、詐害行為取消請求の対象となる。","詐害行為取消請求を認容する確定判決の効力は、債務者には及ばない。"],"why":["誤り。被告は受益者又は転得者（424条の7第1項）。債務者には訴訟告知をする（同条2項）。","正しい。426条。","誤り。自己に直接支払うよう求めることができる（424条の9）。","誤り。財産権を目的としない行為は対象外（424条2項）。","誤り。債務者及びその全ての債権者にも効力が及ぶ（425条）。"],"answer":1},{"id":"q04","area":"債権：多数当事者・譲渡","topic":"連帯債務","basis":["民法438条〜441条"],"tip":"連帯債務の絶対的効力は「更改・相殺・混同」の3つ（＋弁済等）。請求・免除・時効は相対的効力。","kind":"mc","format":"妥当でないもの","stem":"連帯債務に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["連帯債務者の一人と債権者との間に混同があったときは、その連帯債務者は弁済をしたものとみなす。","連帯債務者の一人が債権者に対して債権を有する場合に、その連帯債務者が相殺を援用しない間は、その負担部分の限度において、他の連帯債務者は債権者に対して債務の履行を拒むことができる。","連帯債務者の一人に対する履行の請求は、他の連帯債務者に対しても、その効力を生ずる。","連帯債務者の一人が債権者に対して債権を有する場合に、その連帯債務者が相殺を援用したときは、債権は全ての連帯債務者の利益のために消滅する。","連帯債務者の一人と債権者との間に更改があったときは、債権は全ての連帯債務者の利益のために消滅する。"],"why":["正しい。440条。","正しい。439条2項。","誤り（これが正解）。平成29年改正で履行の請求は相対的効力となった（441条）。","正しい。439条1項。","正しい。438条。"],"answer":2},{"id":"q05","area":"債権：多数当事者・譲渡","topic":"保証","basis":["民法446条・454条・457条・465条の2・465条の6"],"tip":"","kind":"mc","format":"妥当なもの","stem":"保証に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["連帯保証人は、催告の抗弁権及び検索の抗弁権を有する。","保証契約は、書面（又は電磁的記録）でしなければ、その効力を生じない。","個人根保証契約は、極度額を定めなくても効力を生ずる。","事業のために負担した貸金等債務を主たる債務とする保証契約は、保証人が法人である場合でも、公正証書で保証意思を表示しなければ効力を生じない。","主たる債務者に対する履行の請求その他の事由による時効の完成猶予及び更新は、保証人に対しては効力を生じない。"],"why":["誤り。連帯保証人には催告・検索の抗弁権がない（454条）。","正しい。446条2項・3項。","誤り。極度額を定めなければ効力を生じない（465条の2第2項）。","誤り。公正証書による保証意思宣明は個人保証の規律で、法人には適用されない（465条の6第3項）。","誤り。保証人に対しても効力を生ずる（457条1項）。"],"answer":1},{"id":"q06","area":"債権：多数当事者・譲渡","topic":"債権譲渡","basis":["民法466条・466条の6・467条","最判昭49.3.7"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"債権譲渡に関する次の記述のうち、民法の規定および判例に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["債権の譲渡は、譲渡人が債務者に通知をし、又は債務者が承諾をしなければ、債務者その他の第三者に対抗することができない。","債務者以外の第三者に対抗するには、通知又は承諾は確定日付のある証書によってしなければならない。","当事者が債権の譲渡を禁止し又は制限する旨の意思表示をしたときは、債権の譲渡は無効となる。","現に発生していない将来の債権も、譲渡することができる。","確定日付のある通知が二重にされた場合、譲受人相互の優劣は、通知が債務者に到達した日時の先後によって決する。"],"why":["正しい。467条1項。","正しい。467条2項。","誤り（これが正解）。譲渡制限の意思表示があっても、譲渡の効力は妨げられない（466条2項）。","正しい。466条の6第1項。","正しい。到達時説（最判昭49.3.7）。"],"answer":2},{"id":"q07","area":"債権：消滅","topic":"弁済・相殺","basis":["民法478条・493条・508条・509条・511条"],"tip":"","kind":"mc","format":"組合せ","stem":"弁済および相殺に関する次の記述ア〜オのうち、民法の規定に照らし、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","items":["債権者があらかじめ受領を拒んでいるときは、債務者は、弁済の準備をしたことを通知してその受領の催告をすれば、弁済の提供をしたことになる。","受領権者としての外観を有する者に対してした弁済は、弁済をした者が善意であり、かつ、過失がなかったときに限り、その効力を有する。","不法行為により生じた債権を受働債権とする相殺は、加害者が悪意で加えた不法行為に基づく損害賠償債務でない限り、常に許される。","差押えを受けた債権の第三債務者は、差押え後に取得した債権による相殺をもって差押債権者に対抗することができる。","時効によって消滅した債権は、その消滅以前に相殺に適するようになっていた場合でも、その債権者は相殺をすることができない。"],"itemOk":[true,true,false,false,false],"itemWhy":["正しい。口頭の提供（493条ただし書）。","正しい。478条。","誤り。人の生命又は身体の侵害による損害賠償債務を受働債権とする相殺も禁止される（509条2号）。","誤り。差押え前に取得した債権による相殺なら対抗できる（511条1項）。差押え後に取得した債権では原則として対抗できない。","誤り。相殺をすることができる（508条）。"],"options":["ア・イ","ア・ウ","イ・ウ","イ・エ","イ・オ"],"answer":0},{"id":"q08","area":"契約","topic":"同時履行・危険負担・解除","basis":["民法533条・536条・540条・541条・545条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"契約の効力および解除に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["双務契約の当事者の一方は、相手方がその債務の履行を提供するまでは自己の債務の履行を拒むことができ、相手方の債務が弁済期にないときも同様である。","契約の解除の意思表示は、撤回することができる。","債務の不履行がその契約及び取引上の社会通念に照らして軽微であるときでも、催告解除をすることができる。","解除によって金銭を返還するときは、利息を付す必要はない。","当事者双方の責めに帰することができない事由によって債務を履行することができなくなったときは、債権者は、反対給付の履行を拒むことができる。"],"why":["誤り。相手方の債務が弁済期にないときは同時履行の抗弁権はない（533条ただし書）。","誤り。撤回することができない（540条2項）。","誤り。軽微なときは催告解除できない（541条ただし書）。","誤り。受領の時から利息を付さなければならない（545条2項）。","正しい。536条1項（危険負担は履行拒絶権として構成）。"],"answer":4},{"id":"q09","area":"契約","topic":"売買・契約不適合","basis":["民法557条・562条・563条・566条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"売買に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["買主が相当の期間を定めて履行の追完の催告をし、その期間内に履行の追完がないときは、買主は、不適合の程度に応じて代金の減額を請求することができる。","不適合が買主の責めに帰すべき事由によるものであるときは、買主は履行の追完を請求することができない。","買主が売主に手付を交付したときは、相手方が契約の履行に着手するまでは、買主はその手付を放棄し、売主はその倍額を現実に提供して、契約の解除をすることができる。","種類又は品質に関して契約不適合な目的物が引き渡された場合、買主が不適合を知った時から1年以内に売主に通知しないときは、売主が引渡しの時に不適合を知っていたときでも、買主は担保責任を追及できない。","引き渡された目的物が契約の内容に適合しないときは、買主は、売主に対し、目的物の修補、代替物の引渡し又は不足分の引渡しによる履行の追完を請求することができる。"],"why":["正しい。563条1項。","正しい。562条2項。","正しい。557条1項。","誤り（これが正解）。売主が引渡しの時に不適合を知り、又は重大な過失によって知らなかったときは、期間制限は適用されない（566条ただし書）。","正しい。562条1項。"],"answer":3},{"id":"q10","area":"契約","topic":"賃貸借","basis":["民法605条の4・606条・608条・612条・613条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"賃貸借に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["賃借人は、賃貸人の承諾を得なくても、賃借物を転貸することができる。","賃借人が適法に賃借物を転貸した場合、賃貸人は、賃借人との間の賃貸借の合意解除をもって転借人に対抗することができないが、その解除の当時、賃貸人が賃借人の債務不履行による解除権を有していたときは、この限りでない。","賃貸人が賃貸物の保存に必要な行為をしようとするときは、賃借人はこれを拒むことができる。","不動産の賃借人は、対抗要件を備えていなくても、その不動産を占有する第三者に対して返還請求をすることができる。","賃借人が賃貸人の負担に属する必要費を支出したときは、賃貸借の終了の時に限り、その償還を請求することができる。"],"why":["誤り。賃貸人の承諾が必要（612条1項）。","正しい。613条3項。","誤り。拒むことができない（606条2項）。","誤り。対抗要件を備えた賃借人に限られる（605条の4）。","誤り。必要費は直ちに償還を請求できる（608条1項）。有益費は終了時。"],"answer":1},{"id":"q11","area":"契約","topic":"請負・委任","basis":["民法634条・641条・644条・651条・653条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"請負および委任に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["委任契約は各当事者がいつでも解除することができ、相手方に不利な時期に解除した場合でも、やむを得ない事由の有無にかかわらず損害賠償責任を負うことはない。","受任者は、委任の本旨に従い、善良な管理者の注意をもって委任事務を処理する義務を負う。","請負人が仕事を完成しない間は、注文者は、いつでも損害を賠償して契約の解除をすることができる。","請負が仕事の完成前に解除された場合でも、可分な部分の給付によって注文者が利益を受けるときは、請負人はその利益の割合に応じて報酬を請求することができる。","委任は、委任者又は受任者の死亡によって終了する。"],"why":["誤り（これが正解）。相手方に不利な時期に解除したときなどは、やむを得ない事由があった場合を除き、損害を賠償しなければならない（651条2項）。","正しい。644条。","正しい。641条。","正しい。634条2号。","正しい。653条1号。"],"answer":0},{"id":"q12","area":"不法行為等","topic":"不法行為","basis":["民法714条・715条・717条・721条・724条・724条の2"],"tip":"","kind":"mc","format":"妥当なもの","stem":"不法行為に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["胎児は、損害賠償の請求権については、まだ生まれていないので権利能力を有しない。","責任能力のない未成年者が他人に損害を加えた場合、その監督義務者は、監督義務を怠らなかったことを証明しても責任を免れない。","土地の工作物の設置又は保存に瑕疵があることによって他人に損害を生じたときは、工作物の占有者が賠償責任を負うが、占有者が損害の発生を防止するのに必要な注意をしたときは、所有者が賠償しなければならない。","不法行為による損害賠償請求権は、生命・身体の侵害の場合を除き、被害者が損害及び加害者を知った時から5年間行使しないときは、時効によって消滅する。","使用者が被用者の不法行為について損害を賠償した場合、使用者は被用者に対して求償することは一切できない。"],"why":["誤り。既に生まれたものとみなす（721条）。","誤り。監督義務を怠らなかったことなどを証明すれば免責される（714条1項ただし書）。","正しい。717条1項（占有者が一次的責任、所有者は無過失責任）。","誤り。原則3年（724条1号）。生命・身体の侵害は5年（724条の2）。","誤り。求償できる（715条3項）。ただし信義則上相当な限度に制限される（最判昭51.7.8）。"],"answer":2},{"id":"q13","area":"不法行為等","topic":"不当利得・事務管理","basis":["民法702条〜705条・708条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"事務管理および不当利得に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["事務管理の管理者は、本人のために有益な費用を支出したときは、本人に対し、その償還を請求することができる。","不法な原因のために給付をした者は、その給付したものの返還を請求することができない。","善意の受益者は、その利益の存する限度において返還する義務を負う。","悪意の受益者は、その受けた利益に利息を付して返還しなければならず、なお損害があるときはその賠償の責任を負う。","債務の弁済として給付をした者は、その時において債務の存在しないことを知っていたときでも、その給付したものの返還を請求することができる。"],"why":["正しい。702条1項。","正しい。708条本文。","正しい。703条。","正しい。704条。","誤り（これが正解）。非債弁済（705条）。債務の不存在を知って弁済した者は返還を請求できない。"],"answer":4},{"id":"q14","area":"親族","topic":"婚姻","basis":["民法731条・739条・754条・761条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"婚姻に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["夫婦間でした契約は、婚姻中いつでも夫婦の一方から取り消すことができ、第三者の権利を害する場合も同様である。","女性は、前婚の解消又は取消しの日から起算して100日を経過した後でなければ、再婚をすることができない。","夫婦の一方が日常の家事に関して第三者と法律行為をしたときでも、他の一方はこれによって生じた債務について責任を負わない。","婚姻は、18歳にならなければ、することができない。","婚姻の届出は、当事者双方の合意があれば、成年の証人がいなくても受理される。"],"why":["誤り。第三者の権利を害することはできない（754条ただし書）。","誤り。再婚禁止期間（旧733条）は令和4年改正で廃止された（令和6年4月1日施行）。","誤り。連帯して責任を負う（761条）。","正しい。731条（男女とも18歳）。","誤り。成年の証人2人以上が署名した書面で届け出る（739条2項）。"],"answer":3},{"id":"q15","area":"親族","topic":"親子","basis":["民法772条・774条・777条・781条・809条・817条の2"],"tip":"親族法は改正が続いている分野。古い問題集の知識（再婚禁止期間・夫のみの否認権など）はそのまま使わない。","kind":"mc","format":"妥当でないもの","stem":"親子に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["嫡出否認の訴えは夫のみが提起することができ、その期間は夫が子の出生を知った時から1年以内である。","認知は、遺言によっても、することができる。","特別養子縁組は、家庭裁判所の審判によって成立する。","養子は、縁組の日から、養親の嫡出子の身分を取得する。","妻が婚姻中に懐胎した子は当該婚姻における夫の子と推定し、女が婚姻前に懐胎した子であって婚姻が成立した後に生まれたものも同様とする。"],"why":["誤り（これが正解）。令和4年改正（令和6年4月1日施行）で、否認権者は夫・子・母・前夫に拡大され、出訴期間も原則3年に伸長された（774条・777条）。","正しい。781条2項。","正しい。817条の2。","正しい。809条。","正しい。772条1項（令和4年改正後）。"],"answer":0},{"id":"q16","area":"相続","topic":"相続人と相続分","basis":["民法887条・889条・900条","最大決平25.9.4"],"tip":"","kind":"mc","format":"妥当なもの","stem":"相続人および相続分に関する次の記述のうち、民法の規定および判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["兄弟姉妹の子が相続開始以前に死亡した場合、その子（兄弟姉妹の孫）も再代襲して相続人となる。","被相続人の子が相続の開始以前に死亡したときは、その者の子が代襲して相続人となるが、被相続人の直系卑属でない者はこの限りでない。","配偶者と兄弟姉妹が相続人であるときは、配偶者の相続分は3分の2である。","相続の放棄をした者の子は、放棄をした者を代襲して相続人となる。","嫡出でない子の相続分は、嫡出である子の相続分の2分の1である。"],"why":["誤り。兄弟姉妹の代襲は子（甥・姪）までで、再代襲はない（889条2項）。","正しい。887条2項。","誤り。4分の3（900条3号）。","誤り。相続放棄は代襲原因ではない（887条2項）。","誤り。最大決平25.9.4の違憲判断を受けて規定は削除され、相続分は同等。"],"answer":1},{"id":"q17","area":"相続","topic":"承認・放棄・遺産分割","basis":["民法904条の3・915条・923条・938条","最大決平28.12.19"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"相続の承認・放棄および遺産分割に関する次の記述のうち、民法の規定および判例に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["相続人は、自己のために相続の開始があったことを知った時から3か月以内に、単純若しくは限定の承認又は放棄をしなければならない。","相続人が数人あるときは、限定承認は、共同相続人の全員が共同してのみすることができる。","相続開始の時から10年を経過した後にする遺産の分割は、原則として、具体的相続分ではなく法定相続分又は指定相続分による。","共同相続された普通預金債権は、相続開始と同時に当然に相続分に応じて分割されることはなく、遺産分割の対象となる。","相続の放棄は、家庭裁判所に申述する必要はなく、他の共同相続人に対する意思表示によってすることができる。"],"why":["正しい。915条1項。","正しい。923条。","正しい。904条の3（令和3年改正）。","正しい。最大決平28.12.19。","誤り（これが正解）。家庭裁判所に申述しなければならない（938条）。"],"answer":4},{"id":"q18","area":"相続","topic":"遺言・遺留分","basis":["民法968条・1026条・1042条・1046条・1048条"],"tip":"","kind":"mc","format":"組合せ","stem":"遺言および遺留分に関する次の記述ア〜オのうち、民法の規定に照らし、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","items":["自筆証書遺言に相続財産の目録を添付する場合、その目録は自書することを要しないが、目録の毎葉に署名し、印を押さなければならない。","遺留分侵害額の請求権は、遺留分権利者が、相続の開始及び遺留分を侵害する贈与又は遺贈があったことを知った時から1年間行使しないときは、時効によって消滅する。","兄弟姉妹も遺留分を有する。","遺言者は、いつでも遺言の方式に従って遺言を撤回することができるが、その撤回権を放棄することもできる。","遺留分侵害額請求権を行使すると、遺贈又は贈与の目的物の所有権が遺留分権利者に当然に復帰する。"],"itemOk":[true,true,false,false,false],"itemWhy":["正しい。968条2項。","正しい。1048条前段（相続開始から10年でも消滅）。","誤り。兄弟姉妹には遺留分がない（1042条1項）。","誤り。撤回権は放棄できない（1026条）。","誤り。遺留分侵害額に相当する金銭の支払を請求する権利（1046条1項）。物権的効果は生じない。"],"options":["ア・イ","ア・ウ","ア・エ","イ・ウ","イ・オ"],"answer":0},{"id":"q19","area":"相続","topic":"配偶者居住権","basis":["民法1028条・1030条〜1032条・1037条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"配偶者居住権に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["配偶者短期居住権は、被相続人が遺言で居住建物を第三者に遺贈した場合には成立しない。","配偶者居住権は、登記をしなくても、その建物について物権を取得した者に対抗することができる。","配偶者居住権は、配偶者が自由に第三者に譲渡することができる。","被相続人の配偶者は、相続開始の時に被相続人の財産に属した建物に居住していた場合において、遺産の分割によって配偶者居住権を取得するものとされたときは、その建物の全部について無償で使用及び収益をする権利を取得する。","配偶者居住権の存続期間は、遺産分割の協議で別段の定めをした場合でも、必ず10年とされる。"],"why":["誤り。この場合も成立し、居住建物取得者からの消滅の申入れの日から6か月を経過する日まで存続する（1037条1項2号）。","誤り。登記が対抗要件（1031条2項・605条）。","誤り。譲渡することができない（1032条2項）。","正しい。1028条1項。","誤り。原則として配偶者の終身の間（1030条）。"],"answer":3},{"id":"q20","area":"記述式","topic":"賃借権に基づく返還請求（記述）","basis":["民法605条の4・423条"],"tip":"「妨害→停止」「占有→返還」の使い分けを答案に正確に書く。根拠（賃借権）も忘れずに。","kind":"essay","format":"記述 40字程度","stem":"Aは、B所有の甲土地を建物所有目的で賃借し、甲土地上に登記された建物を所有して対抗要件を備えた。ところが、Cが甲土地の一部を不法に占有している。この場合、Aは、民法上、Cに対してどのような根拠に基づき、どのような請求をすることができるか。40字程度で記述しなさい。","model":"対抗要件を備えた賃借人として、賃借権に基づき、Cに対し甲土地の返還を請求できる。","explain":"平成29年改正で新設された605条の4。対抗要件を備えた不動産の賃借人は、不動産の占有を第三者が妨害しているときは妨害の停止を、第三者が占有しているときは返還を請求できる。Cは土地を占有しているので「返還」請求。なお、対抗要件がない場合には、賃貸人Bの所有権に基づく返還請求権を代位行使する（423条の転用）ことや、Aが占有していれば占有の訴えも考えられる。","elements":[{"label":"対抗要件を備えた不動産賃借人であること","kw":["対抗要件"],"pts":5},{"label":"賃借権に基づく請求であること","kw":["賃借権に基"],"pts":5},{"label":"Cに対する返還請求","kw":["返還"],"pts":10}]}]};

async function doSave(rec){

  body.append("entry."+FORM.fields.question, rec.question);
  body.append("entry."+FORM.fields.answer, rec.answer);
  body.append("entry."+FORM.fields.result, rec.result);
  const attempt = ()=>fetch(FORM.action, {method:"POST", mode:"no-cors", body});

}

function fmtSec(s){ return s>=60 ? Math.floor(s/60)+"分"+String(s%60).padStart(2,"0")+"秒" : s+"秒"; }
function level(r){ return r<0.6 ? ["weak","要強化"] : r<0.8 ? ["mid","あと一歩"] : ["good","得点源"]; }
function areaStats(){
  const m=new Map();
  Q.forEach(q=>{
    const a=state.answers[q.id]; if(!a) return;
    if(!m.has(q.area)) m.set(q.area,{area:q.area,got:0,max:0});
    const s=m.get(q.area);
    if(q.kind==="essay"){ if(a.graded){ s.got+=a.score/essayMax(q); s.max+=1; } }
    else { s.max+=1; if(a.correct) s.got+=1; }
  });
  return [...m.values()].filter(s=>s.max>0).map(s=>({...s, rate:s.got/s.max})).sort((x,y)=>x.rate-y.rate);
}
function totals(){
  const mcOk=MC.filter(q=>state.answers[q.id]&&state.answers[q.id].correct).length;
  const es=Q.filter(q=>q.kind==="essay");
  const eGot=es.reduce((s,q)=>s+((state.answers[q.id]&&state.answers[q.id].graded)?state.answers[q.id].score:0),0);
  const eMax=es.reduce((s,q)=>s+essayMax(q),0);
  return {mcOk, eGot, eMax, es};
}
function summaryText(){
  const d=new Date(); const p=n=>String(n).padStart(2,"0");
  const stamp=`${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  const t=totals();
  const lines=[`【${SET.title} 結果】${stamp} 受験コード ${examCode()}`, `択一 ${t.mcOk}/${MC.length}問（${Math.round(t.mcOk/MC.length*100)}%）`+(t.es.length?` 記述 ${t.eGot}/${t.eMax}点`:"")];
  lines.push("■分野別");
  areaStats().forEach(s=>lines.push(`${s.area} ${Math.round(s.rate*100)}%（${level(s.rate)[1]}）`));
  lines.push("■各問");
  Q.forEach((q,k)=>{
    const a=state.answers[q.id];
    if(!a){ lines.push(`Q${k+1} 未解答 ${q.area}/${q.topic}`); return; }
    if(q.kind==="essay"){ lines.push(`Q${k+1} 記述 ${a.graded?a.score+"/"+essayMax(q)+"点":"未採点"} ${q.area}/${q.topic}`); lines.push(`  解答: ${a.text}`); }
    else lines.push(`Q${k+1} ${a.correct?"○":"×"} 肢${a.choice+1}（正解${q.answer+1}・${fmtSec(a.seconds)}） ${q.area}/${q.topic}`);
  });
  return lines.join("\n");
}
function renderResult(){
  const t=totals();
  const totalSec=Object.values(state.answers).reduce((s,a)=>s+(a.seconds||0),0);
  const anyFail = Object.values(state.answers).some(a=>a.saved==="fail"||a.saved==="off");
  const stats = areaStats();
  lsSet(SUM_KEY, {mcOk:t.mcOk, mcN:MC.length, eGot:t.eGot, eMax:t.eMax, at:Date.now(), weak:stats.filter(s=>s.rate<0.6).map(s=>s.area)});
  const areasHtml = stats.map(s=>{ const [cls,lab]=level(s.rate); const col = cls==="weak"?"var(--ng)":cls==="mid"?"var(--mid)":"var(--ok)";
    return `<div class="area"><span class="nm">${esc(s.area)}<span class="lv ${cls}">${lab}</span></span><span class="val">${Math.round(s.rate*100)}%（${Math.round(s.got*10)/10}/${s.max}）</span><span class="meter"><span style="width:${Math.max(3,Math.round(s.rate*100))}%;background:${col}"></span></span></div>`; }).join("");
  const missed = Q.filter(q=>{ const a=state.answers[q.id]; return a && (q.kind==="essay" ? (a.graded && a.score<essayMax(q)*0.6) : !a.correct); });
  const rows=Q.map((q,k)=>{
    const a=state.answers[q.id];
    if(!a) return `<tr><td>${k+1}</td><td>${esc(q.area)}</td><td>—</td><td>—</td></tr>`;
    if(q.kind==="essay") return `<tr><td>${k+1}</td><td>${esc(q.area)}</td><td>${a.graded?a.score+"/"+essayMax(q):"未採点"}</td><td>${fmtSec(a.seconds)}</td></tr>`;
    return `<tr><td>${k+1}</td><td>${esc(q.area)}</td><td class="${a.correct?"o":"x"}">${a.correct?"○":"×"} ${a.choice+1}</td><td>${fmtSec(a.seconds)}</td></tr>`;
  }).join("");
  main.innerHTML = `
    <div class="qhead"><h2>結果</h2><span class="tag">受験コード ${esc(examCode())}</span></div>
    <div class="card">
      <p class="muted small">5肢択一の正答率</p>
      <p class="score">${Math.round(t.mcOk/MC.length*100)}%<small>　${t.mcOk} / ${MC.length}問</small></p>
    </div>
    <div class="stats">
      <div><b>${t.es.length?t.eGot+"/"+t.eMax:"—"}</b><span>記述</span></div>
      <div><b>${t.mcOk*PT}</b><span>択一（${MC.length*PT}点中）</span></div>
      <div><b>${fmtSec(totalSec)}</b><span>合計時間</span></div>
    </div>
    <section class="card"><h2>分野別の正答率</h2><p class="note">60%未満は「要強化」、80%以上は「得点源」です。</p><div class="areas">${areasHtml}</div></section>
    ${missed.length?`<section class="card"><h2>復習する論点</h2><ul class="misslist">${missed.map(q=>`<li>第${Q.indexOf(q)+1}問　${esc(q.area)}／${esc(q.topic)}</li>`).join("")}</ul></section>`:""}
    <div class="tbl"><table><thead><tr><th>問</th><th>分野</th><th>結果</th><th>時間</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="card">
      <p><b>結果を送る</b></p>
      <p class="note">${mode!=="self" ? "下のボタンで結果をコピーし、LINEなどで送ってください。" : anyFail ? "一部の回答が自動送信されていません。下のボタンで結果をコピーし、LINEなどで送ってください。" : "回答は自動送信済みです。念のため、結果をコピーして送ることもできます。"}</p>
      <button class="btn${anyFail?"":" ghost"}" id="copy">結果をコピー</button>
      <p class="toast" id="toast"></p>
      <textarea id="copytext" class="copybox" readonly hidden></textarea>
    </div>
    <div class="row"><a class="btn" href="./">セット一覧へ</a><button class="btn ghost" id="again">最初から解き直す</button></div>`;
  document.getElementById("copy").onclick=async()=>{
    const tx=summaryText(), toast=document.getElementById("toast"), box=document.getElementById("copytext");
    try{ await navigator.clipboard.writeText(tx); toast.textContent="コピーしました。LINEなどに貼り付けて送ってください。"; box.hidden=true; }
    catch(err){ box.value=tx; box.hidden=false; box.focus(); box.select(); toast.textContent="自動でコピーできませんでした。下の文章を長押しして「すべてを選択」→「コピー」してください。"; }
  };
  document.getElementById("again").onclick=()=>{ state.run=newRun(); state.answers={}; state.i=0; persist(); render(); window.scrollTo(0,0); };
}
document.getElementById("setName").textContent = SET.title;
setChip();
render();
</script>
</body>
</html>
