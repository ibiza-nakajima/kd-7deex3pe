<script>window.SET = {"id":"kiso-1","code":"基礎知識","title":"基礎知識 業務関連法令・個人情報・情報通信・政経社","lead":"基礎知識は14問中6問以上（24点以上）が必要で、下回ると不合格です。行政書士法などの業務関連法令、個人情報保護、情報通信、政治・経済・社会を確認します（文章理解は含みません）。","minutes":35,"questions":[{"id":"q01","area":"業務関連法令","topic":"行政書士法（業務・登録）","basis":["行政書士法（業務・登録・依頼に応ずる義務・秘密を守る義務・行政書士法人）"],"tip":"行政書士法は令和7年に改正法が成立している（目的規定の見直し、職責規定の新設など）。施行日と条文番号は最新の法令で確認しておく。","kind":"mc","format":"妥当なもの","stem":"行政書士法に関する次の記述のうち、行政書士法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["行政書士は、他人の依頼を受け報酬を得て、官公署に提出する書類その他権利義務又は事実証明に関する書類を作成することを業とする。","行政書士となる資格を有する者が行政書士となるには、都道府県知事の登録を受けなければならない。","行政書士は、正当な事由がある場合でも、依頼を拒むことができない。","行政書士法人の社員は、行政書士でなくてもよい。","行政書士は、行政書士でなくなった後は、業務上取り扱った事項について知り得た秘密を漏らしても罰せられない。"],"why":["正しい。行政書士の業務の基本規定。","誤り。日本行政書士会連合会に備える行政書士名簿に登録を受けなければならない。","誤り。正当な事由がある場合は依頼を拒むことができる。","誤り。行政書士法人の社員は行政書士でなければならない。","誤り。行政書士でなくなった後も守秘義務を負う。"],"answer":0},{"id":"q02","area":"業務関連法令","topic":"行政書士法（監督・会）","basis":["行政書士法（登録・行政書士会・品位保持・業務の制限・懲戒）"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"行政書士法に関する次の記述のうち、行政書士法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["行政書士でない者は、他の法律に別段の定めがある場合等を除き、業として行政書士の業務を行うことができない。","都道府県知事は、行政書士が法令に違反したときは、戒告、2年以内の業務の停止又は業務の禁止の処分をすることができる。","行政書士は、行政書士の信用又は品位を害するような行為をしてはならない。","行政書士は、登録を受けた時に、当然、その事務所の所在地の属する都道府県の区域に設立されている行政書士会の会員となる。","行政書士試験に合格すれば、日本行政書士会連合会の登録を受けなくても、行政書士の業務を行うことができる。"],"why":["正しい。業務の制限（違反には罰則）。","正しい。","正しい。","正しい。","誤り（これが正解）。行政書士名簿への登録を受けなければ行政書士となれない。"],"answer":4},{"id":"q03","area":"業務関連法令","topic":"戸籍法","basis":["戸籍法1条・6条・25条・49条・86条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"戸籍法に関する次の記述のうち、戸籍法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["戸籍に関する事務は、都道府県知事が管掌する。","死亡の届出は、届出義務者が死亡の事実を知った日から1か月以内（国内で死亡した場合）にしなければならない。","婚姻の届出は、届出人の本籍地でしなければならず、所在地ですることはできない。","戸籍は、市町村の区域内に本籍を定める一の夫婦及びこれと氏を同じくする子ごとに、これを編製する。","出生の届出は、出生の日から30日以内（国内で出生した場合）にしなければならない。"],"why":["誤り。市町村長が管掌する（1条）。","誤り。7日以内（86条1項）。","誤り。届出事件の本人の本籍地又は届出人の所在地でできる（25条1項）。","正しい。戸籍法6条。","誤り。14日以内（49条1項）。"],"answer":3},{"id":"q04","area":"業務関連法令","topic":"住民基本台帳法","basis":["住民基本台帳法6条・7条・11条の2・22条・30条の45"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"住民基本台帳法に関する次の記述のうち、住民基本台帳法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["市町村長は、個人を単位とする住民票を世帯ごとに編成して、住民基本台帳を作成しなければならない。","転入をした者は、転入をした日から30日以内に、市町村長に届け出なければならない。","住民票には、氏名、出生の年月日、男女の別、住所などが記載される。","住民基本台帳法は、日本の国籍を有しない者のうち中長期在留者等も適用対象としている。","住民基本台帳の一部の写しの閲覧は、統計調査や公益性の高い調査研究など法定の目的がある場合に限り認められる。"],"why":["正しい。6条1項。","誤り（これが正解）。14日以内（22条1項）。","正しい。7条。","正しい。30条の45。","正しい。11条・11条の2。"],"answer":1},{"id":"q05","area":"個人情報保護","topic":"定義","basis":["個人情報保護法2条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"個人情報保護法上の定義に関する次の記述のうち、個人情報保護法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["死者に関する情報も、個人情報保護法上の「個人情報」に当たる。","「個人情報」には、生存する個人に関する情報であって、個人識別符号が含まれるものが含まれる。","「要配慮個人情報」には、本人の人種、信条、病歴、犯罪の経歴が含まれるが、犯罪により害を被った事実は含まれない。","「仮名加工情報」とは、特定の個人を識別することができないように個人情報を加工して得られる情報であって、当該個人情報を復元することができないようにしたものをいう。","個人情報保護法は国の行政機関には適用されず、民間事業者のみを対象とする。"],"why":["誤り。「生存する個人」に関する情報に限られる。","正しい。2条1項2号。","誤り。犯罪により害を被った事実も含まれる（2条3項）。","誤り。それは「匿名加工情報」（2条6項）。仮名加工情報は、他の情報と照合しない限り特定の個人を識別できないように加工したもの（2条5項）。","誤り。令和3年改正で行政機関等の規律も個人情報保護法に一元化された。"],"answer":1},{"id":"q06","area":"個人情報保護","topic":"事業者の義務","basis":["個人情報保護法17条・18条・20条・26条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"個人情報取扱事業者の義務に関する次の記述のうち、個人情報保護法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["個人情報取扱事業者は、個人データの漏えい等で個人の権利利益を害するおそれが大きいものとして規則で定めるものが生じたときは、個人情報保護委員会に報告しなければならない。","個人情報取扱事業者は、法令に基づく場合等を除き、あらかじめ本人の同意を得ないで要配慮個人情報を取得してはならない。","個人情報取扱事業者は、あらかじめ本人の同意を得なくても、利用目的の達成に必要な範囲を超えて個人情報を取り扱うことができる。","個人情報取扱事業者は、偽りその他不正の手段により個人情報を取得してはならない。","個人情報取扱事業者は、個人情報を取り扱うに当たっては、その利用の目的をできる限り特定しなければならない。"],"why":["正しい。26条1項。","正しい。20条2項。","誤り（これが正解）。原則として本人の同意が必要（18条1項）。","正しい。20条1項。","正しい。17条1項。"],"answer":2},{"id":"q07","area":"個人情報保護","topic":"第三者提供・開示請求","basis":["個人情報保護法27条・33条・130条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"個人データの提供および保有個人データの開示に関する次の記述のうち、個人情報保護法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["本人は、個人情報取扱事業者に対し、当該本人が識別される保有個人データの電磁的記録の提供による方法その他の方法による開示を請求することができる。","個人情報取扱事業者は、法令に基づく場合であっても、本人の同意を得なければ個人データを第三者に提供できない。","利用目的の達成に必要な範囲内で個人データの取扱いの全部又は一部を委託する場合も、委託先は「第三者」に当たり、本人の同意が必要である。","いわゆるオプトアウトの方法によれば、要配慮個人情報も本人の同意なく第三者に提供できる。","個人情報保護委員会は、総務省に置かれる。"],"why":["正しい。33条1項。","誤り。法令に基づく場合は同意不要（27条1項1号）。","誤り。委託先は第三者に当たらない（27条5項1号）。","誤り。要配慮個人情報はオプトアウトによる提供ができない（27条2項ただし書）。","誤り。内閣府の外局として置かれる（130条1項）。"],"answer":0},{"id":"q08","area":"情報公開・公文書","topic":"情報公開法","basis":["行政機関情報公開法3条・7条・8条・10条・19条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"行政機関情報公開法に関する次の記述のうち、行政機関情報公開法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["開示請求に係る行政文書が存在しているか否かを答えるだけで不開示情報を開示することとなるときは、その存否を明らかにしないで開示請求を拒否することができる。","開示決定等について審査請求があったときは、原則として、情報公開・個人情報保護審査会に諮問しなければならない。","行政機関の長は、行政文書に不開示情報が記録されている場合でも、公益上特に必要があると認めるときは、開示することができる。","開示決定等は、原則として開示請求があった日から30日以内にしなければならない。","行政文書の開示請求は、日本国民に限ってすることができる。"],"why":["正しい。存否応答拒否（8条）。","正しい。19条1項。","正しい。裁量的開示（7条）。","正しい。10条1項。","誤り（これが正解）。「何人も」開示請求できる（3条）。外国人・法人も可。"],"answer":4},{"id":"q09","area":"情報通信","topic":"情報セキュリティ用語","basis":["情報通信（セキュリティ用語）"],"tip":"","kind":"mc","format":"妥当なもの","stem":"情報通信の用語に関する次の記述のうち、\u003cb>妥当なもの\u003c/b>はどれか。","options":["ランサムウェアとは、コンピュータの処理速度を向上させるためのソフトウェアをいう。","Cookie（クッキー）とは、ウェブサイトの管理者がサーバ上に保存する利用者のパスワードの一覧をいう。","二要素認証とは、パスワードを2つ組み合わせるなど、同じ種類の認証要素を2回用いて認証する方式をいう。","フィッシングとは、実在する金融機関等を装った電子メール等で偽のウェブサイトに誘導し、ID・パスワードやクレジットカード番号等を不正に入手する行為をいう。","VPNとは、インターネット上の通信を暗号化せずに高速で送受信するための技術をいう。"],"why":["誤り。データを暗号化するなどして使用不能にし、復旧と引換えに身代金を要求するマルウェア。","誤り。ウェブサイトがブラウザ側に保存させる小さなデータで、利用者の識別などに使われる。","誤り。知識（パスワード）・所持（スマートフォン等）・生体（指紋等）のうち異なる2つの要素を組み合わせる方式。","正しい。","誤り。公衆網上に暗号化等により仮想的な専用線をつくる技術。"],"answer":3},{"id":"q10","area":"情報通信","topic":"情報通信関連法","basis":["不正アクセス禁止法","電子署名法3条","e-文書法","特定電子メール法","情報流通プラットフォーム対処法"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"情報通信に関する法律に関する次の記述のうち、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["不正アクセス禁止法は、他人の識別符号を無断で入力してアクセス制御のかかったコンピュータを利用する行為のみを処罰し、他人の識別符号を不正に取得・保管する行為は処罰しない。","特定電子メール法は、あらかじめ同意した者等以外への広告宣伝メールの送信を原則として禁止している（オプトイン規制）。","プロバイダ責任制限法は、令和6年の改正で、題名が「情報流通プラットフォーム対処法」に改められた。","電子署名法は、本人による一定の要件を満たす電子署名が行われた電磁的記録は、真正に成立したものと推定する旨を定めている。","いわゆるe-文書法は、民間事業者等が法令で保存が義務付けられている書面を電磁的記録により保存することを認めている。"],"why":["誤り（これが正解）。識別符号の不正取得・保管・不正な提供なども処罰対象（不正アクセス禁止法4条〜6条等）。","正しい。","正しい。大規模プラットフォーム事業者に削除申出への対応の迅速化などを義務付ける改正（令和7年4月施行）。","正しい。電子署名法3条。","正しい。"],"answer":0},{"id":"q11","area":"政治・経済・社会","topic":"選挙制度","basis":["公職選挙法"],"tip":"","kind":"mc","format":"妥当なもの","stem":"日本の選挙制度に関する次の記述のうち、\u003cb>妥当なもの\u003c/b>はどれか。","options":["参議院議員選挙の比例代表は、拘束名簿式のみで行われる。","衆議院議員選挙では、小選挙区と比例代表の重複立候補は禁止されている。","選挙権年齢は、20歳以上である。","参議院議員選挙の選挙区選挙は、すべて都道府県を単位として行われ、複数の県を合わせた選挙区（合区）は存在しない。","衆議院議員選挙は小選挙区比例代表並立制により行われ、比例代表は全国を11のブロックに分けて行われる。"],"why":["誤り。非拘束名簿式が原則で、一部に「特定枠」がある。","誤り。重複立候補ができる（惜敗率による復活当選）。","誤り。18歳以上（平成27年改正）。","誤り。鳥取・島根、徳島・高知の合区がある。","正しい。"],"answer":4},{"id":"q12","area":"政治・経済・社会","topic":"国際連合","basis":["国際連合憲章"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"国際連合に関する次の記述のうち、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["安全保障理事会の非常任理事国は10か国で、任期は2年である。","安全保障理事会の常任理事国は、アメリカ、イギリス、フランス、ロシア、中国、日本の6か国である。","国連総会は全加盟国で構成され、各加盟国が1票を有する。","国際司法裁判所は、オランダのハーグに置かれている。","安全保障理事会の実質事項の決定には、常任理事国の同意投票を含む9理事国の賛成が必要とされる。"],"why":["正しい。","誤り（これが正解）。常任理事国は5か国で、日本は含まれない。","正しい。","正しい。","正しい。常任理事国の拒否権。慣行上、常任理事国の棄権は拒否権の行使とみなされない。"],"answer":1},{"id":"q13","area":"政治・経済・社会","topic":"財政・金融","basis":["日本銀行法2条","財政法4条・5条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"日本の財政および金融に関する次の記述のうち、\u003cb>妥当なもの\u003c/b>はどれか。","options":["財政法は、公債の発行について、いわゆる赤字国債（特例公債）の発行を原則として認めている。","累進課税制度には、所得の再分配機能はない。","消費税は、直接税に分類される。","日本銀行は、物価の安定を図ることを通じて国民経済の健全な発展に資することを、通貨及び金融の調節の理念としている。","日本銀行による国債の直接引受けは、財政法により無制限に認められている。"],"why":["誤り。財政法4条が認めるのは建設国債で、赤字国債は特例公債法により発行されている。","誤り。累進課税は所得再分配機能を持つ。","誤り。納税者と負担者が異なる間接税。","正しい。日本銀行法2条。","誤り。財政法5条により原則禁止（特別の事由がある場合に国会の議決を経た金額の範囲内で例外）。"],"answer":3},{"id":"q14","area":"政治・経済・社会","topic":"社会保障","basis":["国民年金法","介護保険法","生活保護法4条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"日本の社会保障制度に関する次の記述のうち、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["生活保護は、生活に困窮する者がその利用し得る資産、能力その他あらゆるものを最低限度の生活の維持のために活用することを要件として行われる。","日本の医療保険制度は、国民皆保険を原則としている。","日本の公的年金制度は、20歳以上60歳未満の国民のうち、会社員のみが加入する仕組みである。","介護保険の被保険者は、65歳以上の第1号被保険者と、40歳以上65歳未満の医療保険加入者である第2号被保険者に分けられる。","雇用保険は、労働者が失業した場合などに必要な給付を行う社会保険である。"],"why":["正しい。補足性の原理（生活保護法4条1項）。","正しい。","誤り（これが正解）。国民年金には20歳以上60歳未満で日本に住所がある人が全員加入する（会社員等は厚生年金にも加入）。","正しい。","正しい。"],"answer":2},{"id":"q15","area":"情報公開・公文書","topic":"公文書管理法","basis":["公文書管理法1条・5条・7条・8条・34条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"公文書等の管理に関する法律に関する次の記述のうち、公文書管理法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["行政機関の長は、保存期間が満了した行政文書ファイル等を、内閣総理大臣の同意なく自由に廃棄することができる。","行政機関の長は、保存期間が満了した行政文書ファイル等について、歴史公文書等に該当するものは国立公文書館等に移管し、それ以外のものは廃棄の措置をとるべきことを定めなければならない。","公文書管理法は、地方公共団体の文書にも直接適用される。","行政文書ファイル管理簿は、公表する必要はない。","公文書管理法の目的には、国の諸活動を現在及び将来の国民に説明する責務が全うされるようにすることは含まれない。"],"why":["誤り。廃棄には内閣総理大臣の同意が必要（8条2項）。","正しい。5条5項・8条1項。","誤り。地方公共団体は、法律の趣旨にのっとり文書管理の施策を策定・実施するよう努める（34条）。","誤り。公表しなければならない（7条2項）。","誤り。1条の目的に含まれている。"],"answer":1},{"id":"q16","area":"業務関連法令","topic":"マイナンバー法","basis":["行政手続における特定の個人を識別するための番号の利用等に関する法律"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"番号法（マイナンバー法）に関する次の記述のうち、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["個人番号の利用範囲は、社会保障、税、災害対策その他これらに類する事務として法律で定められたものに限られる。","個人番号は、住民票コードを変換して得られる番号である。","個人番号カードには、氏名、住所、生年月日、性別、個人番号等が記載され、本人の写真が表示される。","個人番号は、本人の申請により、いつでも自由に変更することができる。","何人も、法律で認められた場合を除き、他人に対して個人番号の提供を求めてはならない。"],"why":["正しい。令和5年改正で、社会保障・税・災害対策以外の行政事務にも利用範囲が拡大されている。","正しい。","正しい。","誤り（これが正解）。個人番号が漏えいして不正に用いられるおそれがあると認められるときに限り変更される。","正しい。"],"answer":3},{"id":"q17","area":"情報通信","topic":"暗号・ネットワーク技術","basis":["情報通信（暗号・ネットワーク）"],"tip":"","kind":"mc","format":"個数","stem":"情報通信技術に関する次の記述ア〜オのうち、\u003cb>妥当なものはいくつ\u003c/b>あるか。","items":["公開鍵暗号方式では、暗号化に用いる鍵と復号に用いる鍵が異なる。","電子署名では、一般に、送信者が自己の秘密鍵で署名し、受信者は送信者の公開鍵で検証する。","SSL/TLSは、ウェブサイトとブラウザ間の通信を暗号化するための技術である。","ブロックチェーンは、取引記録を単一の中央サーバのみで管理することで改ざんを防ぐ技術である。","IPv6は、IPv4よりもアドレス空間が狭い。"],"itemOk":[true,true,true,false,false],"itemWhy":["正しい。共通鍵暗号方式は同じ鍵を用いる。","正しい。","正しい。URLが「https」で始まるサイトで用いられる。","誤り。多数の参加者がデータを共有する分散型台帳の技術。","誤り。IPv6のアドレス空間（128ビット）はIPv4（32ビット）よりはるかに広い。"],"options":["一つ","二つ","三つ","四つ","五つ"],"answer":2},{"id":"q18","area":"政治・経済・社会","topic":"国の行政組織","basis":["内閣府設置法","デジタル庁設置法","会計検査院法1条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"国の行政組織に関する次の記述のうち、\u003cb>妥当なもの\u003c/b>はどれか。","options":["デジタル庁は、総務省の外局として設置されている。","復興庁は、内閣府の外局である。","公正取引委員会や国家公安委員会は、内閣府の外局として置かれている。","会計検査院は内閣の下に置かれ、内閣の指揮監督を受ける。","こども家庭庁は、厚生労働省の外局として設置されている。"],"why":["誤り。内閣に置かれる。","誤り。内閣に置かれる。","正しい。","誤り。内閣に対し独立の地位を有する（会計検査院法1条）。","誤り。内閣府の外局（令和5年設置）。"],"answer":2},{"id":"q19","area":"個人情報保護","topic":"行政機関等の規律","basis":["個人情報保護法2条11項・69条・76条・105条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"行政機関等における個人情報の取扱いに関する次の記述のうち、個人情報保護法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["何人も、行政機関の長等に対し、当該行政機関の保有する自己を本人とする保有個人情報の開示を請求することができる。","行政機関の長等は、原則として、利用目的以外の目的のために保有個人情報を自ら利用し、又は提供してはならない。","地方公共団体の機関も、個人情報保護法の「行政機関等」に含まれる。","開示決定等に対する審査請求については、原則として情報公開・個人情報保護審査会に諮問しなければならない。","行政機関等に対する保有個人情報の開示請求は本人に限られ、未成年者の法定代理人が本人に代わって開示請求をすることはできない。"],"why":["正しい。76条1項。","正しい。69条1項。","正しい。2条11項。","正しい。105条1項（地方公共団体の機関は条例で定める審査会など）。","誤り（これが正解）。未成年者・成年被後見人の法定代理人等は本人に代わって請求できる（76条2項）。"],"answer":4},{"id":"q20","area":"政治・経済・社会","topic":"為替・国際経済","basis":["国際経済（為替・国際収支）"],"tip":"","kind":"mc","format":"妥当なもの","stem":"国際経済に関する次の記述のうち、\u003cb>妥当なもの\u003c/b>はどれか。","options":["円高は、一般に、日本の輸入品の円建て価格を下落させ、輸出企業の採算を悪化させる方向に働く。","国際収支において、貿易収支は資本移転等収支に含まれる。","変動相場制の下では、為替レートは政府が公定する。","円安は、外国人旅行者にとって、日本での買い物を割高にする。","WTOは、関税の引上げを促進するために設立された国際機関である。"],"why":["正しい。","誤り。貿易収支は経常収支に含まれる。","誤り。外国為替市場の需給で決まる（必要に応じ為替介入が行われることはある）。","誤り。円安は外国人旅行者にとって日本での買い物を割安にする。","誤り。自由貿易の推進（関税等の貿易障壁の削減）を目的とする。"],"answer":0}]};
