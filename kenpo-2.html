<script>window.SET = {"id":"kenpo-2","code":"憲法強化","title":"憲法 直前強化（誤答9問＋判例・統治10問＋記述）","lead":"前半9問は、これまでに間違えた問題の解き直しです（憲法01の4問は2回続けて誤答）。後半10問は、表現の自由・政教分離・平等・統治の頻出判例と条文です。判例は「事件名→結論（合憲か違憲か）→理由のキーワード」の順で覚えてください。","minutes":30,"questions":[{"id":"q01","area":"人権：精神的自由","topic":"表現の自由","basis":["憲法21条1項・2項","最判平7.3.7（泉佐野市民会館事件）","最判令4.2.15（大阪市ヘイトスピーチ条例事件）","最大判昭58.6.22（よど号記事抹消事件）","最大決昭44.11.26（博多駅事件）","最大判昭59.12.12（税関検査事件）"],"tip":"「抽象的な危険で足りる」「いかなる場合も」「一切」など、判例の基準をゆるめたり極端にしたりする言葉は誤りの目印になりやすい。","stem":"表現の自由に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","kind":"mc","format":"妥当でないもの","options":["集会の用に供される公共施設の利用を不許可とするには、その集会が開かれることにより公共の安全が損なわれる抽象的な危険があれば足りる。","大阪市ヘイトスピーチへの対処に関する条例が定める、表現活動の拡散防止措置および表現活動を行った者の氏名等の公表は、憲法21条1項に違反しない。","未決拘禁者の新聞紙・図書等の閲読の自由を制限するには、その閲読を許すことにより監獄内の規律及び秩序の維持上放置することのできない程度の障害が生ずる相当の蓋然性があると認められることが必要である。","報道機関の報道は国民の知る権利に奉仕するものであり、報道の自由は憲法21条の保障の下にあり、報道のための取材の自由も、憲法21条の精神に照らし、十分尊重に値する。","税関検査は、関税徴収手続の一環として行われるもので、思想内容等それ自体を網羅的に審査し規制することを目的とするものではなく、憲法21条2項前段の「検閲」に当たらない。"],"answer":0,"why":["誤り（これが正解）。泉佐野市民会館事件（最判平7.3.7）。「明らかな差し迫った危険の発生が具体的に予見されること」が必要で、抽象的な危険では足りない。","正しい。大阪市ヘイトスピーチ条例事件（最判令4.2.15）。制限は合理的で必要やむを得ない限度にとどまるとした。","正しい。よど号ハイジャック記事抹消事件（最大判昭58.6.22）。","正しい。博多駅事件（最大決昭44.11.26）。ただし公正な刑事裁判の実現のために取材フィルムの提出を命じることは許されるとした。","正しい。札幌税関検査事件（最大判昭59.12.12）。検閲を「行政権が主体となって、思想内容等の表現物を対象とし、その全部又は一部の発表の禁止を目的として、対象とされる一定の表現物につき網羅的一般的に、発表前にその内容を審査した上、不適当と認めるものの発表を禁止すること」と定義した。"]},{"id":"q02","area":"人権：平等・幸福追求","topic":"プライバシー・自己決定","basis":["憲法13条","最大判昭44.12.24（京都府学連事件）","最判昭56.4.14（前科照会事件）","最判平15.9.12（早稲田大学名簿提出事件）","最判令5.3.9（マイナンバー訴訟）","最判平12.2.29（エホバの証人輸血拒否事件）"],"tip":"「〜以上、違法となることはない」「〜である以上、責任を負わない」のような断定は、判例が利益衡量をしている場面ではまず誤り。","stem":"プライバシーおよび自己決定に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","kind":"mc","format":"妥当なもの","options":["何人もその承諾なしにみだりにその容ぼう・姿態を撮影されない自由を有するが、これは憲法上の保障を受けるものではないから、警察官による撮影の適否は法律上の問題にとどまる。","市区町村長が、弁護士法23条の2に基づく弁護士会からの照会に応じて前科等を報告することは、照会に法律上の根拠がある以上、違法となることはない。","大学が講演会参加者の学籍番号・氏名・住所・電話番号を記載した名簿を本人に無断で警察に提出したとしても、これらの情報は秘匿性が高くないから、プライバシー侵害による不法行為は成立しない。","行政機関等が番号利用法に基づき特定個人情報の利用、提供等をする行為は、個人に関する情報をみだりに第三者に開示又は公表されない自由を侵害するものではなく、憲法13条に違反しない。","宗教上の信念から輸血を拒否する意思を明確にしている患者に対し、医師が、他に救命手段がない事態に至れば輸血する方針であることを説明しないまま手術を行い輸血したとしても、救命のための行為である以上、不法行為責任を負うことはない。"],"answer":3,"why":["誤り。京都府学連事件（最大判昭44.12.24）。この自由は憲法13条の趣旨から導かれ、警察官が正当な理由なく撮影することは許されない。現行犯的状況・証拠保全の必要性と緊急性・相当な方法を満たせば撮影は許される。","誤り。前科照会事件（最判昭56.4.14）。漫然と前科等の全部を報告することは公権力の違法な行使に当たる。","誤り。早稲田大学江沢民講演会名簿提出事件（最判平15.9.12）。これらもプライバシーに係る情報として法的保護の対象となり、無断開示は不法行為を構成する。","正しい（これが正解）。マイナンバー訴訟（最判令5.3.9）。住基ネット訴訟（最判平20.3.6）と同じ枠組み。","誤り。エホバの証人輸血拒否事件（最判平12.2.29）。輸血を伴う医療行為を拒否する意思決定をする権利は人格権の一内容として尊重されるべきで、説明を怠りその機会を奪ったことは不法行為となる。"]},{"id":"q03","area":"統治：地方自治","topic":"地方自治・条例","basis":["憲法92条〜95条","最大判昭50.9.10（徳島市公安条例事件）","最大判昭38.6.26（奈良県ため池条例事件）","最大判昭38.3.27（特別区長公選制廃止事件）","最大判昭37.5.30（大阪市売春取締条例事件）","地方自治法14条3項"],"tip":"委任の具体性は「政令＝個別具体的」「条例＝相当程度に具体的で限定されていれば足りる」の対比で問われる。","stem":"地方自治に関する次の記述のうち、憲法の規定および最高裁判所の判例に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","kind":"mc","format":"妥当でないもの","options":["条例が国の法令に違反するかどうかは、両者の対象事項と規定文言を対比するのみでなく、それぞれの趣旨、目的、内容及び効果を比較し、両者の間に矛盾抵触があるかどうかによって決しなければならない。","ため池の破損・決壊の原因となる堤とうの使用行為を条例で禁止することは、財産権の行使をほとんど全面的に禁止することになるが、災害を防止するため当然受忍すべき制約であり、損失補償を要しない。","東京都の特別区は、憲法93条2項の地方公共団体と認めることはできない。","一の地方公共団体のみに適用される特別法は、法律の定めるところにより、その地方公共団体の住民の投票においてその過半数の同意を得なければ、国会はこれを制定することができない。","条例で罰則を定めるには法律による授権が必要であり、その授権は、政令への罰則の委任と同様に、個別具体的なものでなければならない。"],"answer":4,"why":["正しい。徳島市公安条例事件（最大判昭50.9.10）。","正しい。奈良県ため池条例事件（最大判昭38.6.26）。","正しい。最大判昭38.3.27。区長公選制の廃止は違憲ではないとした。","正しい。憲法95条の文言どおり。","誤り（これが正解）。大阪市売春取締条例事件（最大判昭37.5.30）。条例は公選の議員で組織する議会の議決を経て制定される自治立法で、法律に類するものだから、授権は「相当な程度に具体的であり、限定されておればたりる」。現在は地方自治法14条3項が一般的に罰則の上限を定めている。"]},{"id":"q04","area":"統治：内閣・天皇・財政","topic":"内閣","basis":["憲法66条2項（文民）・68条1項（過半数）","憲法69条・70条（総辞職）","憲法73条6号（政令）","憲法75条（国務大臣の訴追）"],"tip":"内閣は条文知識で解ける得点源。「すべて／過半数」「直ちに／10日以内」の言い換えを正確に。","stem":"内閣に関する次の記述のうち、憲法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","kind":"mc","format":"妥当なもの","options":["国務大臣は、すべて国会議員の中から選ばれなければならない。","国務大臣は、その在任中、内閣総理大臣の同意がなければ訴追されないが、これがため訴追の権利は害されない。","衆議院で内閣不信任の決議案が可決されたときは、内閣は直ちに総辞職しなければならない。","内閣は、政令に、法律の委任がなくても罰則を設けることができる。","衆議院議員総選挙の後に初めて国会の召集があったときでも、内閣は、不信任の決議がされない限り総辞職する必要はない。"],"answer":1,"why":["誤り。68条1項ただし書は「その過半数は、国会議員の中から選ばれなければならない」。","正しい（これが正解）。75条の文言どおり。同意がない間は公訴時効が進行しないと解されている。","誤り。69条。10日以内に衆議院が解散されない限り、総辞職しなければならない。","誤り。73条6号ただし書。特にその法律の委任がある場合を除いては、罰則を設けることができない。","誤り。70条。総選挙後に初めて国会の召集があったときは、内閣は総辞職しなければならない。"]},{"id":"q05","area":"人権：精神的自由","topic":"思想良心・学問の自由","basis":["最判平23.5.30","最大判昭31.7.4","最大判昭38.5.22","最大判昭51.5.21","最判昭63.7.15"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"思想・良心の自由および学問の自由に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["普通教育における教師にも一定の範囲における教授の自由が保障されるが、完全な教授の自由を認めることはできない。","大学における学生の集会が、真に学問的な研究又はその結果の発表のためのものでなく、実社会の政治的社会的活動に当たる行為をする場合には、大学の有する特別の学問の自由と自治は享有しない。","内申書に生徒の政治的活動を記載しても、思想・信条そのものを記載したものではなく、その思想・信条を了知させるものでもないとして、19条違反を否定した判例がある。","公立学校の校長が教諭に対し卒業式での国歌斉唱の際の起立斉唱を命ずる職務命令は、思想及び良心の自由についての間接的な制約となる面があるから、憲法19条に違反する。","謝罪広告を新聞紙に掲載すべきことを命ずる判決は、単に事態の真相を告白し陳謝の意を表明するにとどまる程度のものであれば、憲法19条に違反しない。"],"why":["正しい。旭川学テ事件（最大判昭51.5.21）。","正しい。東大ポポロ事件（最大判昭38.5.22）。","正しい。麹町中学内申書事件（最判昭63.7.15）。","誤り（これが正解）。最判平23.5.30は、間接的制約となる面はあるが、職務命令の目的・内容等に照らし必要性・合理性が認められるとして、19条に違反しないとした。","正しい。謝罪広告事件（最大判昭31.7.4）。"],"answer":3},{"id":"q06","area":"人権：人身・社会権・国務請求権","topic":"適正手続・刑事手続","basis":["憲法31条・38条・39条","最大判平4.7.1","最大判昭37.11.28","最大判平29.3.15"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"人身の自由および刑事手続に関する次の記述のうち、憲法の規定および判例に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["所有者に告知・弁解・防御の機会を与えることなくその所有物を没収することは、憲法31条・29条に違反する。","何人も、実行の時に適法であった行為については、刑事上の責任を問われない。","GPS端末を秘かに車両に装着して位置情報を検索・把握する捜査は、令状がなければ行うことのできない強制の処分に当たる。","何人も、自己に不利益な供述を強要されない。","憲法31条は刑事手続について定めたものであるから、行政手続にその保障が及ぶことはない。"],"why":["正しい。第三者所有物没収事件（最大判昭37.11.28）。","正しい。39条前段（遡及処罰の禁止）。","正しい。GPS捜査事件（最大判平29.3.15）。","正しい。38条1項。","誤り（これが正解）。成田新法事件（最大判平4.7.1）は、行政手続にも31条の保障が及ぶ場合があるとした（ただし常に告知・聴聞の機会が必要なわけではない）。"],"answer":4},{"id":"q07","area":"統治：裁判所","topic":"裁判官・裁判の公開","basis":["憲法77条〜80条・82条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"裁判所に関する次の記述のうち、憲法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["最高裁判所の裁判官は、任命後初めて行われる衆議院議員総選挙の際に国民の審査に付され、その後は審査に付されることはない。","下級裁判所の裁判官は、最高裁判所の指名した者の名簿によって内閣で任命し、任期は10年で、再任されることができる。","裁判官は、公の弾劾によらなければ罷免されないが、行政機関が懲戒処分を行うことはできる。","最高裁判所は、下級裁判所に関する規則を定める権限を、下級裁判所に委任することはできない。","政治犯罪、出版に関する犯罪又は国民の権利が問題となっている事件の対審も、裁判官の全員一致で公の秩序を害するおそれがあると決した場合には、公開しないで行うことができる。"],"why":["誤り。その後10年を経過した後初めて行われる総選挙の際に更に審査に付される（79条2項）。","正しい。80条1項。","誤り。行政機関は懲戒処分を行うことができない（78条後段）。","誤り。委任することができる（77条3項）。","誤り。これらの事件の対審は常に公開しなければならない（82条2項ただし書）。"],"answer":1},{"id":"q08","area":"統治：内閣・天皇・財政","topic":"租税法律主義・財政","basis":["憲法84条・87条・89条・90条","最大判平18.3.1"],"tip":"","kind":"mc","format":"妥当なもの","stem":"財政に関する次の記述のうち、憲法の規定および判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["公金その他の公の財産は、公の支配に属しない慈善、教育又は博愛の事業に対しては、支出することができる。","国民健康保険の保険料は租税ではないから、憲法84条の趣旨が及ぶことはない。","予見し難い予算の不足に充てるための予備費は、国会の議決に基づかずに、内閣の責任で設けることができる。","あらたに租税を課し、又は現行の租税を変更するには、法律又は法律の定める条件によることを必要とする。","国の収入支出の決算は、内閣が国会に提出し、その承認を得なければならない。"],"why":["誤り。支出し又はその利用に供してはならない（89条後段）。","誤り。旭川市国民健康保険条例事件（最大判平18.3.1）は、84条は直接適用されないが、その趣旨は及ぶとした。","誤り。予備費は国会の議決に基づいて設ける（87条1項）。支出後に国会の承諾を得る（同条2項）。","正しい。84条（租税法律主義）。","誤り。決算は会計検査院が検査し、内閣が検査報告とともに国会に提出する（90条1項）。承認を要する旨の規定はない。"],"answer":3},{"id":"q09","area":"人権総論","topic":"法人・在監者の人権","basis":["最大判昭45.6.24（八幡製鉄）","最判平8.3.19（南九州税理士会）","最判平14.4.25（群馬司法書士会）","最大判昭45.9.16"],"tip":"","kind":"mc","format":"妥当なもの","stem":"法人および特別な法律関係における人権に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["被拘禁者の喫煙を禁止することは、喫煙の自由が憲法上保障されている以上、いかなる場合にも許されない。","司法書士会が大震災で被災した他県の司法書士会への復興支援拠出金を会員から徴収する旨の決議は、目的の範囲外であり無効であるとした判例がある。","会社は、自然人たる国民と同様、国や政党の特定の政策を支持、推進し又は反対するなどの政治的行為をなす自由を有し、政治資金の寄附もその自由の一環であるとした判例がある。","法人には、性質上可能な限りにおいても、人権規定の適用はない。","税理士会が政治資金規正法上の政治団体に金員を寄附するため会員から特別会費を徴収する旨の決議は、有効であるとした判例がある。"],"why":["誤り。最大判昭45.9.16は、喫煙禁止は必要かつ合理的な制限として合憲とした。","誤り。群馬司法書士会事件（最判平14.4.25）は、有効とした。","正しい。八幡製鉄事件（最大判昭45.6.24）。","誤り。八幡製鉄事件は、人権規定は性質上可能な限り内国の法人にも適用されるとした。","誤り。南九州税理士会事件（最判平8.3.19）は、目的の範囲外として無効とした。"],"answer":2},{"id":"q10","area":"人権：精神的自由","topic":"表現の自由（重要判例）","basis":["最大判昭61.6.11","最大判昭59.12.12","最大決昭44.11.26","最大判昭44.6.25","最判平7.3.7"],"tip":"","kind":"mc","format":"妥当なもの","stem":"表現の自由に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["市民会館の使用不許可について、判例は、集会の開催により人の生命・身体・財産が侵害される抽象的な危険があれば足りるとした。","報道機関の取材フィルムに対する裁判所の提出命令は、取材の自由を侵害するものとして憲法21条に違反する。","税関検査は、表現物の発表前にその内容を審査して発表を禁止するものであるから、憲法21条2項の禁止する検閲に当たる。","名誉毀損罪について、摘示した事実が真実であることの証明がない場合には、確実な資料・根拠に照らし真実と誤信したことに相当の理由があるときでも、犯罪は成立する。","公務員又は公職選挙の候補者に対する評価・批判等に関する出版物の事前差止めは原則として許されないが、表現内容が真実でなく、又は専ら公益を図る目的でないことが明白であって、かつ、被害者が重大にして著しく回復困難な損害を被るおそれがあるときは、例外的に許される。"],"why":["誤り。最判平7.3.7（泉佐野市民会館事件）は、「明らかな差し迫った危険の発生が具体的に予見される」ことを要するとした。","誤り。最大決昭44.11.26（博多駅事件）は、取材の自由は尊重に値するとしつつ、提出命令は合憲とした。","誤り。最大判昭59.12.12は、税関検査は検閲に当たらないとした（表現物は国外で既に発表済みで発表の機会が全面的に奪われるわけではなく、関税徴収手続の一環として行われ、司法審査の機会もある）。","誤り。最大判昭44.6.25（夕刊和歌山時事事件）は、相当の理由があれば犯罪は成立しないとした。","正しい。最大判昭61.6.11（北方ジャーナル事件）。"],"answer":4},{"id":"q11","area":"人権：精神的自由","topic":"政教分離（重要判例）","basis":["最大判昭52.7.13","最大判平9.4.2","最大判平22.1.20","最大判令3.2.24","最大判昭63.6.1"],"tip":"違憲の3つ：愛媛玉串料・空知太神社・孔子廟。合憲：津地鎮祭・箕面忠魂碑・自衛官合祀。","kind":"mc","format":"組合せ","stem":"政教分離原則に関する次の記述ア〜オのうち、最高裁判所の判例に照らし、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","items":["市が体育館の起工式を神式の地鎮祭として行い公金を支出したことは、目的が世俗的で効果も特定宗教への援助等に当たらないから、政教分離原則に反しない。","県が神社の例大祭に際し玉串料等を公金から支出したことは、政教分離原則に反し違憲である。","市が神社施設の敷地として市有地を町内会に無償で使用させていたことは、政教分離原則に反しない。","市が孔子等を祀った施設の敷地の使用料を全額免除したことは、宗教とのかかわり合いが小さいから政教分離原則に反しない。","殉職自衛官を護国神社に合祀申請した行為について、判例は、配偶者の宗教上の人格権を侵害し違法であるとした。"],"itemOk":[true,true,false,false,false],"itemWhy":["正しい。最大判昭52.7.13（津地鎮祭事件）。目的効果基準。","正しい。最大判平9.4.2（愛媛玉串料事件）。","誤り。最大判平22.1.20（空知太神社事件）は違憲とした。","誤り。最大判令3.2.24（孔子廟事件）は違憲とした。","誤り。最大判昭63.6.1は、法的利益の侵害はなく違法でないとした。"],"options":["ア・イ","ア・エ","ア・オ","イ・ウ","エ・オ"],"answer":0},{"id":"q12","area":"人権：平等・幸福追求","topic":"13条（プライバシー等）","basis":["最大判昭44.12.24","最判昭56.4.14","最判平20.3.6","最大判平29.3.15","最判平12.2.29"],"tip":"","kind":"mc","format":"妥当なもの","stem":"幸福追求権に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["何人も承諾なしにみだりにその容ぼう等を撮影されない自由を有するが、現に犯罪が行われ又は行われて間もないと認められる場合など一定の要件の下では、本人の同意や令状がなくても警察官による撮影が許容される。","市区町村長が弁護士会の照会に応じて前科等を報告することは、照会に必要性があれば、漫然とすべてを報告しても違法とはならない。","住民基本台帳ネットワークシステムにより本人確認情報を管理・利用する行為は、プライバシーを侵害し憲法13条に違反する。","車両に承諾なくGPS端末を取り付けて位置情報を把握する捜査は任意捜査であり、令状は不要である。","輸血を拒否する意思を明確に表明している患者に対し、医師がほかに救命手段がないとして輸血することを説明せずに輸血した場合でも、患者の人格権を侵害したとはいえない。"],"why":["正しい。最大判昭44.12.24（京都府学連事件）。","誤り。最判昭56.4.14（前科照会事件）は、漫然と回答したことを違法とした。","誤り。最判平20.3.6は合憲とした。","誤り。最大判平29.3.15は、令状を要する強制処分であるとした。","誤り。最判平12.2.29は、説明を怠り意思決定の権利を奪ったとして人格権の侵害を認めた。"],"answer":0},{"id":"q13","area":"人権：平等・幸福追求","topic":"法の下の平等（違憲判決）","basis":["最大判昭48.4.4","最大決平25.9.4","最大判平27.12.16","最大判平20.6.4"],"tip":"","kind":"mc","format":"個数","stem":"法の下の平等に関する次の記述ア〜オのうち、最高裁判所の判例に照らし、\u003cb>妥当なものはいくつ\u003c/b>あるか。","items":["尊属殺人を普通殺人より重く処罰する規定は、尊属に対する尊重報恩という立法目的自体が不合理であるから違憲である。","嫡出でない子の相続分を嫡出子の2分の1とする民法の規定は、遅くとも平成13年7月当時において憲法14条1項に違反していた。","女性の再婚禁止期間を定めていた民法の規定のうち、100日を超える部分は、憲法14条1項及び24条2項に違反するとされた。","夫婦が婚姻の際に夫又は妻の氏を称するとする民法の規定は、憲法14条1項に違反する。","日本国民である父と外国人である母との間に出生した後に父から認知された子について、父母の婚姻を国籍取得の要件としていた国籍法の規定は、憲法14条1項に違反するとされた。"],"itemOk":[false,true,true,false,true],"itemWhy":["誤り。最大判昭48.4.4は、立法目的は合理的だが、刑の加重の程度が極端で手段が不合理として違憲とした。","正しい。最大決平25.9.4。","正しい。最大判平27.12.16（その後の法改正で再婚禁止期間は廃止）。","誤り。最大判平27.12.16・最大決令3.6.23は合憲とした。","正しい。最大判平20.6.4。"],"options":["一つ","二つ","三つ","四つ","五つ"],"answer":2},{"id":"q14","area":"統治：地方自治","topic":"地方自治（条文・判例）","basis":["憲法92条〜95条","最大判昭38.3.27","最大判昭37.5.30","最大判昭38.6.26"],"tip":"","kind":"mc","format":"妥当なもの","stem":"地方自治に関する次の記述のうち、憲法の規定および判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["東京都の特別区は憲法上の地方公共団体に当たるから、区長の公選制を廃止することは違憲であるとするのが判例である。","一の地方公共団体のみに適用される特別法は、法律の定めるところにより、その地方公共団体の住民の投票においてその過半数の同意を得なければ、国会はこれを制定することができない。","条例で刑罰を定める場合には、法律による授権は一切不要であるとするのが判例である。","財産権の内容は法律で定めることとされているから、条例によって財産権の行使を制限することは一切許されない。","地方公共団体の長及び議会の議員以外の吏員を、住民の直接選挙で選ぶことは憲法上許されない。"],"why":["誤り。最大判昭38.3.27は、特別区は憲法上の地方公共団体に当たらないとした。","正しい。95条。","誤り。最大判昭37.5.30は、法律の授権が相当な程度に具体的であり限定されていれば足りるとした（授権自体は必要）。","誤り。最大判昭38.6.26（奈良県ため池条例事件）は、条例による財産権の制限を認めた。","誤り。93条2項は「法律の定めるその他の吏員」も住民が直接選挙すると定めている。"],"answer":1},{"id":"q15","area":"統治：内閣・天皇・財政","topic":"内閣（総辞職・国務大臣）","basis":["憲法68条〜70条・73条6号"],"tip":"","kind":"mc","format":"妥当なもの","stem":"内閣に関する次の記述のうち、憲法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["内閣は、法律の委任がなくても、政令に罰則を設けることができる。","内閣総理大臣が欠けたとき、又は衆議院議員総選挙の後に初めて国会の召集があったときは、内閣は総辞職をしなければならない。","内閣は、衆議院で不信任の決議案が可決されたときは、直ちに総辞職しなければならない。","国務大臣は、その全員が国会議員でなければならない。","内閣総理大臣が国務大臣を罷免するには、閣議の決定を経なければならない。"],"why":["誤り。法律の委任がある場合を除き、政令に罰則を設けることはできない（73条6号ただし書）。","正しい。70条。","誤り。10日以内に衆議院が解散されない限り総辞職しなければならない（69条）。","誤り。過半数は国会議員の中から選ばなければならない（68条1項ただし書）。","誤り。内閣総理大臣は任意に国務大臣を罷免できる（68条2項）。"],"answer":1},{"id":"q16","area":"統治：内閣・天皇・財政","topic":"財政","basis":["憲法60条・84条・87条・89条・90条","最大判平18.3.1"],"tip":"","kind":"mc","format":"妥当なもの","stem":"財政に関する次の記述のうち、憲法の規定および判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["国民健康保険の保険料は租税ではないから、憲法84条の趣旨が及ぶ余地はない。","国の収入支出の決算は、内閣が毎年検査し、会計検査院がその検査報告とともに国会に提出しなければならない。","予算は、先に参議院に提出することもできる。","公金は、宗教上の組織若しくは団体の使用、便益若しくは維持のためであっても、国会の議決があれば支出することができる。","予見し難い予算の不足に充てるため、国会の議決に基づいて予備費を設け、内閣の責任でこれを支出することができるが、内閣は、事後に国会の承諾を得なければならない。"],"why":["誤り。最大判平18.3.1（旭川市国保事件）は、84条は直接適用されないが、その趣旨は及ぶとした。","誤り。決算は会計検査院が検査し、内閣が検査報告とともに国会に提出する（90条1項）。","誤り。予算は先に衆議院に提出しなければならない（60条1項）。","誤り。89条により支出できない。","正しい。87条。"],"answer":4},{"id":"q17","area":"統治：裁判所","topic":"司法（裁判官・公開）","basis":["憲法78条〜80条・82条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"司法権に関する次の記述のうち、憲法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["裁判官は、行政機関による懲戒処分を受けることがある。","下級裁判所の裁判官は、最高裁判所が任命する。","判決は、裁判官の全員一致で公の秩序又は善良の風俗を害するおそれがあると決した場合には、公開しないで言い渡すことができる。","政治犯罪、出版に関する犯罪又は憲法第3章で保障する国民の権利が問題となっている事件の対審は、常にこれを公開しなければならない。","最高裁判所の裁判官は、任命後初めて行われる衆議院議員総選挙の際に国民審査に付され、その後は審査に付されることはない。"],"why":["誤り。裁判官の懲戒処分は、行政機関が行うことはできない（78条後段）。","誤り。最高裁判所の指名した者の名簿によって「内閣」が任命する（80条1項）。","誤り。非公開にできるのは「対審」だけ。判決は常に公開（82条2項）。","正しい。82条2項ただし書。","誤り。その後10年を経過した後初めて行われる総選挙の際に、更に審査に付される（79条2項）。"],"answer":3},{"id":"q18","area":"人権：人身・社会権・国務請求権","topic":"適正手続（判例）","basis":["最大判平4.7.1","最大判昭47.11.22","最大判昭37.11.28","最大判昭47.12.20"],"tip":"","kind":"mc","format":"妥当なもの","stem":"人身の自由と適正手続に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["行政手続においては、相手方に事前の告知・弁解・防御の機会を常に与えなければならない。","憲法35条の令状主義は刑事手続にのみ適用され、行政手続には一切及ばない。","憲法31条の法定手続の保障は直接には刑事手続に関するものであるが、行政手続についても、刑事手続でないとの理由のみで、そのすべてが当然に同条の保障の枠外にあると判断すべきではない。","審理の著しい遅延により迅速な裁判を受ける権利が害された異常な事態が生じた場合でも、これに対処する具体的規定がなければ審理を打ち切ることはできない。","第三者の所有物を、その所有者に告知・弁解・防御の機会を与えることなく没収することは、憲法31条及び29条に違反しない。"],"why":["誤り。成田新法事件は、行政処分の内容・性質等を総合較量して決すべきで、常に必要とは限らないとした。","誤り。最大判昭47.11.22（川崎民商事件）は、行政手続にも35条の保障が及ぶ場合があるとした（ただし当該検査は合憲）。","正しい。最大判平4.7.1（成田新法事件）。","誤り。最大判昭47.12.20（高田事件）は、免訴により審理を打ち切るべきとした。","誤り。最大判昭37.11.28（第三者所有物没収事件）は違憲とした。"],"answer":2},{"id":"q19","area":"人権：精神的自由","topic":"思想・良心と学問の自由（判例）","basis":["最判平23.5.30","最大判昭31.7.4","最大判昭38.5.22","最大判昭51.5.21","最大判昭48.12.12"],"tip":"","kind":"mc","format":"妥当なもの","stem":"思想・良心の自由および学問の自由に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["公立学校の校長が教諭に対し、卒業式の国歌斉唱の際に起立斉唱を命じた職務命令は、思想及び良心の自由の間接的な制約となる面はあるが、許容し得る程度の必要性及び合理性が認められ、憲法19条に違反しない。","企業が労働者の採用に当たり思想・信条を調査し、関連事項の申告を求めることは、直ちに違法となる。","謝罪広告を命じる判決は、単に事態の真相を告白し陳謝の意を表明する程度のものであっても、良心の自由を侵害し違憲である。","普通教育の教師にも、大学教授と同様に完全な教授の自由が認められる。","大学における学生の集会は、実社会の政治的社会的活動に当たる行為をする場合でも、大学の有する特別の学問の自由と自治を享有する。"],"why":["正しい。最判平23.5.30。","誤り。最大判昭48.12.12（三菱樹脂事件）は、直ちに違法とはいえないとした。","誤り。最大判昭31.7.4は合憲とした。","誤り。最大判昭51.5.21（旭川学テ事件）は、一定の範囲の教授の自由を認めつつ、完全な自由は認められないとした。","誤り。最大判昭38.5.22（東大ポポロ事件）は、そのような集会は大学の自由と自治を享有しないとした。"],"answer":0},{"id":"q20","area":"記述式","topic":"表現の自由","basis":["憲法21条1項・2項","最大判昭61.6.11（北方ジャーナル事件）"],"tip":"本試験の記述式は行政法1問・民法2問で、憲法からは出題されない。この問題は判例の要件を正確に書く練習用。要件は「又は」と「かつ」の位置を崩さずに書く。","stem":"Xは、公職選挙の立候補予定者である自己を批判・攻撃する記事を掲載した雑誌がY社から近く発行されることを知り、名誉権に基づいてその出版の事前差止めを求めた。最高裁判所の判例によれば、このような公共の利害に関する事項についての表現行為の事前差止めは原則として許されないが、例外的に許されるのはどのような場合か。\u003cb>40字程度\u003c/b>で記述しなさい。","kind":"essay","format":"記述 40字程度（練習）","model":"真実でないか専ら公益目的でないことが明白で、重大かつ著しく回復困難な損害のおそれがある場合","explain":"北方ジャーナル事件（最大判昭61.6.11）。事前差止めは事前抑制の一種で、21条の趣旨に照らし厳格かつ明確な要件の下でのみ許される。公務員や公職選挙の候補者に対する評価・批判等の表現行為は原則として差止めできないが、「その表現内容が真実でなく、又はそれが専ら公益を図る目的のものでないことが明白であつて、かつ、被害者が重大にして著しく回復困難な損害を被る虞があるとき」は例外的に許される。構造は「（真実でない 又は 公益目的でない）が明白」かつ「重大・著しく回復困難な損害のおそれ」。","elements":[{"label":"表現内容が真実でないこと","kw":["真実"],"pts":5},{"label":"または、専ら公益を図る目的でないこと","kw":["公益"],"pts":5},{"label":"それが「明白」であること","kw":["明白","明らか"],"pts":5},{"label":"被害者が重大かつ著しく回復困難な損害を被るおそれ","kw":["回復困難","回復が困難","回復し難","回復しがた"],"pts":5}]}]};
