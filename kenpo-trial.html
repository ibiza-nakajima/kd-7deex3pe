<script>window.SET = {"id":"kenpo-trial","code":"憲法01","title":"憲法 お試しセット","minutes":25,"lead":"最初に作ったお試しセットです。統治の条文と人権の重要判例を11問で確認します。","questions":[{"id":"q01","area":"統治：国会","topic":"国会・衆議院の優越","basis":["憲法59条2項〜4項（法律案：再可決・任意的協議会・60日）","憲法60条（予算：衆議院先議・必要的協議会・30日）","憲法61条（条約：60条2項のみ準用）","憲法67条2項（総理指名：必要的協議会・10日）","憲法96条1項（改正発議：衆議院の優越なし）"],"tip":"60日・30日・10日の入れ替えと、協議会が「必要的か任意的か」は定番のひっかけ。法律案だけが任意的で再可決あり、と覚える。","stem":"国会の議決に関する次の記述のうち、憲法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","kind":"mc","format":"妥当なもの","options":["予算は先に衆議院に提出しなければならないが、条約の締結に必要な国会の承認については、先に参議院に提出することもできる。","法律案について参議院が衆議院と異なった議決をした場合、衆議院は両院協議会を必ず開かなければならない。","参議院が、衆議院の可決した法律案を受け取った後、国会休会中の期間を除いて30日以内に議決しないときは、衆議院の議決が国会の議決となる。","内閣総理大臣の指名について、衆議院が指名の議決をした後、国会休会中の期間を除いて30日以内に参議院が指名の議決をしないときは、衆議院の議決が国会の議決となる。","憲法改正の発議について、衆議院で総議員の3分の2以上の賛成で可決し参議院で否決した場合でも、衆議院が再び総議員の3分の2以上の賛成で可決したときは、国会が発議したことになる。"],"answer":0,"why":["正しい。60条1項は予算の衆議院先議を定めるが、61条が条約に準用するのは60条2項（議決の効力）だけ。条約は参議院に先に提出してもよい。","誤り。59条3項は「両院協議会を開くことを求めることを妨げない」とするだけで、法律案の両院協議会は任意的。予算・条約・総理指名は必要的。","誤り。59条4項は「60日以内」。効果も「否決したものとみなすことができる」にとどまり、法律になるには衆議院の出席議員の3分の2以上による再可決（59条2項）が必要。30日で自動的に国会の議決となるのは予算・条約（60条2項・61条）。","誤り。67条2項は「10日以内」。","誤り。96条1項は「各議院の総議員の3分の2以上」の賛成で発議する。憲法改正の発議に衆議院の優越はない。"]},{"id":"q02","area":"人権：参政権","topic":"選挙権・立候補の自由","basis":["憲法15条1項・3項、43条1項、44条ただし書","最大判平17.9.14（在外日本人選挙権訴訟）","最大判令4.5.25（在外国民審査権訴訟）","最判昭60.11.21（在宅投票制度廃止事件）","最大判昭43.12.4（三井美唄炭鉱労組事件）","最大判昭51.4.14（衆議院議員定数不均衡訴訟）"],"tip":"「勧告・説得まではOK、処分はNG」。判例の線引きの“どこまで”を問う肢は、限界を一歩超えた表現になっていないかを見る。","stem":"選挙権・立候補の自由等に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","kind":"mc","format":"妥当でないもの","options":["国民の選挙権又はその行使を制限することは原則として許されず、制限するためには、そのような制限をすることがやむを得ないと認められる事由がなければならない。","在外国民に最高裁判所裁判官の国民審査権の行使を全く認めていなかった最高裁判所裁判官国民審査法の規定は、憲法に違反する。","国会議員の立法行為は、立法の内容が憲法の一義的な文言に違反しているにもかかわらず国会があえて当該立法を行うというごとき、容易に想定し難いような例外的な場合でない限り、国家賠償法1条1項の適用上、違法の評価を受けない。","労働組合は、統一候補以外の組合員で立候補しようとする者に対し、立候補を思いとどまるよう勧告・説得するにとどまらず、これに従わずに立候補したことを理由として統制違反者として処分することもできる。","衆議院議員の定数配分規定を違憲と判断しつつ、いわゆる事情判決の法理により選挙を無効とせず、選挙の違法を宣言するにとどめた判例がある。"],"answer":3,"why":["正しい。在外日本人選挙権訴訟（最大判平17.9.14）。在外選挙を比例代表に限っていた公職選挙法を違憲とし、国家賠償請求も認めた。","正しい。在外日本人国民審査権訴訟（最大判令4.5.25）。審査権も選挙権と同様に「やむを得ない事由」がなければ制限できないとして、違憲と判断した。","正しい。在宅投票制度廃止事件（最判昭60.11.21）の判示。なお、この枠組みは平17年の在外選挙権判決で「権利を違法に侵害することが明白な場合」等へと実質的に修正されている点も押さえる。","誤り（これが正解）。三井美唄炭鉱労組事件（最大判昭43.12.4）。立候補の自由は憲法15条1項が保障する重要な基本的人権。勧告・説得は許されるが、それを超えて、従わないことを理由に統制違反として処分することは統制権の限界を超え違法。","正しい。最大判昭51.4.14。行政事件訴訟法31条の基礎にある「一般的な法の基本原則」を適用し、選挙を無効とせず違法を宣言した。"]},{"id":"q03","area":"人権：人身・社会権・国務請求権","topic":"生存権","basis":["憲法25条","最大判昭42.5.24（朝日訴訟）","最大判昭57.7.7（堀木訴訟）","最判平13.9.25（不法残留者と生活保護）","最判平26.7.18（永住外国人と生活保護）"],"tip":"組合せ問題は、確実に判断できる肢から消去する。ここではイ（相続）が誤りと分かれば、1・3が消える。","stem":"生存権に関する次の記述ア〜オのうち、最高裁判所の判例に照らし、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","kind":"mc","format":"組合せ","options":["ア・イ","ア・エ","イ・ウ","ウ・オ","エ・オ"],"answer":1,"items":["憲法25条1項は、すべての国民が健康で文化的な最低限度の生活を営み得るように国政を運営すべきことを国の責務として宣言したにとどまり、直接個々の国民に対して具体的権利を賦与したものではない。","生活保護法に基づく保護受給権は、被保護者の死亡により相続の対象となるから、被保護者が提起した訴訟は相続人がこれを承継することができる。","障害福祉年金と児童扶養手当の併給を禁止する規定は、立法府の裁量の範囲を逸脱するものであり、憲法25条に違反する。","不法残留者を、緊急に治療を要する場合であっても生活保護法に基づく保護の対象としないことは、憲法25条および14条1項に違反しない。","永住者の在留資格を有する外国人は、生活保護法に基づく保護の対象となり、同法に基づく受給権を有する。"],"itemOk":[true,false,false,true,false],"itemWhy":["正しい。朝日訴訟（最大判昭42.5.24）。具体的権利は、生活保護法によって初めて与えられる。","誤り。同判決は、保護受給権は一身専属の権利で相続の対象となり得ないとして、原告の死亡により訴訟は終了したとした。","誤り。堀木訴訟（最大判昭57.7.7）。25条の具体化は立法府の広い裁量に委ねられ、著しく合理性を欠き明らかに裁量の逸脱・濫用と見ざるをえない場合を除き、裁判所の審査に適しない。併給調整条項は合憲。","正しい。最判平13.9.25。不法残留者を保護の対象としないことは25条・14条1項に違反しない。","誤り。最判平26.7.18。生活保護法の「国民」は日本国民を意味し、外国人は行政措置により事実上の保護の対象となり得るにとどまり、同法に基づく受給権を有しない。"]},{"id":"q04","area":"人権総論","topic":"外国人の人権","basis":["最大判昭53.10.4（マクリーン事件）","最判平7.2.28（定住外国人の地方選挙権）","最判平4.11.16（森川キャサリーン事件）","最判平1.3.2（塩見訴訟）","最大判平17.1.26（東京都管理職選考事件）"],"tip":"外国人の人権は「権利の性質上、日本国民のみを対象とするものを除き保障される」（性質説）が出発点。参政権・入国・再入国・社会権は保障されない側、と整理する。","stem":"外国人の人権に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","kind":"mc","format":"妥当なもの","options":["外国人の在留期間中の政治活動にも憲法の保障が及ぶから、法務大臣が在留期間の更新の際にこれを消極的な事情として斟酌することは許されない。","憲法93条2項の「住民」には在留外国人も含まれるから、定住外国人には地方公共団体の長および議会の議員の選挙権が憲法上保障されている。","我が国に在留する外国人は、憲法上、外国へ一時旅行する自由を保障されている。","障害福祉年金の支給対象者から在留外国人を除外することは、立法府の裁量の範囲に属するとはいえず、憲法25条および14条1項に違反する。","地方公共団体が、公権力行使等地方公務員の職とこれに昇任するのに必要な職務経験を積むために経るべき職とを包含する一体的な管理職の任用制度を構築した上で、日本国民である職員に限って管理職に昇任することができることとする措置を執ることは、労働基準法3条にも憲法14条1項にも違反しない。"],"answer":4,"why":["誤り。マクリーン事件（最大判昭53.10.4）。外国人の人権保障は在留制度の枠内で与えられているにすぎず、在留期間更新の際に消極的事情として斟酌されないことまでの保障はない。","誤り。最判平7.2.28。93条2項の「住民」は日本国民を意味する。ただし、永住者等に法律で地方選挙権を付与することは憲法上禁止されていない（立法政策の問題）。","誤り。森川キャサリーン事件（最判平4.11.16）。外国人に外国へ一時旅行する自由は保障されていない。","誤り。塩見訴訟（最判平1.3.2）。限られた財源の下で自国民を優先することも許され、立法府の裁量の範囲に属する。","正しい（これが正解）。東京都管理職選考事件（最大判平17.1.26）。"]},{"id":"q05","area":"統治：裁判所","topic":"司法権の限界","basis":["憲法76条1項・81条、裁判所法3条1項（法律上の争訟）","最大判昭27.10.8（警察予備隊違憲訴訟）","最判昭56.4.7（板まんだら事件）","最大判昭34.12.16（砂川事件）","最判昭63.12.20（共産党袴田事件）","最大判令2.11.25（地方議会議員出席停止事件）"],"tip":"部分社会系は「一般市民法秩序と直接関係するか」で切る。除名（袴田）・単位不認定（富山大）・出席停止（令2）を並べて覚える。","stem":"司法権の限界に関する次の記述ア〜オのうち、最高裁判所の判例に照らし、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","kind":"mc","format":"組合せ","options":["ア・イ","ア・オ","イ・ウ","ウ・エ","エ・オ"],"answer":2,"items":["最高裁判所は、具体的な争訟事件が提起されていなくても、憲法の番人として、抽象的に法令の合憲性を判断する権限を有する。","寄附金の返還を求める訴えであっても、信仰の対象の価値又は宗教上の教義に関する判断が訴訟の帰すうを左右する必要不可欠のものであり、紛争の核心となっている場合には、法律上の争訟に当たらない。","日米安全保障条約のような高度の政治性を有する条約は、一見極めて明白に違憲無効であると認められない限りは、裁判所の司法審査権の範囲外のものである。","政党が党員に対してした除名処分は、政党の内部的自律権に属する行為であるから、それが一般市民としての権利利益を侵害する場合であっても、裁判所の審判権は及ばない。","普通地方公共団体の議会が議員に対して科した出席停止の懲罰は、議会の内部規律の問題として自治的措置に任せるべきであり、裁判所の司法審査の対象とならない。"],"itemOk":[false,true,true,false,false],"itemWhy":["誤り。警察予備隊違憲訴訟（最大判昭27.10.8）。裁判所は具体的な争訟事件を離れて抽象的に法令の合憲性を判断する権限を持たない（付随的違憲審査制）。","正しい。板まんだら事件（最判昭56.4.7）。","正しい。砂川事件（最大判昭34.12.16）。純粋な統治行為論ではなく「一見極めて明白に違憲無効」なら審査する余地を残す点に注意（衆議院解散を扱った苫米地事件との違い）。","誤り。共産党袴田事件（最判昭63.12.20）。除名処分が一般市民としての権利利益を侵害する場合には審判権が及ぶ。その場合も、政党の自律的規範（公序良俗違反等の特段の事情がない限り）に照らし、規範がなければ条理に基づき、適正な手続に則ったかどうかで判断する。","誤り。最大判令2.11.25。出席停止の懲罰は司法審査の対象となるとして、山北村事件（最大判昭35.10.19）を変更した。"]},{"id":"q06","area":"人権：精神的自由","topic":"表現の自由","basis":["憲法21条1項・2項","最判平7.3.7（泉佐野市民会館事件）","最判令4.2.15（大阪市ヘイトスピーチ条例事件）","最大判昭58.6.22（よど号記事抹消事件）","最大決昭44.11.26（博多駅事件）","最大判昭59.12.12（税関検査事件）"],"tip":"「抽象的な危険で足りる」「いかなる場合も」「一切」など、判例の基準をゆるめたり極端にしたりする言葉は誤りの目印になりやすい。","stem":"表現の自由に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","kind":"mc","format":"妥当でないもの","options":["集会の用に供される公共施設の利用を不許可とするには、その集会が開かれることにより公共の安全が損なわれる抽象的な危険があれば足りる。","大阪市ヘイトスピーチへの対処に関する条例が定める、表現活動の拡散防止措置および表現活動を行った者の氏名等の公表は、憲法21条1項に違反しない。","未決拘禁者の新聞紙・図書等の閲読の自由を制限するには、その閲読を許すことにより監獄内の規律及び秩序の維持上放置することのできない程度の障害が生ずる相当の蓋然性があると認められることが必要である。","報道機関の報道は国民の知る権利に奉仕するものであり、報道の自由は憲法21条の保障の下にあり、報道のための取材の自由も、憲法21条の精神に照らし、十分尊重に値する。","税関検査は、関税徴収手続の一環として行われるもので、思想内容等それ自体を網羅的に審査し規制することを目的とするものではなく、憲法21条2項前段の「検閲」に当たらない。"],"answer":0,"why":["誤り（これが正解）。泉佐野市民会館事件（最判平7.3.7）。「明らかな差し迫った危険の発生が具体的に予見されること」が必要で、抽象的な危険では足りない。","正しい。大阪市ヘイトスピーチ条例事件（最判令4.2.15）。制限は合理的で必要やむを得ない限度にとどまるとした。","正しい。よど号ハイジャック記事抹消事件（最大判昭58.6.22）。","正しい。博多駅事件（最大決昭44.11.26）。ただし公正な刑事裁判の実現のために取材フィルムの提出を命じることは許されるとした。","正しい。札幌税関検査事件（最大判昭59.12.12）。検閲を「行政権が主体となって、思想内容等の表現物を対象とし、その全部又は一部の発表の禁止を目的として、対象とされる一定の表現物につき網羅的一般的に、発表前にその内容を審査した上、不適当と認めるものの発表を禁止すること」と定義した。"]},{"id":"q07","area":"人権：平等・幸福追求","topic":"プライバシー・自己決定","basis":["憲法13条","最大判昭44.12.24（京都府学連事件）","最判昭56.4.14（前科照会事件）","最判平15.9.12（早稲田大学名簿提出事件）","最判令5.3.9（マイナンバー訴訟）","最判平12.2.29（エホバの証人輸血拒否事件）"],"tip":"「〜以上、違法となることはない」「〜である以上、責任を負わない」のような断定は、判例が利益衡量をしている場面ではまず誤り。","stem":"プライバシーおよび自己決定に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","kind":"mc","format":"妥当なもの","options":["何人もその承諾なしにみだりにその容ぼう・姿態を撮影されない自由を有するが、これは憲法上の保障を受けるものではないから、警察官による撮影の適否は法律上の問題にとどまる。","市区町村長が、弁護士法23条の2に基づく弁護士会からの照会に応じて前科等を報告することは、照会に法律上の根拠がある以上、違法となることはない。","大学が講演会参加者の学籍番号・氏名・住所・電話番号を記載した名簿を本人に無断で警察に提出したとしても、これらの情報は秘匿性が高くないから、プライバシー侵害による不法行為は成立しない。","行政機関等が番号利用法に基づき特定個人情報の利用、提供等をする行為は、個人に関する情報をみだりに第三者に開示又は公表されない自由を侵害するものではなく、憲法13条に違反しない。","宗教上の信念から輸血を拒否する意思を明確にしている患者に対し、医師が、他に救命手段がない事態に至れば輸血する方針であることを説明しないまま手術を行い輸血したとしても、救命のための行為である以上、不法行為責任を負うことはない。"],"answer":3,"why":["誤り。京都府学連事件（最大判昭44.12.24）。この自由は憲法13条の趣旨から導かれ、警察官が正当な理由なく撮影することは許されない。現行犯的状況・証拠保全の必要性と緊急性・相当な方法を満たせば撮影は許される。","誤り。前科照会事件（最判昭56.4.14）。漫然と前科等の全部を報告することは公権力の違法な行使に当たる。","誤り。早稲田大学江沢民講演会名簿提出事件（最判平15.9.12）。これらもプライバシーに係る情報として法的保護の対象となり、無断開示は不法行為を構成する。","正しい（これが正解）。マイナンバー訴訟（最判令5.3.9）。住基ネット訴訟（最判平20.3.6）と同じ枠組み。","誤り。エホバの証人輸血拒否事件（最判平12.2.29）。輸血を伴う医療行為を拒否する意思決定をする権利は人格権の一内容として尊重されるべきで、説明を怠りその機会を奪ったことは不法行為となる。"]},{"id":"q08","area":"人権：精神的自由","topic":"信教の自由・政教分離","basis":["憲法20条1項・3項、89条","最大判昭63.6.1（自衛官合祀訴訟）","最大判昭52.7.13（津地鎮祭事件）","最大判平9.4.2（愛媛玉串料訴訟）","最大判令3.2.24（孔子廟訴訟）","最判平8.3.8（剣道実技拒否事件）"],"tip":"個数問題は1肢でも判断を誤ると落とす。各肢に○×を書き込んでから数える。政教分離は「違憲3件（愛媛・空知太・孔子廟）」を先に固めると速い。","stem":"信教の自由および政教分離に関する次の記述ア〜オのうち、最高裁判所の判例に照らし、\u003cb>妥当なものはいくつ\u003c/b>あるか。","kind":"mc","format":"個数","options":["一つ","二つ","三つ","四つ","五つ"],"answer":2,"items":["殉職した自衛隊員を、その妻の意思に反して県護国神社に合祀申請した事案において、静謐な宗教的環境の下で信仰生活を送るべき利益は、直ちに法的利益として認めることができないとした。","市が体育館の起工式を神式の地鎮祭として挙行し、これに公金を支出したことは、憲法20条3項が禁止する宗教的活動に当たる。","県が靖国神社等の例大祭等に際し、玉串料等を県の公金から支出したことは、憲法20条3項および89条に違反する。","市が管理する都市公園内に設置された孔子廟について、市長が公園使用料の全額を免除したことは、憲法20条3項に違反する。","信仰上の理由から剣道実技を拒否した市立高専の学生に対し、代替措置を検討することなく原級留置・退学処分をしたことは、校長の裁量権の範囲内であり違法ではない。"],"itemOk":[true,false,true,true,false],"itemWhy":["正しい。自衛官合祀訴訟（最大判昭63.6.1）。","誤り。津地鎮祭事件（最大判昭52.7.13）。目的効果基準により、目的は世俗的で効果も特定宗教の援助等に当たらないとして合憲。","正しい。愛媛玉串料訴訟（最大判平9.4.2）。","正しい。孔子廟訴訟（最大判令3.2.24）。空知太神社事件（最大判平22.1.20）と同様、社会通念に照らした総合判断で違憲とした。","誤り。剣道実技拒否事件（最判平8.3.8）。代替措置を検討せずにした処分は、社会観念上著しく妥当を欠き、裁量権の範囲を超える違法なもの。"]},{"id":"q09","area":"統治：地方自治","topic":"地方自治・条例","basis":["憲法92条〜95条","最大判昭50.9.10（徳島市公安条例事件）","最大判昭38.6.26（奈良県ため池条例事件）","最大判昭38.3.27（特別区長公選制廃止事件）","最大判昭37.5.30（大阪市売春取締条例事件）","地方自治法14条3項"],"tip":"委任の具体性は「政令＝個別具体的」「条例＝相当程度に具体的で限定されていれば足りる」の対比で問われる。","stem":"地方自治に関する次の記述のうち、憲法の規定および最高裁判所の判例に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","kind":"mc","format":"妥当でないもの","options":["条例が国の法令に違反するかどうかは、両者の対象事項と規定文言を対比するのみでなく、それぞれの趣旨、目的、内容及び効果を比較し、両者の間に矛盾抵触があるかどうかによって決しなければならない。","ため池の破損・決壊の原因となる堤とうの使用行為を条例で禁止することは、財産権の行使をほとんど全面的に禁止することになるが、災害を防止するため当然受忍すべき制約であり、損失補償を要しない。","東京都の特別区は、憲法93条2項の地方公共団体と認めることはできない。","一の地方公共団体のみに適用される特別法は、法律の定めるところにより、その地方公共団体の住民の投票においてその過半数の同意を得なければ、国会はこれを制定することができない。","条例で罰則を定めるには法律による授権が必要であり、その授権は、政令への罰則の委任と同様に、個別具体的なものでなければならない。"],"answer":4,"why":["正しい。徳島市公安条例事件（最大判昭50.9.10）。","正しい。奈良県ため池条例事件（最大判昭38.6.26）。","正しい。最大判昭38.3.27。区長公選制の廃止は違憲ではないとした。","正しい。憲法95条の文言どおり。","誤り（これが正解）。大阪市売春取締条例事件（最大判昭37.5.30）。条例は公選の議員で組織する議会の議決を経て制定される自治立法で、法律に類するものだから、授権は「相当な程度に具体的であり、限定されておればたりる」。現在は地方自治法14条3項が一般的に罰則の上限を定めている。"]},{"id":"q10","area":"統治：内閣・天皇・財政","topic":"内閣","basis":["憲法66条2項（文民）・68条1項（過半数）","憲法69条・70条（総辞職）","憲法73条6号（政令）","憲法75条（国務大臣の訴追）"],"tip":"内閣は条文知識で解ける得点源。「すべて／過半数」「直ちに／10日以内」の言い換えを正確に。","stem":"内閣に関する次の記述のうち、憲法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","kind":"mc","format":"妥当なもの","options":["国務大臣は、すべて国会議員の中から選ばれなければならない。","国務大臣は、その在任中、内閣総理大臣の同意がなければ訴追されないが、これがため訴追の権利は害されない。","衆議院で内閣不信任の決議案が可決されたときは、内閣は直ちに総辞職しなければならない。","内閣は、政令に、法律の委任がなくても罰則を設けることができる。","衆議院議員総選挙の後に初めて国会の召集があったときでも、内閣は、不信任の決議がされない限り総辞職する必要はない。"],"answer":1,"why":["誤り。68条1項ただし書は「その過半数は、国会議員の中から選ばれなければならない」。","正しい（これが正解）。75条の文言どおり。同意がない間は公訴時効が進行しないと解されている。","誤り。69条。10日以内に衆議院が解散されない限り、総辞職しなければならない。","誤り。73条6号ただし書。特にその法律の委任がある場合を除いては、罰則を設けることができない。","誤り。70条。総選挙後に初めて国会の召集があったときは、内閣は総辞職しなければならない。"]},{"id":"q11","area":"記述式","topic":"表現の自由","basis":["憲法21条1項・2項","最大判昭61.6.11（北方ジャーナル事件）"],"tip":"本試験の記述式は行政法1問・民法2問で、憲法からは出題されない。この問題は判例の要件を正確に書く練習用。要件は「又は」と「かつ」の位置を崩さずに書く。","stem":"Xは、公職選挙の立候補予定者である自己を批判・攻撃する記事を掲載した雑誌がY社から近く発行されることを知り、名誉権に基づいてその出版の事前差止めを求めた。最高裁判所の判例によれば、このような公共の利害に関する事項についての表現行為の事前差止めは原則として許されないが、例外的に許されるのはどのような場合か。\u003cb>40字程度\u003c/b>で記述しなさい。","kind":"essay","format":"記述 40字程度（練習）","model":"真実でないか専ら公益目的でないことが明白で、重大かつ著しく回復困難な損害のおそれがある場合","explain":"北方ジャーナル事件（最大判昭61.6.11）。事前差止めは事前抑制の一種で、21条の趣旨に照らし厳格かつ明確な要件の下でのみ許される。公務員や公職選挙の候補者に対する評価・批判等の表現行為は原則として差止めできないが、「その表現内容が真実でなく、又はそれが専ら公益を図る目的のものでないことが明白であつて、かつ、被害者が重大にして著しく回復困難な損害を被る虞があるとき」は例外的に許される。構造は「（真実でない 又は 公益目的でない）が明白」かつ「重大・著しく回復困難な損害のおそれ」。","elements":[{"label":"表現内容が真実でないこと","kw":["真実"],"pts":5},{"label":"または、専ら公益を図る目的でないこと","kw":["公益"],"pts":5},{"label":"それが「明白」であること","kw":["明白","明らか"],"pts":5},{"label":"被害者が重大かつ著しく回復困難な損害を被るおそれ","kw":["回復困難","回復が困難","回復し難","回復しがた"],"pts":5}]}]};
