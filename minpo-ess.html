<script>window.SET = {"id":"minpo-ess","code":"民法記述","title":"記述特訓 民法（6題）","lead":"民法の記述式は2問40点で、合否を分けます。設問の問いかけ（誰に・何を・どのような根拠で・いつまでに）に一つずつ答える形で書くと、キーワードが抜けにくくなります。1題5分が目安です。","minutes":30,"questions":[{"id":"q01","area":"記述式","topic":"賃借権に基づく返還請求（記述）","basis":["民法605条の4・423条"],"tip":"「妨害→停止」「占有→返還」の使い分けを答案に正確に書く。根拠（賃借権）も忘れずに。","kind":"essay","format":"記述 40字程度","stem":"Aは、B所有の甲土地を建物所有目的で賃借し、甲土地上に登記された建物を所有して対抗要件を備えた。ところが、Cが甲土地の一部を不法に占有している。この場合、Aは、民法上、Cに対してどのような根拠に基づき、どのような請求をすることができるか。40字程度で記述しなさい。","model":"対抗要件を備えた賃借人として、賃借権に基づき、Cに対し甲土地の返還を請求できる。","explain":"平成29年改正で新設された605条の4。対抗要件を備えた不動産の賃借人は、不動産の占有を第三者が妨害しているときは妨害の停止を、第三者が占有しているときは返還を請求できる。Cは土地を占有しているので「返還」請求。なお、対抗要件がない場合には、賃貸人Bの所有権に基づく返還請求権を代位行使する（423条の転用）ことや、Aが占有していれば占有の訴えも考えられる。","elements":[{"label":"対抗要件を備えた不動産賃借人であること","kw":["対抗要件"],"pts":5},{"label":"賃借権に基づく請求であること","kw":["賃借権に基"],"pts":5},{"label":"Cに対する返還請求","kw":["返還"],"pts":10}]},{"id":"q02","area":"記述式","topic":"詐欺による取消しと第三者（記述）","basis":["民法96条3項"],"tip":"「結論（できない）＋理由（善意無過失の第三者に対抗できない）」の2点で書く。","kind":"essay","format":"記述 40字程度","stem":"Aは、Bにだまされて、A所有の甲土地をBに売却し、移転登記をした。その後、Bは、Bの詐欺について善意でかつ過失のないCに甲土地を転売した。Aが詐欺を理由にAB間の売買契約を取り消した場合、Aは、Cに対して甲土地の返還を請求することができるか。民法の規定に照らし、理由とともに40字程度で記述しなさい。","model":"詐欺による取消しは善意でかつ過失がない第三者に対抗できないため、AはCに返還を請求できない。","explain":"民法96条3項。詐欺による意思表示の取消しは、善意でかつ過失がない第三者に対抗することができない。Cは取消し「前」に利害関係に入った第三者なので96条3項で判断する。取消し「後」の第三者であれば、177条の対抗問題となり登記の先後で決まる。なお、強迫による取消しは善意無過失の第三者にも対抗できる。","elements":[{"label":"詐欺による取消し","kw":["詐欺"],"pts":4},{"label":"善意","kw":["善意"],"pts":4},{"label":"過失がない（無過失）","kw":["無過失","過失がない","過失のない"],"pts":4},{"label":"第三者に対抗することができない","kw":["対抗"],"pts":4},{"label":"返還を請求できない（結論）","kw":["請求できない","請求することができない","請求不可"],"pts":4}]},{"id":"q03","area":"記述式","topic":"債権者代位権（記述）","basis":["民法423条・423条の2・423条の3"],"tip":"「Bの権利を（代位）」「自己に支払え」が2大キーワード。","kind":"essay","format":"記述 40字程度","stem":"Aは、Bに対して100万円の貸金債権（弁済期到来済み）を有している。Bは無資力であるが、Cに対して80万円の売買代金債権を有しており、これを行使しようとしない。Aは、Cに対して、誰のどのような権利を行使し、どのような支払を求めることができるか。40字程度で記述しなさい。","model":"AはBのCに対する代金債権を代位行使し、Cに対し80万円を自己に支払うよう求めることができる。","explain":"民法423条1項・423条の2・423条の3。債権者は、自己の債権を保全するため必要があるときは、債務者に属する権利（被代位権利）を行使できる。目的が可分なときは自己の債権額の限度で行使でき（423条の2）、本問は被代位権利が80万円なので全額。金銭の支払を目的とするときは、相手方に対し自己への支払を求めることができる（423条の3）。","elements":[{"label":"Bの代金債権を代位行使","kw":["代位"],"pts":7},{"label":"80万円（自己の債権額の範囲内）","kw":["80万","八十万"],"pts":6},{"label":"自己（A）への支払","kw":["自己に","自己へ","Aに支払","Aへの支払","Aに対して支払","自分に"],"pts":7}]},{"id":"q04","area":"記述式","topic":"錯誤と表意者の重過失（記述）","basis":["民法95条3項"],"tip":"「原則→例外」型の記述は、例外を全部挙げるのが満点の条件。","kind":"essay","format":"記述 40字程度","stem":"Aは、Bとの売買契約において、法律行為の目的及び取引上の社会通念に照らして重要な錯誤に陥って意思表示をしたが、その錯誤はAの重大な過失によるものであった。この場合でも、Aがこの意思表示を取り消すことができるのはどのような場合か。民法の規定に照らし、40字程度で記述しなさい。","model":"Bが錯誤を知り又は重大な過失で知らなかったときと、Bも同一の錯誤に陥っていたときである。","explain":"民法95条3項。錯誤が表意者の重大な過失によるものであった場合には、原則として取り消すことができない。ただし、①相手方が表意者に錯誤があることを知り、又は重大な過失によって知らなかったとき、②相手方が表意者と同一の錯誤に陥っていたとき（共通錯誤）は、取り消すことができる。","elements":[{"label":"相手方が錯誤を知っていたとき","kw":["知り","知って"],"pts":5},{"label":"相手方が重大な過失によって知らなかったとき","kw":["重大な過失によって知らな","重大な過失で知らな","重過失で知らな","重過失によって知らな"],"pts":5},{"label":"相手方が表意者と同一の錯誤に陥っていたとき","kw":["同一の錯誤","同じ錯誤"],"pts":10}]},{"id":"q05","area":"記述式","topic":"遺留分侵害額請求（記述）","basis":["民法1042条・1046条・1048条"],"tip":"改正前の「減殺請求」と書くと減点の可能性。「侵害額」「金銭」がキーワード。","kind":"essay","format":"記述 40字程度","stem":"Aは、全財産を友人Cに遺贈する旨の遺言を残して死亡した。Aの相続人は子Bのみである。Bは、Cに対して、どのような権利に基づき何を請求することができるか。また、その権利は、相続の開始及び遺留分を侵害する遺贈があったことを知った時からいつまでに行使しなければ時効によって消滅するか。40字程度で記述しなさい。","model":"遺留分侵害額請求権に基づき侵害額に相当する金銭の支払を請求でき、知った時から1年で時効消滅する。","explain":"民法1046条1項・1048条。遺留分権利者は、受遺者・受贈者に対し、遺留分侵害額に相当する金銭の支払を請求できる（改正前の「遺留分減殺請求」〔物の返還〕から金銭債権に変わった）。権利は、相続の開始及び遺留分を侵害する贈与・遺贈があったことを知った時から1年、相続開始の時から10年で消滅する。本問のBの遺留分は2分の1（1042条1項2号）。","elements":[{"label":"遺留分侵害額請求権","kw":["遺留分"],"pts":5},{"label":"侵害額に相当する","kw":["侵害額"],"pts":5},{"label":"金銭の支払","kw":["金銭"],"pts":5},{"label":"1年","kw":["1年","一年"],"pts":5}]},{"id":"q06","area":"記述式","topic":"契約不適合責任（記述）","basis":["民法562条〜564条・566条"],"tip":"「追完・減額・損害賠償・解除」の4点セットを丸ごと覚える。","kind":"essay","format":"記述 40字程度","stem":"Aは、Bから中古自動車を購入し引渡しを受けたが、エンジンに契約の内容に適合しない欠陥があった。Aは、Bに対して、民法上どのような請求等をすることができるか。4つ挙げて、40字程度で記述しなさい。","model":"履行の追完の請求、代金の減額の請求、損害賠償の請求及び契約の解除をすることができる。","explain":"民法562条〜564条。買主は、①履行の追完（修補・代替物の引渡し・不足分の引渡し）の請求（562条）、②代金減額請求（563条。原則として相当期間を定めた追完の催告が必要）、③損害賠償請求（564条・415条）、④解除（564条・541条・542条）ができる。種類・品質の不適合は、不適合を知った時から1年以内に売主に通知しないと権利を失う（566条。売主が悪意・重過失の場合を除く）。","elements":[{"label":"履行の追完請求","kw":["追完"],"pts":5},{"label":"代金減額請求","kw":["減額"],"pts":5},{"label":"損害賠償請求","kw":["損害賠償"],"pts":5},{"label":"契約の解除","kw":["解除"],"pts":5}]}]};
