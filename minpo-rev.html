<script>window.SET = {"id":"minpo-rev","code":"民法復習","title":"民法 誤答の解き直し（12問）","lead":"民法①②で間違えた12問だけを、肢の順番を入れ替えて出題します。条文番号と「原則→例外」の順で理由を確認してください。","minutes":20,"questions":[{"id":"q01","area":"能力・失踪","topic":"相手方の催告権","basis":["民法20条・124条・126条"],"tip":"確答がないとき、単独で追認できる者（本人が能力者になった後・法定代理人等）への催告なら「追認」、被保佐人・被補助人への催告なら「取消し」とみなす。","kind":"mc","format":"妥当でないもの","stem":"制限行為能力者の相手方の催告権に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["被保佐人に対し、1か月以上の期間を定めて保佐人の追認を得るべき旨を催告し、期間内に追認を得た旨の通知を発しないときは、取り消したものとみなす。","法定代理人に対して催告し、期間内に確答を発しないときは、追認したものとみなす。","未成年者が成年に達し、取消しの原因となっていた状況が消滅した後に追認をすれば、その行為は確定的に有効となる。","制限行為能力者が行為能力者となった後、その者に対し1か月以上の期間を定めて追認するかどうか確答すべき旨を催告し、期間内に確答を発しないときは、取り消したものとみなす。","取消権は、追認をすることができる時から5年間行使しないときは、時効によって消滅する。"],"why":["正しい。20条4項。","正しい。20条2項。","正しい。124条1項。","誤り（これが正解）。行為能力者となった本人が確答しないときは、追認したものとみなす（20条1項）。","正しい。126条前段（行為の時から20年でも消滅）。"],"answer":3},{"id":"q02","area":"意思表示","topic":"錯誤・詐欺・強迫","basis":["民法95条・96条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"錯誤、詐欺および強迫に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["第三者が強迫をした場合においては、相手方がその事実を知り、又は知ることができたときに限り、その意思表示を取り消すことができる。","錯誤による意思表示の取消しは、善意でかつ過失がない第三者に対抗することができない。","詐欺による意思表示の取消しは、善意でかつ過失がない第三者に対抗することができない。","法律行為の基礎とした事情についての認識が真実に反する錯誤による取消しは、その事情が法律行為の基礎とされていることが表示されていたときに限り、することができる。","錯誤が表意者の重大な過失によるものであった場合でも、相手方が表意者に錯誤があることを知り、又は重大な過失によって知らなかったときは、取り消すことができる。"],"why":["誤り（これが正解）。その限定は第三者による「詐欺」の場合（96条2項）。強迫は相手方の知・不知を問わず取り消せる。","正しい。95条4項。","正しい。96条3項。強迫には第三者保護規定はない。","正しい。95条2項（動機の錯誤）。","正しい。95条3項1号。"],"answer":0},{"id":"q03","area":"時効","topic":"取得時効","basis":["民法162条","最判昭42.7.21","最判平8.11.12","最判昭33.8.28"],"tip":"時効完成「前」の第三者には登記なしで対抗でき、完成「後」の第三者とは対抗関係。時系列を図にして判断する。","kind":"mc","format":"妥当なもの","stem":"取得時効に関する次の記述のうち、民法の規定および判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["自己の物について取得時効が成立する余地はない。","他主占有者の相続人は、相続によって当然に自主占有を取得する。","20年間、所有の意思をもって、平穏に、かつ、公然と他人の物を占有した者は、その所有権を取得する。","不動産の取得時効が完成した後に原所有者から譲り受けて登記をした第三者に対しても、時効取得者は登記なくして所有権を対抗することができる。","占有開始時に善意無過失であっても、その後悪意となった場合には、10年の取得時効は成立しない。"],"why":["誤り。最判昭42.7.21は、自己の物の時効取得も認める。","誤り。最判平8.11.12は、新たな事実的支配に加え、所有の意思に基づくと解される事情を相続人が証明する必要があるとした。","正しい。162条1項。","誤り。時効完成後の第三者とは対抗関係になり、登記が必要（最判昭33.8.28）。","誤り。善意無過失は占有開始時に判断すれば足りる（162条2項）。"],"answer":2},{"id":"q04","area":"物権変動","topic":"不動産物権変動と登記","basis":["民法177条・899条の2","最判平8.10.29","最判昭25.12.19","大判昭17.9.30"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"不動産物権変動に関する次の記述のうち、民法の規定および判例に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["背信的悪意者からの転得者は、その者自身が第一譲受人に対する関係で背信的悪意者と評価されない限り、所有権取得を第一譲受人に対抗することができる。","不法占拠者は民法177条の「第三者」に当たらないので、所有者は登記なくして明渡しを請求できる。","相続により法定相続分を超えて権利を承継した場合、その超える部分については、登記を備えなければ第三者に対抗することができない。","取消し後に、取り消された法律行為の相手方から不動産を譲り受けた第三者と取消しをした者とは、対抗関係に立つ。","不動産の二重譲渡において、第二譲受人が第一譲渡の事実を知っていた場合には、第二譲受人は先に登記を備えても、第一譲受人に所有権の取得を対抗することができない。"],"why":["正しい。最判平8.10.29。","正しい。最判昭25.12.19。","正しい。899条の2第1項。","正しい。大判昭17.9.30。","誤り（これが正解）。単純悪意者も177条の「第三者」に含まれる。排除されるのは背信的悪意者のみ。"],"answer":4},{"id":"q05","area":"所有権・共有","topic":"相隣関係・共有物の変更","basis":["民法212条・233条・251条・252条・256条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"所有権に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["共有物の変更（その形状又は効用の著しい変更を伴わないものを除く。）は、持分の価格の過半数で決する。","他の土地に囲まれて公道に通じない土地の所有者は、公道に至るため他の土地を通行することができ、通行地の損害に対して償金を支払う必要はない。","土地の所有者は、隣地の竹木の枝が境界線を越える場合において、竹木の所有者に枝を切除するよう催告したにもかかわらず、相当の期間内に切除しないときは、その枝を自ら切り取ることができる。","隣地の竹木の根が境界線を越えるときでも、土地の所有者は竹木の所有者に切除させなければならず、自ら切り取ることはできない。","共有物の各共有者は、他の共有者の同意を得なければ、共有物の分割を請求することができない。"],"why":["誤り。共有者全員の同意が必要（251条1項）。軽微な変更は過半数で足りる（252条1項）。","誤り。償金を支払わなければならない（212条）。","正しい。233条3項1号（令和3年改正）。","誤り。根は自ら切り取ることができる（233条4項）。","誤り。各共有者はいつでも分割を請求できる（256条1項）。"],"answer":2},{"id":"q06","area":"所有権・共有","topic":"共有","basis":["民法249条・251条・252条・255条・958条の2","最判平1.11.24"],"tip":"","kind":"mc","format":"個数","stem":"共有に関する次の記述ア〜オのうち、民法の規定および判例に照らし、\u003cb>妥当なものはいくつ\u003c/b>あるか。","items":["共有物の管理に関する事項（変更を除く。）は、共有者全員の同意によって決する。","共有者の一人が死亡して相続人がないときは、その持分は、特別縁故者に対する財産分与の対象となることなく、直ちに他の共有者に帰属する。","共有者が他の共有者の所在を知ることができないときであっても、共有物に変更を加えるには所在等不明共有者を含む共有者全員の同意が必要であり、裁判所がこれに代わる裁判をすることはできない。","各共有者は、共有物の全部について、その持分に応じた使用をすることができる。","各共有者は、共有物の保存行為をすることができる。"],"itemOk":[false,false,false,true,true],"itemWhy":["誤り。各共有者の持分の価格に従い、その過半数で決する（252条1項）。全員の同意が必要なのは変更（軽微変更を除く。251条1項）。","誤り。最判平1.11.24は、特別縁故者への財産分与（958条の2）が優先し、分与されなかったときに255条により他の共有者に帰属するとした。","誤り。裁判所は、所在等不明共有者以外の他の共有者全員の同意を得て変更を加えることができる旨の裁判をすることができる（251条2項、令和3年改正）。","正しい。249条1項。","正しい。252条5項。"],"options":["一つ","二つ","三つ","四つ","五つ"],"answer":1},{"id":"q07","area":"無効・取消し・条件","topic":"条件・期限","basis":["民法127条・130条・133条・136条・412条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"条件および期限に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["条件が成就することによって不利益を受ける当事者が故意にその条件の成就を妨げたときでも、相手方は条件が成就したものとみなすことはできない。","不能の停止条件を付した法律行為は、有効である。","債務の履行について不確定期限があるときは、債務者は、期限の到来を知ったかどうかにかかわらず、期限の到来した時から遅滞の責任を負う。","期限は、債権者の利益のために定めたものと推定する。","停止条件付法律行為は、停止条件が成就した時からその効力を生ずる。"],"why":["誤り。条件が成就したものとみなすことができる（130条1項）。","誤り。無効（133条1項）。","誤り。期限の到来後に履行の請求を受けた時又は期限の到来を知った時のいずれか早い時から遅滞となる（412条2項）。","誤り。債務者の利益のために定めたものと推定する（136条1項）。","正しい。127条1項。"],"answer":4},{"id":"q08","area":"債権：効力・保全","topic":"債務不履行","basis":["民法412条の2・415条・419条・420条・541条〜543条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"債務不履行に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["債務不履行による契約の解除には、債務者の帰責事由が必要である。","金銭債務の不履行については、債務者は不可抗力をもって抗弁とすることができる。","債務の履行が不能であっても、債権者はその債務の履行を請求することができる。","債務の不履行が、契約その他の債務の発生原因及び取引上の社会通念に照らして債務者の責めに帰することができない事由によるものであるときは、債権者は損害賠償を請求できない。","当事者が損害賠償の額を予定した場合、裁判所がその額を増減することは一切できない。"],"why":["誤り。平成29年改正後、解除に債務者の帰責事由は不要（541条・542条）。債権者に帰責事由があるときは解除できない（543条）。","誤り。不可抗力をもって抗弁とすることができない（419条3項）。","誤り。履行不能のときは履行を請求できない（412条の2第1項）。","正しい。415条1項ただし書。","誤り。改正で「裁判所はその額を増減することができない」との文言は削除された。公序良俗違反などにより制限され得る。"],"answer":3},{"id":"q09","area":"債権：効力・保全","topic":"詐害行為取消権","basis":["民法424条・424条の7・424条の9・425条・426条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"詐害行為取消権に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["詐害行為取消請求に係る訴えは、債務者が債権者を害することを知って行為をしたことを債権者が知った時から2年を経過したときは提起することができず、行為の時から10年を経過したときも同様である。","詐害行為取消請求に係る訴えは、受益者及び債務者を被告として提起しなければならない。","財産権を目的としない行為も、詐害行為取消請求の対象となる。","債権者は、受益者に対して金銭の支払を求める場合でも、自己に直接支払うよう求めることはできない。","詐害行為取消請求を認容する確定判決の効力は、債務者には及ばない。"],"why":["正しい。426条。","誤り。被告は受益者又は転得者（424条の7第1項）。債務者には訴訟告知をする（同条2項）。","誤り。財産権を目的としない行為は対象外（424条2項）。","誤り。自己に直接支払うよう求めることができる（424条の9）。","誤り。債務者及びその全ての債権者にも効力が及ぶ（425条）。"],"answer":0},{"id":"q10","area":"債権：多数当事者・譲渡","topic":"保証","basis":["民法446条・454条・457条・465条の2・465条の6"],"tip":"","kind":"mc","format":"妥当なもの","stem":"保証に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["連帯保証人は、催告の抗弁権及び検索の抗弁権を有する。","保証契約は、書面（又は電磁的記録）でしなければ、その効力を生じない。","個人根保証契約は、極度額を定めなくても効力を生ずる。","主たる債務者に対する履行の請求その他の事由による時効の完成猶予及び更新は、保証人に対しては効力を生じない。","事業のために負担した貸金等債務を主たる債務とする保証契約は、保証人が法人である場合でも、公正証書で保証意思を表示しなければ効力を生じない。"],"why":["誤り。連帯保証人には催告・検索の抗弁権がない（454条）。","正しい。446条2項・3項。","誤り。極度額を定めなければ効力を生じない（465条の2第2項）。","誤り。保証人に対しても効力を生ずる（457条1項）。","誤り。公正証書による保証意思宣明は個人保証の規律で、法人には適用されない（465条の6第3項）。"],"answer":1},{"id":"q11","area":"不法行為等","topic":"不当利得・事務管理","basis":["民法702条〜705条・708条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"事務管理および不当利得に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["善意の受益者は、その利益の存する限度において返還する義務を負う。","不法な原因のために給付をした者は、その給付したものの返還を請求することができない。","事務管理の管理者は、本人のために有益な費用を支出したときは、本人に対し、その償還を請求することができる。","悪意の受益者は、その受けた利益に利息を付して返還しなければならず、なお損害があるときはその賠償の責任を負う。","債務の弁済として給付をした者は、その時において債務の存在しないことを知っていたときでも、その給付したものの返還を請求することができる。"],"why":["正しい。703条。","正しい。708条本文。","正しい。702条1項。","正しい。704条。","誤り（これが正解）。非債弁済（705条）。債務の不存在を知って弁済した者は返還を請求できない。"],"answer":4},{"id":"q12","area":"相続","topic":"相続人と相続分","basis":["民法887条・889条・900条","最大決平25.9.4"],"tip":"","kind":"mc","format":"妥当なもの","stem":"相続人および相続分に関する次の記述のうち、民法の規定および判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["被相続人の子が相続の開始以前に死亡したときは、その者の子が代襲して相続人となるが、被相続人の直系卑属でない者はこの限りでない。","兄弟姉妹の子が相続開始以前に死亡した場合、その子（兄弟姉妹の孫）も再代襲して相続人となる。","嫡出でない子の相続分は、嫡出である子の相続分の2分の1である。","相続の放棄をした者の子は、放棄をした者を代襲して相続人となる。","配偶者と兄弟姉妹が相続人であるときは、配偶者の相続分は3分の2である。"],"why":["正しい。887条2項。","誤り。兄弟姉妹の代襲は子（甥・姪）までで、再代襲はない（889条2項）。","誤り。最大決平25.9.4の違憲判断を受けて規定は削除され、相続分は同等。","誤り。相続放棄は代襲原因ではない（887条2項）。","誤り。4分の3（900条3号）。"],"answer":0}]};
