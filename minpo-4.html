<script>window.SET = {"id":"minpo-4","code":"民法強化2","title":"民法 直前強化② 債権・契約・相続","lead":"債務不履行・債権者代位・詐害行為・保証・相続など、平成29年改正で条文が変わった頻出テーマを中心に確認します。改正前の知識で覚えている部分がないかもチェックしてください。","minutes":20,"questions":[{"id":"q01","area":"債権：効力・保全","topic":"履行遅滞・損害賠償","basis":["民法412条・412条の2・416条・419条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"債務不履行に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["特別の事情によって生じた損害は、債務者が契約締結時にその事情を現に予見していた場合に限り、賠償請求の対象となる。","債務の履行について不確定期限があるときは、債務者は、期限の到来した後に履行の請求を受けた時又は期限の到来したことを知った時のいずれか早い時から遅滞の責任を負う。","債務の履行について期限を定めなかったときは、債務者は、債務の成立した時から遅滞の責任を負う。","金銭債務の不履行による損害賠償については、債務者は、不可抗力をもって抗弁とすることができる。","契約に基づく債務の履行がその契約の成立の時に不能であったときは、その契約は無効であり、債権者は損害賠償を請求することができない。"],"why":["誤り。当事者がその事情を「予見すべきであった」ときに賠償請求できる（416条2項）。","正しい。412条2項。","誤り。履行の請求を受けた時から遅滞となる（412条3項）。","誤り。金銭債務では不可抗力を抗弁とすることができない（419条3項）。","誤り。原始的不能でも、履行不能によって生じた損害の賠償請求は妨げられない（412条の2第2項）。"],"answer":1},{"id":"q02","area":"債権：効力・保全","topic":"債権者代位権","basis":["民法423条〜423条の5"],"tip":"","kind":"mc","format":"妥当なもの","stem":"債権者代位権に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["債務者の一身に専属する権利であっても、債権の保全に必要であれば代位行使することができる。","債権者は、被代位権利の目的が可分であるときでも、自己の債権の額を超えて被代位権利を行使することができる。","債権者が被代位権利を行使した場合、債務者は、その権利について自ら取立てその他の処分をすることができなくなる。","債権者は、その債権の期限が到来しない間であっても、保存行為に限らず、被代位権利を行使することができる。","債権者は、被代位権利が金銭の支払を目的とするものであるときは、相手方に対し、その支払を自己に対してすることを求めることができる。"],"why":["誤り。一身専属権や差押えを禁じられた権利は代位行使できない（423条1項ただし書）。","誤り。自己の債権の額の限度でのみ行使できる（423条の2）。","誤り。債務者は取立てその他の処分をすることができ、相手方も債務者に履行できる（423条の5）。","誤り。期限到来前は保存行為しかできない（423条2項）。","正しい。423条の3。"],"answer":4},{"id":"q03","area":"債権：効力・保全","topic":"詐害行為取消権","basis":["民法424条・425条・426条","最判平12.3.9"],"tip":"","kind":"mc","format":"組合せ","stem":"詐害行為取消権に関する次の記述ア〜オのうち、民法の規定および判例に照らし、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","items":["詐害行為取消請求は裁判所に請求しなければならず、裁判外の意思表示によって行使することはできない。","離婚に伴う財産分与は、不相当に過大であって財産分与に仮託した財産処分と認められる特段の事情がある場合でも、詐害行為取消権の対象となることはない。","詐害行為取消請求を認容する確定判決は、債務者及びその全ての債権者に対しても効力を有する。","受益者が、その行為の時において債権者を害することを知らなかったときでも、債権者は詐害行為取消請求をすることができる。","詐害行為取消請求に係る訴えは、債務者が債権者を害することを知って行為をしたことを債権者が知った時から5年を経過したときは、提起することができない。"],"itemOk":[true,false,true,false,false],"itemWhy":["正しい。424条1項。","誤り。特段の事情があるときは、不相当に過大な部分について取消しの対象となる（最判平12.3.9）。","正しい。425条。","誤り。受益者が知らなかったときは取り消せない（424条1項ただし書）。","誤り。知った時から2年（行為の時から10年）（426条）。"],"options":["ア・ウ","ア・オ","イ・オ","ウ・オ","エ・オ"],"answer":0},{"id":"q04","area":"債権：多数当事者・譲渡","topic":"保証","basis":["民法446条・448条・454条・457条・465条の2"],"tip":"","kind":"mc","format":"妥当なもの","stem":"保証に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["保証契約は、書面又はその内容を記録した電磁的記録でしなければ、その効力を生じない。","保証人の負担が債務の目的又は態様において主たる債務より重いときでも、保証人は約定どおりの責任を負う。","連帯保証人も、債権者から請求を受けたときは、まず主たる債務者に催告をすべき旨を請求することができる。","個人が保証人となる根保証契約は、極度額を定めなくても効力を生ずる。","主たる債務者に対する履行の請求その他の事由による時効の完成猶予及び更新は、保証人に対しては効力を生じない。"],"why":["正しい。446条2項・3項。","誤り。主たる債務の限度に減縮される（448条1項）。","誤り。連帯保証人には催告の抗弁権・検索の抗弁権がない（454条）。","誤り。極度額を定めなければ効力を生じない（465条の2第2項）。","誤り。主たる債務者に対する時効の完成猶予・更新は、保証人にも効力を生ずる（457条1項）。"],"answer":0},{"id":"q05","area":"債権：多数当事者・譲渡","topic":"連帯債務（絶対効と相対効）","basis":["民法438条〜441条"],"tip":"改正後の絶対効は「弁済・相殺・更改・混同」の4つだけ。請求・免除・時効は相対効。","kind":"mc","format":"個数","stem":"連帯債務に関する次の記述ア〜オのうち、民法の規定に照らし、\u003cb>妥当なものはいくつ\u003c/b>あるか。","items":["連帯債務者の一人に対する履行の請求は、他の連帯債務者に対しても、その効力を生ずる。","連帯債務者の一人が債権者に対して債権を有する場合において、その連帯債務者が相殺を援用したときは、債権は全ての連帯債務者の利益のために消滅する。","連帯債務者の一人と債権者との間に混同があったときは、その連帯債務者は弁済をしたものとみなす。","連帯債務者の一人と債権者との間に更改があったときは、債権は全ての連帯債務者の利益のために消滅する。","連帯債務者の一人に対して債務の免除がされたときは、その連帯債務者の負担部分について、他の連帯債務者の利益のためにも効力を生ずる。"],"itemOk":[false,true,true,true,false],"itemWhy":["誤り。履行の請求は相対効（441条）。改正前は絶対効だった。","正しい。439条1項。","正しい。440条。","正しい。438条。","誤り。免除は相対効（441条）。改正前は負担部分について絶対効だった。"],"options":["一つ","二つ","三つ","四つ","五つ"],"answer":2},{"id":"q06","area":"債権：多数当事者・譲渡","topic":"債権譲渡","basis":["民法466条・466条の6・467条","最判昭49.3.7"],"tip":"","kind":"mc","format":"妥当なもの","stem":"債権譲渡に関する次の記述のうち、民法の規定および判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["譲渡制限の意思表示について善意だが重大な過失がある譲受人に対しても、債務者は履行を拒むことはできない。","債権譲渡は、確定日付のある証書によらない通知であっても、債務者以外の第三者に対抗することができる。","当事者が債権の譲渡を禁止し、又は制限する旨の意思表示をしたときであっても、債権の譲渡は、その効力を妨げられない。","債権が二重に譲渡され、いずれについても確定日付のある証書による通知がされた場合、譲受人相互間の優劣は、通知に付された確定日付の先後によって決まる。","将来発生する債権は、譲渡の時点で現に発生していないから、譲渡することができない。"],"why":["誤り。悪意又は重大な過失がある譲受人に対しては、履行を拒むことができる（466条3項）。","誤り。第三者に対抗するには確定日付のある証書による通知又は承諾が必要（467条2項）。","正しい。466条2項。","誤り。通知が債務者に到達した日時の先後で決まる（最判昭49.3.7）。","誤り。将来債権も譲渡できる（466条の6）。"],"answer":2},{"id":"q07","area":"債権：消滅","topic":"相殺","basis":["民法506条・508条・509条・511条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"相殺に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["人の生命又は身体の侵害による損害賠償債権を有する被害者は、その債権を自働債権として加害者に対する債務と相殺することはできない。","時効によって消滅した債権は、その消滅以前に相殺に適するようになっていた場合でも、相殺の自働債権とすることはできない。","差押えを受けた債権の第三債務者は、差押え後に取得した債権（差押え前の原因に基づかないもの）による相殺をもって差押債権者に対抗することができる。","悪意による不法行為に基づく損害賠償の債務の債務者は、相殺をもって債権者に対抗することができない。","相殺の意思表示には、条件又は期限を付することができる。"],"why":["誤り。禁止されるのは受働債権とする相殺（加害者側からの相殺）。被害者が自働債権として相殺することはできる。","誤り。消滅以前に相殺適状にあれば相殺できる（508条）。","誤り。差押え後に取得した債権による相殺は対抗できない（511条1項）。差押え前に取得した債権なら対抗できる。","正しい。509条1号（加害者からの相殺を禁止）。","誤り。相殺の意思表示には条件・期限を付けられない（506条1項後段）。"],"answer":3},{"id":"q08","area":"不法行為等","topic":"不当利得・事務管理","basis":["民法702条〜705条・708条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"不当利得および事務管理に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["不法な原因のために給付をした者は、その不法な原因が受益者についてのみ存したときであっても、返還を請求することができない。","事務管理者は、本人のために有益な費用を支出したときでも、本人に対してその償還を請求することはできない。","事務管理者は、本人に対し、事務管理をしたことについて相当の報酬を請求することができる。","善意の受益者は、不当利得の返還に当たり、受けた利益に利息を付して返還しなければならない。","債務の弁済として給付をした者は、その時において債務の存在しないことを知っていたときは、その給付したものの返還を請求することができない。"],"why":["誤り。不法な原因が受益者についてのみ存したときは返還を請求できる（708条ただし書）。","誤り。有益な費用は償還を請求できる（702条1項）。","誤り。事務管理者は原則として報酬を請求できない。","誤り。善意の受益者は「現存利益」の限度で返還すれば足りる（703条）。利息を付すのは悪意の受益者（704条）。","正しい。非債弁済（705条）。"],"answer":4},{"id":"q09","area":"契約","topic":"解除・危険負担","basis":["民法536条・541条・543条・545条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"契約の解除および危険負担に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["債務不履行を理由に契約を解除するには、債務者に帰責事由があることが必要である。","債務の不履行がその契約及び取引上の社会通念に照らして軽微であるときは、債権者は、催告をしても契約を解除することができない。","債務の不履行が債権者の責めに帰すべき事由によるものであるときでも、債権者は契約を解除することができる。","契約を解除した場合には、債権者は債務者に対して損害賠償を請求することができなくなる。","当事者双方の責めに帰することができない事由によって債務を履行することができなくなったときでも、債権者は反対給付の履行を拒むことができない。"],"why":["誤り。改正後は、解除に債務者の帰責事由は不要。","正しい。541条ただし書。","誤り。債権者の責めに帰すべき事由による不履行では解除できない（543条）。","誤り。解除しても損害賠償の請求は妨げられない（545条4項）。","誤り。債権者は反対給付の履行を拒むことができる（536条1項）。"],"answer":1},{"id":"q10","area":"契約","topic":"賃貸借（敷金・修繕・転貸）","basis":["民法607条の2・612条・621条・622条の2","最判昭28.9.25"],"tip":"","kind":"mc","format":"組合せ","stem":"賃貸借に関する次の記述ア〜オのうち、民法の規定および判例に照らし、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","items":["賃借人は、賃貸人に対し、敷金をその債務の弁済に充てることを請求することができる。","賃借人が無断で転貸した場合、賃貸人は、それが背信的行為と認めるに足りない特段の事情があるときでも、常に契約を解除することができる。","賃借人が賃貸人に修繕が必要である旨を通知したにもかかわらず、賃貸人が相当の期間内に必要な修繕をしないときは、賃借人はその修繕をすることができる。","賃貸人は、敷金を受け取っている場合において、賃貸借が終了し、かつ、賃貸物の返還を受けたときは、敷金の額から賃借人の金銭債務の額を控除した残額を返還しなければならない。","賃借人は、通常の使用及び収益によって生じた損耗や経年変化も含めて、原状に復する義務を負う。"],"itemOk":[false,false,true,true,false],"itemWhy":["誤り。賃借人から敷金の充当を請求することはできない（622条の2第2項後段）。","誤り。背信的行為と認めるに足りない特段の事情があるときは解除できない（最判昭28.9.25）。","正しい。607条の2第1号。","正しい。622条の2第1項1号。","誤り。通常損耗・経年変化は原状回復義務の対象外（621条）。"],"options":["ア・ウ","ア・エ","イ・ウ","ウ・エ","ウ・オ"],"answer":3},{"id":"q11","area":"相続","topic":"相続人と相続分","basis":["民法887条・889条・892条・900条"],"tip":"配偶者の相続分：子と→1/2、直系尊属と→2/3、兄弟姉妹と→3/4。","kind":"mc","format":"妥当なもの","stem":"相続人および相続分に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["兄弟姉妹が相続人となる場合、その兄弟姉妹の子だけでなく孫も代襲相続をすることができる。","被相続人の子が相続の放棄をした場合には、その者の子が代襲して相続人となることはできない。","父母の一方のみを同じくする兄弟姉妹（半血兄弟姉妹）の相続分は、父母の双方を同じくする兄弟姉妹の相続分と等しい。","被相続人に子がなく、配偶者と兄弟姉妹が相続人となる場合、配偶者の相続分は3分の2である。","相続人の廃除は、全ての推定相続人について、被相続人が家庭裁判所に請求することができる。"],"why":["誤り。兄弟姉妹の代襲は子（甥・姪）まで。再代襲はない（889条2項は887条3項を準用していない）。","正しい。代襲原因は死亡・欠格・廃除で、放棄は含まれない（887条2項）。","誤り。半血兄弟姉妹の相続分は全血兄弟姉妹の2分の1（900条4号ただし書）。","誤り。配偶者と兄弟姉妹では、配偶者が4分の3（900条3号）。3分の2は配偶者と直系尊属の場合。","誤り。廃除の対象は遺留分を有する推定相続人に限られる（892条）。"],"answer":1},{"id":"q12","area":"相続","topic":"遺留分","basis":["民法1042条・1046条・1048条・1049条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"遺留分に関する次の記述のうち、民法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["被相続人の兄弟姉妹にも遺留分が認められる。","遺留分侵害額請求権は、相続の開始及び遺留分を侵害する贈与又は遺贈があったことを知った時から3年間行使しないときは、時効によって消滅する。","共同相続人の一人のした遺留分の放棄は、他の各共同相続人の遺留分を増加させる。","遺留分権利者は、受遺者又は受贈者に対し、遺留分侵害額に相当する金銭の支払を請求することができる。","相続の開始前における遺留分の放棄は、家庭裁判所の許可がなくても自由にすることができる。"],"why":["誤り。兄弟姉妹には遺留分がない（1042条1項）。","誤り。知った時から1年（相続開始の時から10年）（1048条）。","誤り。他の共同相続人の遺留分に影響を及ぼさない（1049条2項）。","正しい。1046条1項（金銭債権化）。","誤り。相続開始前の放棄は家庭裁判所の許可が必要（1049条1項）。"],"answer":3}]};
