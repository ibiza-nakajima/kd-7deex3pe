<script>window.SET = {"id":"gyosei-6","code":"行政法強化3","title":"行政法 直前強化③ 地方自治法","lead":"前回4割程度だった「議会・長」「直接請求」「住民監査請求・住民訴訟」「国の関与」を、数字（○分の1、○日以内）と提出先を中心に確認します。","minutes":15,"questions":[{"id":"q01","area":"地自：住民の権利","topic":"直接請求（要件と請求先）","basis":["地方自治法74条〜76条・81条・83条"],"tip":"50分の1＝条例（長へ）・監査（監査委員へ）。3分の1＝解散・解職（選挙管理委員会へ）。","kind":"mc","format":"妥当なもの","stem":"直接請求に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["事務の監査の請求は、選挙権を有する者の総数の50分の1以上の者の連署をもって、長に対して行う。","議会の解散の請求は、選挙権を有する者の総数の50分の1以上の者の連署をもって、議長に対して行う。","条例の制定改廃の請求があったときは、長は、請求を受理した日から60日以内に住民投票に付さなければならない。","長の解職の請求は、選挙権を有する者の総数の3分の1以上の者の連署をもって議会に対して行い、議会の過半数の同意により解職が成立する。","選挙権を有する者は、その総数の50分の1以上の者の連署をもって、その代表者から、長に対し、条例の制定又は改廃を請求することができるが、地方税の賦課徴収等に関する条例は請求の対象とならない。"],"why":["誤り。事務の監査請求の請求先は「監査委員」（75条1項）。","誤り。議会の解散請求は、原則3分の1以上の連署で「選挙管理委員会」に対して行う（76条1項）。","誤り。長は、受理した日から20日以内に議会を招集し、意見を付けて付議する（74条3項）。住民投票ではない。","誤り。長の解職請求は「選挙管理委員会」に行い、住民投票で過半数の同意があれば失職する（81条・83条）。","正しい。74条1項。地方税の賦課徴収、分担金・使用料・手数料の徴収に関するものは除かれる。"],"answer":4},{"id":"q02","area":"地自：住民の権利","topic":"住民監査請求","basis":["地方自治法242条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"住民監査請求に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["住民監査請求の対象は、長や職員の違法な財務会計上の行為に限られ、不当な行為は対象とならない。","住民監査請求は、当該普通地方公共団体の住民であれば1人でもすることができ、法人や選挙権を有しない者でもすることができる。","住民監査請求は、正当な理由があるときでも、当該行為のあった日又は終わった日から1年を経過したときはすることができない。","監査委員は、住民監査請求があった日から90日以内に監査及び勧告を行わなければならない。","住民監査請求をするには、選挙権を有する者の総数の50分の1以上の者の連署が必要である。"],"why":["誤り。違法だけでなく「不当」な行為も対象（242条1項）。不当を争えないのは住民訴訟。","正しい。242条1項。事務監査請求（直接請求）との大きな違い。","誤り。正当な理由があるときは1年経過後でもできる（242条2項ただし書）。","誤り。60日以内（242条6項）。","誤り。連署は不要。1人でもできる。"],"answer":1},{"id":"q03","area":"地自：住民の権利","topic":"住民訴訟","basis":["地方自治法242条の2"],"tip":"","kind":"mc","format":"個数","stem":"住民訴訟に関する次の記述ア〜オのうち、地方自治法の規定に照らし、\u003cb>妥当なものはいくつ\u003c/b>あるか。","items":["住民訴訟を提起するには、住民監査請求を経ていなければならない。","住民訴訟では、財務会計上の行為の違法だけでなく、不当であることを理由として請求することもできる。","監査委員の監査の結果に不服がある場合、住民訴訟は、監査の結果の通知があった日から30日以内に提起しなければならない。","住民訴訟では、執行機関又は職員に対し、当該職員又は相手方に損害賠償等の請求をすることを求める請求をすることができる。","住民訴訟は、当該普通地方公共団体の事務所の所在地を管轄する高等裁判所の管轄に専属する。"],"itemOk":[true,false,true,true,false],"itemWhy":["正しい。監査請求前置（242条の2第1項）。","誤り。住民訴訟で争えるのは「違法」な行為のみ。","正しい。242条の2第2項1号。","正しい。いわゆる4号請求（242条の2第1項4号）。","誤り。地方裁判所の管轄に専属する（242条の2第5項）。"],"options":["一つ","二つ","三つ","四つ","五つ"],"answer":2},{"id":"q04","area":"地自：議会・執行機関","topic":"議会の招集・会期","basis":["地方自治法101条・102条・102条の2"],"tip":"","kind":"mc","format":"妥当なもの","stem":"普通地方公共団体の議会の招集に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["定例会は、毎年4回招集しなければならない。","普通地方公共団体の議会は、議長がこれを招集する。","議長が臨時会の招集を請求した場合において、長が法定の期間内に招集しないときであっても、議長が自ら臨時会を招集することはできない。","議員の定数の4分の1以上の者は、長に対し、付議すべき事件を示して臨時会の招集を請求することができ、長は、請求のあった日から20日以内に臨時会を招集しなければならない。","普通地方公共団体の議会は、条例で定めても、会期を通年とすることはできない。"],"why":["誤り。定例会の回数は条例で定める（102条2項）。","誤り。議会は「長」が招集する（101条1項）。","誤り。長が招集しないときは、議長が臨時会を招集することができる（101条5項）。","正しい。101条3項・4項。","誤り。条例で定めるところにより通年の会期とすることができる（102条の2）。"],"answer":3},{"id":"q05","area":"地自：議会・執行機関","topic":"長と議会の関係","basis":["地方自治法176条・178条・179条"],"tip":"不信任は「3分の2出席・4分の3同意」→10日以内に解散可。解散後の議会での再不信任は「3分の2出席・過半数」。","kind":"mc","format":"組合せ","stem":"長と議会の関係に関する次の記述ア〜オのうち、地方自治法の規定に照らし、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","items":["長は、議会の議決に異議があるときは、原則としてその議決の日（条例の制定改廃又は予算に関する議決については送付を受けた日）から10日以内に、理由を示して再議に付することができる。","条例の制定改廃又は予算に関する議決について再議に付された場合、議会が出席議員の3分の2以上の同意により再び同じ議決をしたときは、その議決は確定する。","議会が長の不信任の議決をするには、議員数の過半数の者が出席し、その過半数の者の同意がなければならない。","長は、不信任の議決の通知を受けた日から30日以内に議会を解散することができる。","長が専決処分をした場合に、議会がこれを承認しなかったときは、当該専決処分はさかのぼって効力を失う。"],"itemOk":[true,true,false,false,false],"itemWhy":["正しい。176条1項（一般的拒否権）。","正しい。176条3項。","誤り。議員数の3分の2以上が出席し、その4分の3以上の同意が必要（178条3項）。","誤り。通知を受けた日から10日以内（178条1項）。解散しないときは期間満了の日に失職する（178条2項）。","誤り。不承認でも専決処分の効力には影響しない。条例・予算の場合は長が必要な措置を講じて報告する（179条4項）。"],"options":["ア・イ","ア・ウ","ア・エ","イ・エ","ウ・エ"],"answer":0},{"id":"q06","area":"地自：議会・執行機関","topic":"議員の地位・懲罰","basis":["地方自治法92条・112条・127条・135条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"普通地方公共団体の議会の議員に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["議会は、議員の資格に関する決定をするときは、出席議員の3分の2以上の多数によらなければならない。","議員は、議員の定数の12分の1以上の者の賛成により、議会の議決すべき事件（予算を除く）につき、議会に議案を提出することができる。","普通地方公共団体の議会の議員は、地方公共団体の常勤の職員と兼ねることができない。","普通地方公共団体の議会の議員は、衆議院議員又は参議院議員と兼ねることができない。","議会が議員を除名するには、出席議員の過半数の同意があれば足りる。"],"why":["正しい。127条1項。","正しい。112条1項・2項。","正しい。92条2項。","正しい。92条1項。","誤り（これが正解）。除名は、議員の3分の2以上の出席、その4分の3以上の同意が必要（135条3項）。"],"answer":4},{"id":"q07","area":"地自：施設・関与・財務","topic":"国の関与","basis":["地方自治法245条の2・245条の5・245条の7・245条の8・250条の13・251条の5"],"tip":"","kind":"mc","format":"妥当なもの","stem":"国又は都道府県の関与に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["国地方係争処理委員会の勧告に不服がある場合、普通地方公共団体の長は、最高裁判所に直接訴えを提起することができる。","代執行は、自治事務についても法定受託事務についても認められる関与の類型である。","国の関与に不服がある普通地方公共団体の長は、国地方係争処理委員会への審査の申出を経ることなく、直ちに地方裁判所に関与の取消しを求める訴えを提起できる。","普通地方公共団体は、その事務の処理に関し、法律又はこれに基づく政令によらなければ、国又は都道府県の関与を受け、又は要することとされることはない。","各大臣は、都道府県の自治事務の処理が法令の規定に違反していると認めるときは、当該都道府県に対し、是正の指示をすることができる。"],"why":["誤り。訴えは高等裁判所に提起する（251条の5）。","誤り。代執行は法定受託事務についてのみ認められる（245条の8）。","誤り。まず国地方係争処理委員会に審査の申出をし（250条の13）、その後に高等裁判所に訴えを提起する（251条の5）。","正しい。関与の法定主義（245条の2）。","誤り。自治事務に対しては「是正の要求」（245条の5）。「是正の指示」は法定受託事務に対するもの（245条の7）。"],"answer":3},{"id":"q08","area":"地自：施設・関与・財務","topic":"公の施設・指定管理者","basis":["地方自治法244条・244条の2・244条の4"],"tip":"","kind":"mc","format":"妥当なもの","stem":"公の施設に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["指定管理者がした公の施設を利用する権利に関する処分についての審査請求は、当該指定管理者に対してしなければならない。","普通地方公共団体は、指定管理者の指定をしようとするときは、あらかじめ、議会の議決を経なければならない。","公の施設の設置及び管理に関する事項は、長の定める規則で定めなければならない。","指定管理者に、公の施設の利用に係る料金を当該指定管理者の収入として収受させることはできない。","普通地方公共団体は、住民が公の施設を利用することについて、正当な理由がある場合でもこれを拒むことはできない。"],"why":["誤り。普通地方公共団体の長に対してする（244条の4第1項）。","正しい。244条の2第6項。","誤り。条例で定める（244条の2第1項）。","誤り。利用料金を指定管理者の収入として収受させることができる（244条の2第8項）。","誤り。「正当な理由がない限り」拒んではならない（244条2項）。正当な理由があれば拒める。"],"answer":1},{"id":"q09","area":"地自：組織・条例","topic":"事務の種類と条例","basis":["地方自治法2条8項・9項・16項・17項・14条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"普通地方公共団体の事務と条例に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["自治事務については、議会の調査権や監査委員の監査の対象とならない。","法定受託事務とは、国が本来果たすべき役割に係る事務のうち、法令によって国の機関が処理することとされた事務をいう。","普通地方公共団体は、法令に違反しない限りにおいて、自治事務だけでなく法定受託事務についても条例を制定することができる。","市町村がその区域を包括する都道府県の条例に違反して事務を処理した場合でも、その行為は有効である。","普通地方公共団体は、義務を課し、又は権利を制限するには、法令に特別の定めがある場合を除くほか、長の定める規則によらなければならない。"],"why":["誤り。自治事務も議会の調査権・監査委員の監査の対象となる（法定受託事務も原則対象）。","誤り。法定受託事務は、国が本来果たすべき役割に係る事務で、法令により「都道府県・市町村又は特別区が処理する」こととされたもの（2条9項1号）。","正しい。14条1項は2条2項の事務（自治事務・法定受託事務の両方）について条例制定を認める。","誤り。都道府県の条例に違反して行った行為は無効（2条16項・17項）。","誤り。義務を課し権利を制限するには「条例」による（14条2項）。"],"answer":2},{"id":"q10","area":"地自：議会・執行機関","topic":"執行機関（委員会・委員）","basis":["地方自治法138条の4・180条の5"],"tip":"","kind":"mc","format":"妥当なもの","stem":"普通地方公共団体の執行機関に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["教育委員会、選挙管理委員会及び監査委員は、都道府県にも市町村にも置かなければならない執行機関である。","公安委員会は、市町村にも置かなければならない。","農業委員会は、都道府県に置かなければならない。","附属機関（審査会・審議会など）は、法律の定めがなければ設置することができず、条例で設置することはできない。","普通地方公共団体は、条例で定めれば、法律に定めのない執行機関としての委員会を自由に設置することができる。"],"why":["正しい。180条の5第1項（人事委員会又は公平委員会も同様）。","誤り。公安委員会は都道府県のみ（180条の5第2項）。","誤り。農業委員会は市町村に置く（180条の5第3項）。","誤り。附属機関は、法律又は条例の定めるところにより置くことができる（138条の4第3項）。","誤り。執行機関としての委員会・委員は、法律の定めるところにより置く（138条の4第1項）。"],"answer":0}]};
