<script>window.SET = {"id":"gyosei-4","code":"行政法強化1","title":"行政法 直前強化① 行政手続法・行政不服審査法","lead":"正答率が低かった「行手法：処分」と「行審法：審理・裁決」を、条文の言い回しの違い（義務か努力義務か、誰に・いつまでに）に絞って確認します。1問2分を目安に、5つの肢すべてに○×をつけてから確定してください。","minutes":25,"questions":[{"id":"q01","area":"行手法：総則・処分","topic":"適用除外（地方公共団体）","basis":["行政手続法3条3項・4条1項・46条"],"tip":"地方公共団体：処分・届出は「条例・規則が根拠」なら除外、行政指導と命令等は「全部」除外。","kind":"mc","format":"妥当なもの","stem":"行政手続法の適用除外に関する次の記述のうち、行政手続法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["地方公共団体の機関がする処分については、その根拠が条例であっても、行政手続法の処分に関する規定が適用される。","地方公共団体の機関がする処分は、その根拠が法律であっても、行政手続法の処分に関する規定は一切適用されない。","地方公共団体が条例や規則を定める行為には、行政手続法の意見公募手続の規定が適用される。","国の機関に対する処分は、その機関が一般私人と同じ立場で名あて人となる場合であっても、すべて行政手続法の適用が除外される。","地方公共団体の機関がする行政指導については、その根拠が法律であるか条例であるかを問わず、行政手続法の行政指導に関する規定は適用されない。"],"why":["誤り。条例・規則に根拠がある処分は適用除外（3条3項）。","誤り。法律に根拠がある処分には行政手続法が適用される。適用除外は条例・規則に根拠がある処分。","誤り。地方公共団体の命令等を定める行為は適用除外（3条3項）。地方公共団体は、法の趣旨にのっとり必要な措置を講ずるよう努めるにとどまる（46条）。","誤り。適用除外は、国の機関等が「固有の資格」において名あて人となる処分に限られる（4条1項）。","正しい。地方公共団体の機関がする行政指導は、根拠を問わず全部適用除外（3条3項）。"],"answer":4},{"id":"q02","area":"行手法：総則・処分","topic":"審査基準・標準処理期間","basis":["行政手続法2条8号・5条・6条・39条1項"],"tip":"義務＝審査基準の設定・公表、標準処理期間の公表。努力義務＝標準処理期間の設定、処分基準の設定・公表。","kind":"mc","format":"妥当なもの","stem":"審査基準および標準処理期間に関する次の記述のうち、行政手続法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["審査基準は行政手続法上の「命令等」に当たらないから、これを定める際に意見公募手続をとる必要はない。","行政庁は、標準処理期間を必ず定めなければならず、定めた期間を経過したときは、申請は許可されたものとみなされる。","行政庁は、審査基準を定めるに当たっては、許認可等の性質に照らしてできる限り具体的なものとしなければならず、行政上特別の支障があるときを除き、これを公にしておかなければならない。","行政庁は、審査基準を定めるよう努めなければならないが、定めるか否かは行政庁の裁量に委ねられている。","行政庁は、標準処理期間を定めた場合でも、これを公にしておく必要はない。"],"why":["誤り。審査基準は「命令等」に含まれ（2条8号ロ）、意見公募手続の対象となる（39条1項）。","誤り。標準処理期間の設定は努力義務（6条）。経過しても許可とみなす制度はない。","正しい。審査基準の設定・公表は法的義務（5条1項〜3項）。","誤り。審査基準の設定は「定めるものとする」で義務（5条1項）。努力義務なのは処分基準（12条）。","誤り。定めたときは、公にしておかなければならない（6条）。"],"answer":2},{"id":"q03","area":"行手法：総則・処分","topic":"申請に対する処分の手続","basis":["行政手続法7条〜10条"],"tip":"","kind":"mc","format":"組合せ","stem":"申請に対する処分に関する次の記述ア〜オのうち、行政手続法の規定に照らし、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","items":["行政庁は、申請がその事務所に到達したときは遅滞なく審査を開始しなければならず、形式上の要件に適合しない申請については、速やかに補正を求めるか、許認可等を拒否しなければならない。","申請を拒否する処分をする場合には、申請者の求めがあったときに限り、その理由を示せば足りる。","行政庁は、申請者の求めに応じ、申請に係る審査の進行状況及び処分の時期の見通しを示すよう努めなければならない。","申請者以外の者の利害を考慮すべきことが許認可等の要件とされている場合には、行政庁は、必ず公聴会を開催しなければならない。","拒否処分を書面でする場合であっても、その理由は口頭で示せば足りる。"],"itemOk":[true,false,true,false,false],"itemWhy":["正しい。7条。到達したら遅滞なく審査開始、不備は補正を求めるか拒否。受理・不受理という扱いはしない。","誤り。拒否処分は「同時に」理由を示すのが原則（8条1項本文）。求めがあったときに示せば足りるのは、基準が数量的指標等で明確な場合の例外（同項ただし書）。","正しい。9条1項（努力義務）。","誤り。公聴会の開催などは「努めなければならない」努力義務（10条）。","誤り。処分を書面でするときは、理由も書面で示さなければならない（8条2項）。"],"options":["ア・イ","ア・ウ","ア・エ","ア・オ","イ・オ"],"answer":1},{"id":"q04","area":"行手法：総則・処分","topic":"不利益処分（基準・手続の区別）","basis":["行政手続法12条・13条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"不利益処分に関する次の記述のうち、行政手続法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["許認可等を取り消す不利益処分をしようとするときは、原則として聴聞を行わなければならない。","聴聞を要する場合以外の不利益処分をしようとするときは、原則として弁明の機会を付与しなければならない。","行政庁は、処分基準を定めなければならず、これを定めたときは必ず公にしておかなければならない。","名あて人の資格又は地位を直接にはく奪する不利益処分をしようとするときは、原則として聴聞を行わなければならない。","公益上、緊急に不利益処分をする必要があるため意見陳述のための手続をとることができないときは、聴聞や弁明の機会の付与を行わなくてもよい。"],"why":["正しい。13条1項1号イ。","正しい。13条1項2号。","誤り（これが正解）。処分基準の設定も公表も「努めなければならない」努力義務（12条1項）。","正しい。13条1項1号ロ。","正しい。13条2項1号。"],"answer":2},{"id":"q05","area":"行手法：総則・処分","topic":"聴聞の手続","basis":["行政手続法18条〜20条・26条・27条"],"tip":"","kind":"mc","format":"個数","stem":"聴聞に関する次の記述ア〜オのうち、行政手続法の規定に照らし、\u003cb>妥当なものはいくつ\u003c/b>あるか。","items":["聴聞は、行政庁が指名する職員その他政令で定める者が主宰するが、当該聴聞の当事者や参加人は主宰者となることができない。","当事者は、聴聞の通知があった時から聴聞が終結する時までの間、行政庁に対し、当該不利益処分の原因となる事実を証する資料等の閲覧を求めることができる。","聴聞の期日における審理は、原則として公開して行われる。","行政庁は、不利益処分の決定をするときは、主宰者が作成した報告書に記載された主宰者の意見を十分に参酌してこれをしなければならない。","行政庁が聴聞の節の規定に基づいてした処分（例えば、資料の閲覧の拒否）については、審査請求をすることができない。"],"itemOk":[true,true,false,true,true],"itemWhy":["正しい。19条1項・2項。","正しい。18条1項。第三者の利益を害するおそれがあるときその他正当な理由があるときは拒否できる。","誤り。行政庁が公開することを相当と認めるときを除き、公開しない（20条6項）。","正しい。26条。","正しい。27条。聴聞の手続の中でされた処分等は、審査請求の対象にならない。"],"options":["一つ","二つ","三つ","四つ","五つ"],"answer":3},{"id":"q06","area":"行手法：総則・処分","topic":"弁明の機会の付与","basis":["行政手続法29条〜31条"],"tip":"聴聞と弁明の違い：主宰者・資料閲覧・参加人は聴聞だけ。代理人は両方OK。","kind":"mc","format":"妥当なもの","stem":"弁明の機会の付与に関する次の記述のうち、行政手続法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["弁明は、行政庁が口頭ですることを認めたときを除き、弁明を記載した書面を提出してするものとされている。","弁明の機会の付与は、行政庁が指名した主宰者が主宰する口頭審理の方式で行われる。","弁明の機会の付与の通知は、口頭で行えば足りる。","弁明の機会の付与においても、当事者は、聴聞と同様に、不利益処分の原因となる事実を証する資料の閲覧を求めることができる。","弁明の機会の付与では、当事者は代理人を選任することができない。"],"why":["正しい。29条1項（書面審理が原則）。","誤り。主宰者・口頭審理は聴聞の仕組み。弁明は原則として書面。","誤り。書面で通知しなければならない（30条）。","誤り。資料の閲覧（18条）は、弁明の機会の付与には準用されていない（31条）。","誤り。代理人の規定（16条）は準用される（31条）。"],"answer":0},{"id":"q07","area":"行手法：総則・処分","topic":"理由の提示（判例）","basis":["最判平23.6.7","最判昭60.1.22","行政手続法14条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"処分の理由の提示に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["不利益処分をする場合において、理由を示さないで処分をすべき差し迫った必要があるときは、その後も理由を示す必要はない。","一級建築士免許取消処分について、処分基準が公にされている場合には、根拠法条や原因事実を示すだけでなく、処分基準の適用関係まで示さなければ、理由の提示として不十分であるとした判例がある。","旅券発給拒否処分の通知書に根拠規定を示すだけで、どのような事実関係に基づいて適用したかを示さなくても、理由付記として十分であるとした判例がある。","理由の提示に不備がある処分であっても、処分の内容自体が適法であれば、当該処分が取り消されることはない。","処分の相手方が処分の理由を推知できる場合には、理由の提示を省略しても違法とならないとするのが判例である。"],"why":["誤り。差し迫った必要がある場合でも、処分後相当の期間内に理由を示さなければならない（14条1項ただし書・2項）。","正しい。最判平23.6.7。","誤り。最判昭60.1.22は、根拠規定を示すだけでは理由付記として不十分とした。","誤り。理由の提示の不備は、それだけで処分の取消事由となる。","誤り。相手方が理由を知り得たかどうかは、理由付記の要否を左右しないとされている。"],"answer":1},{"id":"q08","area":"行審法：要件・教示","topic":"審査請求をすべき行政庁","basis":["行政不服審査法4条・5条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"審査請求をすべき行政庁に関する次の記述のうち、行政不服審査法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["処分庁が外局の長である場合には、その外局が置かれている省の大臣に対して審査請求をする。","処分庁が主任の大臣である場合には、内閣総理大臣に対して審査請求をする。","処分庁に上級行政庁がある場合には、審査請求人は、処分庁と上級行政庁のどちらに審査請求をするかを自由に選ぶことができる。","法律に再調査の請求ができる旨の定めがある場合には、必ず再調査の請求を経た後でなければ審査請求をすることができない。","処分庁に上級行政庁がない場合には、当該処分庁に対して審査請求をする。"],"why":["誤り。処分庁が外局の長（庁の長官など）のときは、その外局の長に審査請求する（4条1号）。","誤り。処分庁が主任の大臣のときは、その主任の大臣に審査請求する（4条1号）。","誤り。原則として最上級行政庁に審査請求する（4条4号）。選択はできない。","誤り。再調査の請求と審査請求は選択できる（5条1項）。再調査の請求をしたときは、原則としてその決定を経た後に審査請求する（5条2項）。","正しい。4条1号。"],"answer":4},{"id":"q09","area":"行審法：要件・教示","topic":"審査請求期間","basis":["行政不服審査法18条"],"tip":"「知った日の翌日から3月／処分の日の翌日から1年／再調査決定後は1月」。行訴法の「6か月・1年」と混同しない。","kind":"mc","format":"妥当なもの","stem":"審査請求期間に関する次の記述のうち、行政不服審査法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["処分についての審査請求は、処分があったことを知らなければ、処分があった日から何年経過してもすることができる。","再調査の請求をした場合の審査請求期間は、再調査の請求についての決定があったことを知った日の翌日から起算して3月である。","審査請求期間を経過した後にされた審査請求は、正当な理由があっても却下される。","処分についての審査請求は、正当な理由があるときを除き、処分があったことを知った日の翌日から起算して3月を経過したときはすることができない。","不作為についての審査請求は、申請をした日の翌日から起算して3月以内にしなければならない。"],"why":["誤り。処分の日の翌日から起算して1年を経過したときも、正当な理由がない限りできない（18条2項）。","誤り。決定があったことを知った日の翌日から起算して1月（18条1項かっこ書）。","誤り。正当な理由があるときは、期間経過後でもできる（18条1項ただし書・2項ただし書）。","正しい。18条1項。","誤り。不作為についての審査請求には期間制限がない（不作為が続く限りできる）。"],"answer":3},{"id":"q10","area":"行審法：審理・裁決","topic":"審理員","basis":["行政不服審査法9条・17条・42条"],"tip":"","kind":"mc","format":"組合せ","stem":"審理員に関する次の記述ア〜オのうち、行政不服審査法の規定に照らし、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","items":["審査庁は、審査庁に所属する職員のうちから審理手続を行う者（審理員）を指名し、その旨を審査請求人及び処分庁等に通知しなければならない。","審査請求に係る処分に関与した者は、審理員となることができない。","審査庁が国家行政組織法3条2項に規定する委員会である場合であっても、審理員を指名しなければならない。","審理員は、審理手続を終結したときは、遅滞なく審理員意見書を作成し、速やかに審査請求人に提出しなければならない。","審査庁となるべき行政庁は、審理員となるべき者の名簿を必ず作成しなければならない。"],"itemOk":[true,true,false,false,false],"itemWhy":["正しい。9条1項。","正しい。9条2項1号（除斥事由）。","誤り。委員会など合議制の機関が審査庁となる場合は、審理員の指名は不要（9条1項ただし書・1号）。","誤り。審理員意見書は「審査庁」に提出する（42条2項）。","誤り。名簿の作成は努力義務。作成したときは公にしておかなければならない（17条）。"],"options":["ア・イ","ア・ウ","ア・エ","イ・オ","ウ・エ"],"answer":0},{"id":"q11","area":"行審法：審理・裁決","topic":"審理手続","basis":["行政不服審査法31条・33条・34条・38条・41条"],"tip":"","kind":"mc","format":"個数","stem":"審査請求の審理手続に関する次の記述ア〜オのうち、行政不服審査法の規定に照らし、\u003cb>妥当なものはいくつ\u003c/b>あるか。","items":["審査請求人から申立てがあったときは、審理員は、原則として、申立人に口頭で意見を述べる機会を与えなければならない。","口頭意見陳述において、申立人は、審理員の許可を得て、処分庁等に対して質問を発することができる。","審査請求人は、審理員に対し、提出書類等の閲覧又は写しの交付を求めることができ、審理員は、第三者の利益を害するおそれがあるときその他正当な理由があるときでなければ、これを拒むことができない。","審理員は、審査請求人の申立てがなければ、物件の提出要求や参考人の陳述を求めることはできない。","審理員は、必要な審理を終えたと認めるときは、審理手続を終結する。"],"itemOk":[true,true,true,false,true],"itemWhy":["正しい。31条1項。","正しい。31条5項。","正しい。38条1項。","誤り。物件の提出要求（33条）や参考人の陳述（34条）は、申立てによるほか職権でもできる。","正しい。41条1項。"],"options":["一つ","二つ","三つ","四つ","五つ"],"answer":3},{"id":"q12","area":"行審法：審理・裁決","topic":"行政不服審査会への諮問","basis":["行政不服審査法43条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"行政不服審査会等への諮問に関する次の記述のうち、行政不服審査法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["審査庁が主任の大臣である場合において、審理員意見書の提出を受けたときは、原則として、行政不服審査会に諮問しなければならない。","審査請求に係る処分が、法令に基づき審議会等の議を経てされたものである場合には、諮問は不要である。","審査請求人が諮問を希望しない旨を申し出た場合には、参加人から諮問を希望しない旨の申出に反対する申出があっても、諮問は不要となる。","審査請求が不適法であり、却下する場合には、諮問は不要である。","審査請求の全部を認容する場合には、原則として諮問は不要である。"],"why":["正しい。43条1項。地方公共団体では、条例で置く機関に諮問する（81条）。","正しい。43条1項1号。","誤り（これが正解）。参加人から反対の申出がされているときは、諮問を省略できない（43条1項4号かっこ書）。","正しい。43条1項6号。","正しい。43条1項7号・8号（反対の意見書等が出ている場合を除く）。"],"answer":2},{"id":"q13","area":"行審法：審理・裁決","topic":"裁決の種類","basis":["行政不服審査法45条・46条・48条・50条"],"tip":"却下＝門前払い（要件を欠く）、棄却＝中身を見て理由なし、認容＝理由あり。","kind":"mc","format":"妥当なもの","stem":"審査請求に対する裁決に関する次の記述のうち、行政不服審査法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["処分についての審査請求に理由がある場合でも、処分を取り消すことにより公の利益に著しい障害を生ずるときは、審査庁は審査請求を棄却することができ、その場合には裁決の主文で当該処分が違法又は不当であることを宣言しなければならない。","処分庁の上級行政庁でも処分庁でもない審査庁は、審査請求に理由があるときは、処分を取り消すだけでなく、処分を変更することもできる。","審査庁は、審査請求人の不利益に処分を変更することができる。","審査請求が法定の期間経過後にされたものであるときは、審査庁は、裁決で審査請求を棄却する。","裁決は口頭ですることができ、その場合には理由を付す必要はない。"],"why":["正しい。事情裁決（45条3項）。","誤り。処分の変更ができるのは、審査庁が処分庁の上級行政庁又は処分庁である場合に限られる（46条1項ただし書）。","誤り。不利益変更の禁止（48条）。","誤り。不適法な審査請求は「却下」（45条1項）。棄却は理由がない場合。","誤り。裁決は書面で行い、理由を記載しなければならない（50条1項）。"],"answer":0},{"id":"q14","area":"行審法：審理・裁決","topic":"執行停止","basis":["行政不服審査法25条・40条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"審査請求における執行停止に関する次の記述のうち、行政不服審査法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["審理員は、必要があると認めるときは、自ら執行停止の決定をすることができる。","審査請求がされると、処分の効力、処分の執行又は手続の続行は当然に停止される。","処分庁の上級行政庁又は処分庁のいずれでもない審査庁も、職権で執行停止をすることができる。","重大な損害を避けるため緊急の必要がある場合には、公共の福祉に重大な影響を及ぼすおそれがあるときであっても、審査庁は執行停止をしなければならない。","処分庁の上級行政庁又は処分庁である審査庁は、必要があると認める場合には、審査請求人の申立てにより又は職権で、処分の効力、処分の執行又は手続の続行の全部又は一部の停止その他の措置をとることができる。"],"why":["誤り。審理員は、執行停止をすべき旨の意見書を審査庁に提出できるだけ（40条）。","誤り。執行不停止が原則（25条1項）。","誤り。その他の審査庁は、申立てがあった場合に限り、処分庁の意見を聴いたうえで執行停止ができる（25条3項）。職権ではできず、「その他の措置」もできない。","誤り。公共の福祉に重大な影響を及ぼすおそれがあるときなどは、義務的執行停止の対象外（25条4項ただし書）。","正しい。25条2項。"],"answer":4},{"id":"q15","area":"行審法：要件・教示","topic":"教示","basis":["行政不服審査法22条・82条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"不服申立てに関する教示に関する次の記述のうち、行政不服審査法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["利害関係人から書面による教示を求められたときは、当該教示は書面でしなければならない。","行政庁は、口頭で処分をする場合にも、処分の相手方に対し、審査請求をすることができる旨等を教示しなければならない。","行政庁は、利害関係人から教示を求められたときは、当該処分が審査請求をすることができる処分であるかどうか等を教示しなければならない。","行政庁は、審査請求をすることができる処分を書面でする場合には、審査請求ができる旨、審査請求をすべき行政庁及び審査請求期間を教示しなければならない。","処分庁が誤って審査請求をすべき行政庁でない行政庁を教示し、その行政庁に審査請求がされたときは、当該行政庁は、審査請求書を処分庁又は審査庁となるべき行政庁に送付し、その旨を審査請求人に通知しなければならない。"],"why":["正しい。82条3項。","誤り（これが正解）。口頭で処分をする場合は教示義務がない（82条1項ただし書）。","正しい。82条2項。","正しい。82条1項。","正しい。22条1項。この場合、初めから適法な審査請求がされたものとみなされる（22条5項）。"],"answer":1}]};
