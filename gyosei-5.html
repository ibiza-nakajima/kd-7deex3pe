<script>window.SET = {"id":"gyosei-5","code":"行政法強化2","title":"行政法 直前強化② 行政事件訴訟法・国家賠償法","lead":"「訴えの利益」「執行停止」「当事者訴訟」など前回落とした論点と、毎年出る処分性・原告適格・国家賠償の重要判例を確認します。判例は「結論（肯定か否定か）」を先に覚えてください。","minutes":20,"questions":[{"id":"q01","area":"行訴法：訴訟要件","topic":"処分性（判例）","basis":["最大判平20.9.10","最判平21.11.26","最判昭57.4.22","最判昭43.12.24","最判平7.3.23"],"tip":"処分性「肯定」の代表：区画整理の事業計画、保育所廃止条例、病院開設中止勧告、輸入禁制品該当通知。","kind":"mc","format":"組合せ","stem":"抗告訴訟の対象となる行政処分に関する次の記述ア〜オのうち、最高裁判所の判例に照らし、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","items":["土地区画整理事業の事業計画の決定は、施行地区内の宅地所有者等の法的地位に直接的な影響を及ぼすものであり、抗告訴訟の対象となる行政処分に当たる。","市の設置する特定の保育所を廃止する条例の制定行為は、行政処分に当たる。","都市計画法上の用途地域の指定は、地域内の土地所有者等に建築制限を課すものであるから、行政処分に当たる。","通達は、国民の権利義務に重大な影響を及ぼす場合には、常に行政処分に当たる。","開発許可の申請に必要な公共施設管理者の同意を拒否する行為は、行政処分に当たる。"],"itemOk":[true,true,false,false,false],"itemWhy":["正しい。最大判平20.9.10（判例変更で肯定）。","正しい。最判平21.11.26（横浜市保育所廃止条例）。","誤り。最判昭57.4.22は、用途地域の指定の処分性を否定（一般的抽象的な効果にとどまる）。","誤り。通達は行政組織内部の命令にすぎず、処分性は否定される（最判昭43.12.24）。","誤り。最判平7.3.23は処分性を否定した。"],"options":["ア・イ","ア・エ","ア・オ","イ・エ","ウ・オ"],"answer":0},{"id":"q02","area":"行訴法：訴訟要件","topic":"原告適格（判例）","basis":["行政事件訴訟法9条","最大判平17.12.7","最判昭37.1.19","最判平21.10.15","最判平4.9.22","最判平元.4.13"],"tip":"","kind":"mc","format":"妥当なもの","stem":"取消訴訟の原告適格に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["鉄道会社の特急料金の認可について、当該特急を日常的に利用する者は、その取消しを求める原告適格を有する。","原子炉設置許可処分について、原子炉施設の周辺に居住する住民は、事故等による災害の影響を受けるとしても、原告適格を有しない。","場外車券発売施設の設置許可について、当該施設の周辺に居住する住民は、一般的に原告適格を有する。","鉄道の連続立体交差化を内容とする都市計画事業の認可について、事業地の周辺に居住する住民のうち、騒音・振動等による健康又は生活環境に係る著しい被害を直接的に受けるおそれのある者は、取消訴訟の原告適格を有する。","公衆浴場の営業許可について、適正配置規定により保護される既存業者の営業上の利益は単なる反射的利益にすぎないから、既存業者は新規業者に対する許可の取消しを求める原告適格を有しない。"],"why":["誤り。最判平元.4.13（近鉄特急事件）は、利用者の原告適格を否定した。","誤り。最判平4.9.22（もんじゅ事件）は、周辺住民の原告適格を肯定した。","誤り。最判平21.10.15は、周辺住民の原告適格を否定（一定の医療施設等の開設者には肯定の余地）。","正しい。最大判平17.12.7（小田急線事件）。","誤り。最判昭37.1.19は既存業者の原告適格を肯定した。"],"answer":3},{"id":"q03","area":"行訴法：訴訟要件","topic":"訴えの利益（判例）","basis":["行政事件訴訟法9条1項かっこ書","最判昭59.10.26","最判昭55.11.25","最判平4.1.24","最判平21.2.27","最大判昭40.4.28"],"tip":"","kind":"mc","format":"個数","stem":"取消訴訟の訴えの利益に関する次の記述ア〜オのうち、最高裁判所の判例に照らし、\u003cb>妥当なものはいくつ\u003c/b>あるか。","items":["建築確認の取消訴訟は、当該建築物の工事が完了した場合には、訴えの利益が失われる。","運転免許停止処分の取消訴訟は、処分の日から無違反・無処分で1年を経過した場合には、名誉・信用の回復の必要があるとしても、訴えの利益が失われる。","土地改良事業の施行認可処分の取消訴訟は、工事が完了して原状回復が社会通念上不可能となった場合には、訴えの利益が失われる。","優良運転者である旨の記載のない免許証を交付されて更新処分を受けた者は、更新処分の取消しを求める訴えの利益を有する。","公務員が免職処分を受けた後に公職の候補者として立候補した場合には、給料請求権等の回復の可能性があっても、免職処分の取消しを求める訴えの利益は失われる。"],"itemOk":[true,true,false,true,false],"itemWhy":["正しい。最判昭59.10.26。","正しい。最判昭55.11.25。","誤り。最判平4.1.24は訴えの利益は失われないとした（原状回復の不能は事情判決で考慮）。","正しい。最判平21.2.27。","誤り。最判昭40.4.28は訴えの利益を肯定した（給料請求権の回復）。"],"options":["一つ","二つ","三つ","四つ","五つ"],"answer":2},{"id":"q04","area":"行訴法：訴訟要件","topic":"被告・出訴期間・原処分主義","basis":["行政事件訴訟法10条2項・11条・12条・14条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"取消訴訟の提起に関する次の記述のうち、行政事件訴訟法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["取消訴訟は、処分があったことを知った日から3か月以内に提起しなければならない。","処分について審査請求をした場合でも、取消訴訟の出訴期間は、処分があったことを知った日から起算する。","国を被告とする取消訴訟は、東京地方裁判所にしか提起することができない。","処分の取消しの訴えと裁決の取消しの訴えのいずれも提起できる場合、裁決の取消しの訴えにおいて、処分の違法を理由として取消しを求めることができる。","処分をした行政庁が国又は公共団体に所属する場合には、取消訴訟は、当該行政庁の所属する国又は公共団体を被告として提起しなければならない。"],"why":["誤り。処分があったことを知った日から6か月（14条1項）。処分の日から1年を経過したときもできない（同条2項）。","誤り。審査請求をした場合は、裁決があったことを知った日から6か月・裁決の日から1年（14条3項）。","誤り。原告の普通裁判籍の所在地を管轄する高等裁判所の所在地の地方裁判所（特定管轄裁判所）にも提起できる（12条4項）。","誤り。原処分主義。裁決の取消しの訴えでは、処分の違法を理由とすることはできない（10条2項）。","正しい。11条1項。"],"answer":4},{"id":"q05","area":"行訴法：仮の救済・判決","topic":"執行停止・内閣総理大臣の異議","basis":["行政事件訴訟法25条・27条"],"tip":"行審法の執行停止は「職権でも可（上級庁・処分庁）」、行訴法は「申立てのみ」。違いが頻出。","kind":"mc","format":"妥当なもの","stem":"執行停止および内閣総理大臣の異議に関する次の記述のうち、行政事件訴訟法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["裁判所は、重大な損害を避けるため緊急の必要があるときは、申立てがなくても職権で執行停止をすることができる。","内閣総理大臣は、執行停止の申立てがあった場合には、執行停止の決定があった後においても、裁判所に対し異議を述べることができる。","執行停止は、本案について理由がないとみえるときでも、重大な損害を避けるため緊急の必要があればすることができる。","取消訴訟を提起すれば、処分の効力、処分の執行又は手続の続行は停止される。","内閣総理大臣が異議を述べた場合でも、裁判所は、異議の理由が不十分であると判断すれば執行停止をすることができる。"],"why":["誤り。執行停止は「申立てにより」行う（25条2項）。職権ではできない。","正しい。27条1項（決定の前後を問わない）。","誤り。本案について理由がないとみえるときは、執行停止をすることができない（25条4項）。","誤り。執行不停止が原則（25条1項）。","誤り。異議があったときは、裁判所は執行停止をすることができず、すでにした決定は取り消さなければならない（27条4項）。"],"answer":1},{"id":"q06","area":"行訴法：仮の救済・判決","topic":"取消判決の効力・事情判決","basis":["行政事件訴訟法31条〜33条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"取消判決の効力等に関する次の記述のうち、行政事件訴訟法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["処分が違法であっても、取り消すことにより公の利益に著しい障害を生ずる場合には、裁判所は訴えを却下することができる。","処分を取り消す判決は、第三者に対しても効力を有する。","申請を棄却した処分が判決により取り消されたときは、その処分をした行政庁は、申請を認容する処分をしなければならない。","処分を取り消す判決は、当事者である行政庁のみを拘束し、その他の関係行政庁を拘束しない。","事情判決をする場合、裁判所は判決の理由中で処分が違法であることを示せば足り、主文で宣言する必要はない。"],"why":["誤り。事情判決は「棄却」（31条1項）。","正しい。第三者効（32条1項）。","誤り。判決の趣旨に従い、改めて申請に対する処分をしなければならない（33条2項）。認容とは限らない。","誤り。その事件について、処分をした行政庁その他の関係行政庁を拘束する（33条1項）。","誤り。判決の主文で、処分が違法であることを宣言しなければならない（31条1項後段）。"],"answer":1},{"id":"q07","area":"行訴法：取消訴訟以外","topic":"無効等確認・不作為の違法確認","basis":["行政事件訴訟法36条・37条・37条の3・38条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"無効等確認の訴えおよび不作為の違法確認の訴えに関する次の記述のうち、行政事件訴訟法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["無効等確認の訴えは、処分の無効を前提とする現在の法律関係に関する訴えによって目的を達することができない場合などに限り、提起することができる。","無効等確認の訴えには、出訴期間の制限がない。","不作為の違法確認の訴えで請求を認容する判決が確定しても、行政庁に特定の内容の処分をすることを義務付けるものではない。","不作為の違法確認の訴えは、処分についての申請をした者に限らず、その不作為について法律上の利益を有する者であれば提起することができる。","法令に基づく申請に対して行政庁が相当の期間内に何らの処分もしない場合、申請者は、不作為の違法確認の訴えと併合して、申請型義務付け訴訟を提起することができる。"],"why":["正しい。36条（補充性）。","正しい。14条は準用されていない（38条）。","正しい。何らかの応答をすべき義務が生じるだけで、内容は問わない。","誤り（これが正解）。処分又は裁決についての申請をした者に限る（37条）。","正しい。37条の3第1項1号・3項1号。"],"answer":3},{"id":"q08","area":"行訴法：取消訴訟以外","topic":"義務付け・差止め・仮の救済","basis":["行政事件訴訟法3条6項・37条の2〜37条の5"],"tip":"","kind":"mc","format":"組合せ","stem":"義務付けの訴えおよび差止めの訴えに関する次の記述ア〜オのうち、行政事件訴訟法の規定に照らし、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","items":["非申請型義務付け訴訟は、一定の処分がされないことにより重大な損害を生ずるおそれがあり、かつ、その損害を避けるため他に適当な方法がないときに限り、提起することができる。","申請拒否処分がされた場合の申請型義務付け訴訟では、その処分の取消訴訟又は無効等確認の訴えを併合して提起しなければならない。","差止めの訴えは、一定の処分がされることにより重大な損害を生ずるおそれがある場合には、その損害を避けるため他に適当な方法があるときでも提起することができる。","仮の義務付けは、償うことのできない損害を避けるため緊急の必要があれば、本案について理由があるとみえるかどうかにかかわらず認められる。","義務付けの訴えは、抗告訴訟ではなく当事者訴訟の一類型である。"],"itemOk":[true,true,false,false,false],"itemWhy":["正しい。37条の2第1項。","正しい。37条の3第3項2号。","誤り。他に適当な方法があるときは提起できない（37条の4第1項ただし書）。","誤り。「本案について理由があるとみえるとき」であることも必要（37条の5第1項）。","誤り。義務付けの訴えは抗告訴訟の一類型（3条6項）。"],"options":["ア・イ","ア・ウ","イ・オ","ウ・エ","エ・オ"],"answer":0},{"id":"q09","area":"行訴法：取消訴訟以外","topic":"当事者訴訟・民衆訴訟・機関訴訟","basis":["行政事件訴訟法4条〜6条・42条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"抗告訴訟以外の行政事件訴訟に関する次の記述のうち、行政事件訴訟法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["機関訴訟は、国又は公共団体の機関相互間の権限に関する紛争についての訴訟であり、法律の定めがなくても提起することができる。","地方自治法に基づく住民訴訟は、機関訴訟の典型例である。","民衆訴訟は、自己の法律上の利益にかかわらない資格で提起するものであるから、国民であれば誰でも、法律の定めがなくても提起することができる。","公法上の法律関係に関する確認の訴えは、行政事件訴訟法上の当事者訴訟に含まれない。","土地収用法に基づく収用委員会の裁決のうち損失補償に関する訴えは、法令の規定により法律関係の当事者の一方を被告とするもので、形式的当事者訴訟に当たる。"],"why":["誤り。機関訴訟も同様に、法律に定める場合に限る（42条）。","誤り。住民訴訟は民衆訴訟の典型例（5条）。","誤り。民衆訴訟は、法律に定める場合において、法律に定める者に限り提起できる（42条）。","誤り。4条後段に「公法上の法律関係に関する確認の訴え」と明記されている（実質的当事者訴訟）。","正しい。4条前段（土地収用法133条）。"],"answer":4},{"id":"q10","area":"国賠：1条","topic":"国家賠償法1条（判例）","basis":["国家賠償法1条","最判昭30.4.19","最判昭31.11.30","最判平19.1.25","最大判平17.9.14"],"tip":"","kind":"mc","format":"妥当なもの","stem":"国家賠償法1条に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["国又は公共団体が被害者に賠償した場合、公務員に軽過失があるにとどまるときでも、国又は公共団体は当該公務員に求償することができる。","都道府県の措置により社会福祉法人の児童養護施設に入所した児童に対する施設職員の養育監護行為は、民間の職員による行為であるから、国家賠償法1条1項の公権力の行使に当たることはない。","国家賠償法1条1項に基づき国又は公共団体が賠償責任を負う場合、公務員個人は、被害者に対して直接損害賠償責任を負わない。","国会議員の立法行為は、その内容が憲法に違反するものであれば、直ちに国家賠償法1条1項の適用上違法となる。","非番の警察官が、もっぱら私利を図る目的で制服を着用し職務執行を装って強盗をした場合には、国家賠償法1条の「職務を行うについて」には当たらない。"],"why":["誤り。求償できるのは、公務員に故意又は重大な過失があったときに限る（1条2項）。","誤り。最判平19.1.25は、県の公権力の行使に当たるとした（職員個人も法人も賠償責任を負わない）。","正しい。最判昭30.4.19。","誤り。立法の内容が憲法上の権利を違法に侵害することが明白な場合など、例外的な場合に限り違法となる（最大判平17.9.14など）。","誤り。最判昭31.11.30は、客観的に職務執行の外形を備えていれば「職務を行うについて」に当たるとした（外形標準説）。"],"answer":2},{"id":"q11","area":"国賠：2条・損失補償","topic":"国家賠償法2条・3条","basis":["国家賠償法2条・3条","最判昭45.8.20","最判昭59.1.26"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"公の営造物の設置管理の瑕疵に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["営造物の設置又は管理の瑕疵とは、営造物が通常有すべき安全性を欠いていることをいい、国又は公共団体の過失の存在を必要としない。","河川の管理の瑕疵の有無は、財政的・技術的・社会的諸制約の下で、同種・同規模の河川の管理の一般水準及び社会通念に照らして是認しうる安全性を備えているかどうかを基準に判断される。","公の営造物には、道路や河川などの不動産だけでなく、動産も含まれる。","道路の管理に瑕疵がある場合でも、安全施設を設置するための予算が不足していたときは、国又は公共団体は賠償責任を免れる。","公の営造物の設置管理者と費用負担者が異なるときは、費用負担者も損害賠償の責任を負う。"],"why":["正しい。無過失責任（最判昭45.8.20）。","正しい。最判昭59.1.26（大東水害訴訟）。","正しい。公用車や警察官の拳銃なども含まれると解されている。","誤り（これが正解）。最判昭45.8.20（高知落石事件）は、予算不足は免責事由にならないとした。","正しい。3条1項。"],"answer":3},{"id":"q12","area":"国賠：2条・損失補償","topic":"損失補償","basis":["憲法29条3項","最大判昭43.11.27","最判昭48.10.18","最大判昭28.12.23","最大判昭38.6.26"],"tip":"","kind":"mc","format":"妥当なもの","stem":"損失補償に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["法令に損失補償に関する規定がない場合でも、直接憲法29条3項を根拠として補償を請求する余地があるとするのが判例である。","農地改革における農地の買収価格が市場価格を下回っていたことから、判例は、買収を憲法29条3項に違反するとした。","ため池の堤とうの使用を禁止する奈良県の条例について、判例は、損失補償を要するとした。","財産権の制限が社会生活上一般に受忍すべき程度にとどまる場合でも、損失補償は常に必要である。","土地収用法による損失補償は、被収用者の財産価値を収用の前後で等しくさせるような補償である必要はなく、合理的に算出された相当な額で足りる。"],"why":["正しい。最大判昭43.11.27（河川附近地制限令事件）。","誤り。最大判昭28.12.23は合憲とした（相当な補償で足りる）。","誤り。最大判昭38.6.26は、災害防止のための制限は受忍すべきもので補償は不要とした。","誤り。受忍限度内の制限（警察規制など）であれば補償は不要。","誤り。最判昭48.10.18は、土地収用法では完全な補償が必要とした。"],"answer":0}]};
