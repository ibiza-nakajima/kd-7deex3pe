<style>
/* Layout: one narrow column, one question per screen, thumb-sized answer rows, sticky progress bar */
:root{
  --paper:#F4F5F8; --surface:#FFFFFF; --ink:#1A2033; --muted:#5A6174; --line:#D8DBE4;
  --accent:#27408B; --accent-soft:#E7EBF7; --ok:#1E7A4C; --ok-soft:#E2F2E9; --ng:#B42318; --ng-soft:#FBE8E6; --mid:#9A6700; --mid-soft:#FBF1DC;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-head:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141C; --surface:#1A1E29; --ink:#E7E9F0; --muted:#A1A7B7; --line:#2D3341;
  --accent:#93A8F0; --accent-soft:#222B45; --ok:#5DC48E; --ok-soft:#173224; --ng:#F08B80; --ng-soft:#3A1F1C; --mid:#E3B341; --mid-soft:#3A2F14; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141C; --surface:#1A1E29; --ink:#E7E9F0; --muted:#A1A7B7; --line:#2D3341;
  --accent:#93A8F0; --accent-soft:#222B45; --ok:#5DC48E; --ok-soft:#173224; --ng:#F08B80; --ng-soft:#3A1F1C; --mid:#E3B341; --mid-soft:#3A2F14; color-scheme:dark}
html{-webkit-text-size-adjust:100%;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.set-name{font-family:var(--f-head);font-size:16px;letter-spacing:.04em;min-width:0}
.bar a{color:var(--accent);font-size:13.5px;text-decoration:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.chip.on i{background:var(--ok)} .chip.off i{background:var(--ng)}
.track{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.track span{display:block;height:100%;background:var(--accent);transition:width .25s}
h1,h2{font-family:var(--f-head);font-weight:700;text-wrap:balance;margin:0;line-height:1.4}
h1{font-size:26px} h2{font-size:20px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px}
.qhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--f-head);font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.tag{font-size:12.5px;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);padding:1px 8px;border-radius:4px}
.stem b{color:var(--accent)}
.items{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.items div{display:grid;grid-template-columns:1.6em 1fr;gap:4px}
.items div > *{min-width:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;text-align:left;width:100%;font:inherit;color:var(--ink);
  background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;min-height:56px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt span:last-child{min-width:0}
.opt .n{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.opt:focus-visible,.btn:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.is-right{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-right .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.is-wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.is-wrong .n{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.opt.dim{opacity:.6}
.verdict{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:1.5px solid}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok)} .verdict.ng{background:var(--ng-soft);border-color:var(--ng)}
.verdict strong{font-size:19px;font-family:var(--f-head)}
.verdict.ok strong{color:var(--ok)} .verdict.ng strong{color:var(--ng)}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 14px}
summary{cursor:pointer;padding:12px 0;font-weight:700}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.why{display:flex;flex-direction:column;gap:12px;padding-bottom:14px}
.why div{display:grid;grid-template-columns:2.6em 1fr;gap:6px}
.why div > *{min-width:0}
.mk{font-weight:700;font-variant-numeric:tabular-nums}
.mk.o{color:var(--ok)} .mk.x{color:var(--ng)}
.basis{margin:0;padding:0 0 14px 1.2em;display:flex;flex-direction:column;gap:6px}
.tip{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:15px}
.tip b{color:var(--accent)}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:14px 18px;min-height:52px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--surface);width:100%;text-align:center;text-decoration:none;display:block;box-sizing:border-box}
.btn.ghost{background:transparent;color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 180px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.note{font-size:14px;color:var(--muted)}
.savenote{font-size:13px;color:var(--muted)}
textarea{width:100%;box-sizing:border-box;font:inherit;font-size:17px;line-height:1.8;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:120px;resize:vertical}
.count{font-size:14px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.count.over{color:var(--ng)}
.model{font-family:var(--f-head);font-size:18px;line-height:1.8;background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.checks label > *{min-width:0}
.checks input{width:22px;height:22px;accent-color:var(--accent)}
.pts{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.score{font-family:var(--f-head);font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.score small{font-size:18px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats > div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--muted)}
.areas{display:flex;flex-direction:column;gap:10px}
.area{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.area > *{min-width:0}
.area .nm{font-weight:700;font-size:15px}
.area .val{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);white-space:nowrap}
.area .meter{grid-column:1 / -1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.area .meter span{display:block;height:100%}
.lv{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px;white-space:nowrap}
.lv.weak{background:var(--ng-soft);color:var(--ng)} .lv.mid{background:var(--mid-soft);color:var(--mid)} .lv.good{background:var(--ok-soft);color:var(--ok)}
.misslist{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:15px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:700;color:var(--muted);font-size:12.5px}
td.o{color:var(--ok);font-weight:700} td.x{color:var(--ng);font-weight:700}
.copybox{width:100%;box-sizing:border-box;font-size:13px;min-height:160px;font-family:ui-monospace,Menlo,monospace}
.toast{font-size:14px;color:var(--ok);min-height:1.4em}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<script>
const SET = {"id":"gyosei-1","code":"行政法1","title":"行政法① 総論・行政手続法","lead":"行政行為・行政立法・行政指導・強制執行などの総論と、行政手続法の条文知識を確認します。行政法は配点が最も大きい科目です。","minutes":40,"questions":[{"id":"q01","area":"総論：行政行為","topic":"行政行為の効力","basis":["最判昭36.4.21（国家賠償と取消判決）","行政事件訴訟法36条（無効等確認の訴え）"],"tip":"","kind":"mc","format":"妥当なもの","stem":"行政行為の効力に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["行政行為の執行力により、行政庁は、法律の根拠がなくても、義務者の義務を自ら強制的に実現することができる。","違法な行政行為であっても、無効でない限り、権限ある機関によって取り消されるまでは有効なものとして扱われる。","行政行為に重大かつ明白な瑕疵がある場合でも、取消訴訟の出訴期間を経過すれば、もはや無効を主張することはできない。","行政処分の違法を理由として国家賠償請求をするには、あらかじめ当該処分について取消判決を得ておく必要がある。","不可変更力はすべての行政行為に認められる効力であり、処分庁は一度した処分を職権で取り消すことができない。"],"why":["誤り。行政上の強制執行には、行政代執行法など法律の根拠が必要。","正しい。公定力の説明。取消訴訟の排他的管轄によって裏付けられる。","誤り。無効な行政行為は出訴期間の制限を受けず、無効等確認訴訟や争点訴訟で無効を主張できる。","誤り。国家賠償請求は、取消判決を得ていなくても提起できる（最判昭36.4.21）。","誤り。不可変更力は、審査請求に対する裁決など争訟裁断的な行為に認められる効力で、すべての行政行為に認められるわけではない。"],"answer":1},{"id":"q02","area":"総論：行政行為","topic":"取消しと撤回","basis":["最判昭63.6.17（菊田医師事件）"],"tip":"「取消し＝成立時の瑕疵・遡及効」「撤回＝後発的事情・将来効」の対比で整理する。","kind":"mc","format":"妥当でないもの","stem":"行政行為の職権取消しおよび撤回に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["行政行為の撤回は、成立時には瑕疵がなかったが、その後の事情の変化によって存続させることが妥当でなくなった場合に、将来に向かってその効力を失わせるものである。","授益的行政行為の職権取消しは、取消しによって相手方が受ける不利益と取消しによる公益上の必要とを比較衡量して、制限されることがある。","職権取消しは、原則として、行政行為の成立時にさかのぼってその効力を失わせる。","撤回は、法律に特別の定めがない限り処分庁が行うものであり、監督庁が撤回することはできないと解されている。","授益的行政行為の撤回は、相手方の利益を害するものであるから、法律に撤回を認める明文の規定がなければ行うことができない。"],"why":["正しい。撤回は後発的事情による将来効。","正しい。授益的処分の職権取消しには、信頼保護の観点から制限がかかり得る。","正しい。取消しは原始的瑕疵を理由とし、原則として遡及効を持つ。","正しい。通説。撤回は処分の内容を新たに決めるに等しく、処分権限を持つ処分庁が行う。","誤り（これが正解）。菊田医師事件（最判昭63.6.17）は、法令上の直接の根拠がなくても、撤回すべき公益上の必要性が高い場合には撤回できるとした。"],"answer":4},{"id":"q03","area":"総論：立法・裁量・一般原則","topic":"行政立法","basis":["最判平14.1.31（児童扶養手当法施行令）","最判昭43.12.24（墓地埋葬通達）","最判平25.1.11（医薬品ネット販売）","内閣法11条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"行政立法に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["告示は、いかなる場合にも法規としての性質を有しない。","内閣は、法律の委任がなくても、政令で国民に義務を課し、又は権利を制限する規定を設けることができる。","児童扶養手当法施行令が、父から認知された婚姻外の子を支給対象から除外していた部分は、法律の委任の範囲を逸脱し無効であるとした判例がある。","医薬品の郵便等販売を一律に禁止した省令の規定は、薬事法（当時）の委任の範囲内にあり適法であるとされた。","通達は、国民の権利義務を直接規律する法規としての性質を有するから、裁判所は通達に拘束される。"],"why":["誤り。学習指導要領（告示）は法規としての性質を有するとした判例がある（伝習館高校事件・最判平2.1.18）。","誤り。内閣法11条により、法律の委任がなければ、政令で義務を課し権利を制限する規定は設けられない。","正しい。最判平14.1.31。","誤り。最判平25.1.11は、一律禁止は新薬事法の委任の範囲を逸脱し違法無効とした。","誤り。通達は行政組織内部の命令にすぎず、国民も裁判所も拘束しない（墓地埋葬通達事件・最判昭43.12.24）。"],"answer":2},{"id":"q04","area":"総論：実効性確保・調査","topic":"行政代執行","basis":["行政代執行法1条・2条・3条・6条","最判平14.7.9（宝塚市パチンコ条例）"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"行政上の強制執行に関する次の記述のうち、法令の規定および判例に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["国又は地方公共団体が専ら行政権の主体として国民に対して行政上の義務の履行を求める訴訟は、法律上の争訟に当たらず、不適法である。","代執行に要した費用は、国税滞納処分の例により徴収することができる。","代執行を行うには、原則として、相当の履行期限を定め、その期限までに履行がなされないときは代執行をなすべき旨を、あらかじめ文書で戒告しなければならない。","行政上の義務の履行確保に関しては、別に法律で定めるものを除いては、行政代執行法の定めるところによる。","行政代執行法に基づく代執行は、非代替的作為義務についても行うことができる。"],"why":["正しい。宝塚市パチンコ店規制条例事件（最判平14.7.9）。","正しい。同法6条1項。","正しい。行政代執行法3条1項。","正しい。同法1条。条例で独自の強制執行手段を創設することはできないと解されている。","誤り（これが正解）。代執行の対象は、他人が代わってすることのできる行為（代替的作為義務）に限られる（行政代執行法2条）。"],"answer":4},{"id":"q05","area":"総論：実効性確保・調査","topic":"即時強制・執行罰・行政罰","basis":["行政代執行法1条","砂防法36条","非訟事件手続法","地方自治法149条3号・255条の3"],"tip":"","kind":"mc","format":"組合せ","stem":"行政上の義務履行確保および行政罰に関する次の記述ア〜オのうち、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","items":["執行罰は、義務の不履行に対して過料を予告し、期限までに履行しないときに過料を科すことで履行を促すもので、現行法では砂防法に規定が残っている。","行政上の秩序罰としての過料は刑罰であるから、刑事訴訟法の手続により科される。","即時強制は、義務を命ずる暇のない緊急の場合などに、相手方に義務を課すことなく直接身体又は財産に実力を加えるもので、法律（条例を含む。）の根拠を要する。","直接強制は、行政代執行法に一般的な根拠規定があるので、個別法の規定がなくても行うことができる。","同一の行為について行政刑罰と秩序罰としての過料を併科することは、憲法39条の二重処罰の禁止に違反するとされている。"],"itemOk":[true,false,true,false,false],"itemWhy":["正しい。執行罰（間接強制）は現行法では砂防法36条に残るのみとされる。","誤り。過料は刑罰ではない。法令違反の過料は非訟事件手続法により、条例・規則違反の過料は地方公共団体の長が科す。","正しい。即時強制は義務の存在を前提としない実力行使で、条例を根拠とすることもできる。","誤り。直接強制に一般法はなく、個別の法律の根拠が必要。","誤り。判例は、秩序罰と刑罰は目的・要件・手続を異にするとして、併科は憲法39条に違反しないとしている。"],"options":["ア・ウ","ア・エ","ア・オ","イ・ウ","ウ・エ"],"answer":0},{"id":"q06","area":"総論：行政指導・契約・組織","topic":"行政指導・行政契約の判例","basis":["最判昭60.7.16（品川マンション）","最決平1.11.8（武蔵野マンション）","最判平21.7.10（公害防止協定）","行政手続法32条2項"],"tip":"","kind":"mc","format":"妥当なもの","stem":"行政指導および行政契約に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["行政指導は事実行為であるから、行政手続法には、行政指導に従わなかったことを理由とする不利益な取扱いを禁止する規定はない。","地方公共団体が、随意契約によることができる場合でないのに随意契約を締結したときは、その契約は私法上当然に無効となる。","産業廃棄物処分業者と町が結んだ公害防止協定において処分場の使用期限を定める条項は、廃棄物処理法の趣旨に反し、当然に法的拘束力を有しない。","建築確認の留保は、建築主が行政指導に協力できない旨の意思を真摯かつ明確に表明して確認処分を求めているときは、特段の事情がない限り違法となる。","行政指導に従わない事業者に対して水道の給水契約の締結を拒否することは、水道法15条1項の「正当の理由」に当たる。"],"why":["誤り。行政手続法32条2項が不利益取扱いを禁止している。","誤り。最判昭62.5.19は、違法な随意契約も、特段の事情がない限り私法上当然には無効とならないとした。","誤り。最判平21.7.10は、使用期限条項の法的拘束力を否定できないとした。","正しい。品川マンション事件（最判昭60.7.16）。","誤り。武蔵野マンション事件（最決平1.11.8）は、給水契約の拒否は「正当の理由」に当たらないとした。"],"answer":3},{"id":"q07","area":"総論：実効性確保・調査","topic":"行政調査","basis":["最大判昭47.11.22（川崎民商事件）","最判昭53.6.20（所持品検査）","最決昭55.9.22（自動車検問）","最決平16.1.20"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"行政調査に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["憲法35条1項の規定は、刑事責任追及の手続でないとの理由のみで、その手続における一切の強制が当然に保障の枠外にあると判断することは相当でない。","税務調査における質問検査は、刑事責任追及のための資料の取得収集に直接結びつく作用を一般的に有するから、憲法35条・38条の保障が全面的に及び、令状なしに行うことはできない。","警察官は、職務質問に附随して、捜索に至らない程度の所持品検査を、強制にわたらない限り、必要性・緊急性等を考慮し具体的状況のもとで相当と認められる限度で行うことができる場合がある。","自動車の一斉検問は、相手方の任意の協力を求める形で、運転者等の自由を不当に制約しない方法・態様で行われる限り、適法である。","法人税法上の質問検査権の行使によって取得収集された資料が後に犯則事件の証拠として利用されることが想定できたとしても、直ちに質問検査権が犯則調査の手段として行使されたことにはならない。"],"why":["正しい。同じく川崎民商事件の判示。","誤り（これが正解）。川崎民商事件（最大判昭47.11.22）は、税務調査は刑事責任追及の資料収集に直接結びつく作用を一般的に有するものではなく、令状を要しないとした。","正しい。米子銀行強盗事件（最判昭53.6.20）。","正しい。最決昭55.9.22。","正しい。最決平16.1.20。"],"answer":1},{"id":"q08","area":"行手法：総則・処分","topic":"定義と適用除外","basis":["行政手続法2条6号・8号、3条1項・3項"],"tip":"地方公共団体の「処分・届出」は根拠が条例・規則なら除外、「行政指導」は根拠を問わず除外。この違いが頻出。","kind":"mc","format":"妥当なもの","stem":"行政手続法の定義および適用除外に関する次の記述のうち、行政手続法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["国会の両院若しくは一院又は議会の議決によってされる処分にも、行政手続法の規定が適用される。","地方公共団体の機関がする処分は、その根拠となる規定が条例に置かれているものであっても、行政手続法の申請に対する処分・不利益処分の規定が適用される。","「行政指導」とは、行政機関がその任務又は所掌事務の範囲内において一定の行政目的を実現するため特定の者に一定の作為又は不作為を求める指導、勧告、助言その他の行為であって処分に該当しないものをいう。","地方公共団体の機関がする行政指導には、その根拠が法律に置かれている場合には、行政手続法の行政指導の規定が適用される。","「命令等」には、法律に基づく命令、審査基準、処分基準及び行政指導指針が含まれるが、規則は含まれない。"],"why":["誤り。議会の議決による処分は適用除外（3条1項1号）。","誤り。条例・規則に根拠がある処分は適用除外（3条3項）。地方は自ら手続条例を定める。","正しい。行政手続法2条6号。","誤り。地方公共団体の機関がする行政指導は、根拠が法律か条例かを問わず適用除外（3条3項）。","誤り。「命令等」には規則も含まれる（2条8号）。"],"answer":2},{"id":"q09","area":"行手法：総則・処分","topic":"申請に対する処分","basis":["行政手続法5条〜8条・10条"],"tip":"審査基準＝法的義務、標準処理期間・処分基準＝努力義務。行手法の「〜しなければならない／努めなければならない」の区別は毎年のように問われる。","kind":"mc","format":"妥当なもの","stem":"申請に対する処分に関する次の記述のうち、行政手続法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["行政庁は、申請者以外の者の利害を考慮すべきことが法令において許認可等の要件とされているものを行う場合には、必ず公聴会を開催しなければならない。","申請により求められた許認可等を拒否する処分をする場合、行政庁は、申請者から求めがあったときに限り、その理由を示せば足りる。","標準処理期間を定めた場合、行政庁はその期間内に処分をしなければならない法的義務を負う。","審査基準は、行政上特別の支障があるときを除き、公にしておくよう努めなければならない。","行政庁は、申請がその事務所に到達したときは遅滞なく審査を開始しなければならず、形式上の要件に適合しない申請については、速やかに補正を求めるか、許認可等を拒否しなければならない。"],"why":["誤り。公聴会の開催は努力義務（10条）。","誤り。拒否処分をする場合は、原則として同時に理由を示さなければならない（8条1項）。","誤り。標準処理期間は定めるよう努める（努力義務）もので、定めたときは公にしておかなければならない（6条）。期間内に処分する義務を定めたものではない。","誤り。審査基準は「定めるものとする」「公にしておかなければならない」（5条1項・3項）。努力義務ではない。","正しい。7条。"],"answer":4},{"id":"q10","area":"行手法：総則・処分","topic":"不利益処分","basis":["行政手続法12条〜14条・29条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"不利益処分に関する次の記述のうち、行政手続法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["弁明の機会の付与は、弁明書を提出してするのが原則であり、行政庁が口頭ですることを認めたときは口頭でもすることができる。","公益上、緊急に不利益処分をする必要があるため意見陳述のための手続を執ることができないときは、聴聞・弁明の機会の付与の手続を執らないことができる。","処分基準を定めることは法的義務であり、行政庁は処分基準を必ず定め、これを公にしておかなければならない。","許認可等を取り消す不利益処分をしようとするときは、原則として聴聞の手続を執らなければならない。","不利益処分をする場合には、原則として、その名あて人に対し、同時に当該不利益処分の理由を示さなければならない。"],"why":["正しい。29条1項。","正しい。13条2項1号。","誤り（これが正解）。処分基準は、定め、かつ公にしておくよう「努めなければならない」（12条1項）。","正しい。13条1項1号イ。","正しい。14条1項。"],"answer":2},{"id":"q11","area":"行手法：総則・処分","topic":"聴聞の手続","basis":["行政手続法16条・18条〜20条・26条"],"tip":"","kind":"mc","format":"個数","stem":"聴聞に関する次の記述ア〜オのうち、行政手続法の規定に照らし、\u003cb>妥当なものはいくつ\u003c/b>あるか。","items":["聴聞の通知を受けた者は、代理人を選任することができる。","当事者は、聴聞の通知があった時から聴聞が終結する時までの間、行政庁に対し、当該事案についてした調査の結果に係る調書その他の当該不利益処分の原因となる事実を証する資料の閲覧を求めることができる。","聴聞は、行政庁が指名する職員その他政令で定める者が主宰するが、当該聴聞の当事者の配偶者は主宰者となることができない。","聴聞の期日における審理は、行政庁が公開することを相当と認めるときを除き、公開しない。","行政庁は、不利益処分の決定をするときは、主宰者の報告書に記載された主宰者の意見に拘束される。"],"itemOk":[true,true,true,true,false],"itemWhy":["正しい。16条1項。","正しい。18条1項（文書等閲覧請求）。","正しい。19条2項。","正しい。20条6項。","誤り。主宰者の意見を「十分に参酌して」しなければならない（26条）。拘束はされない。"],"options":["一つ","二つ","三つ","四つ","五つ"],"answer":3},{"id":"q12","area":"行手法：指導・届出・意見公募","topic":"行政指導","basis":["行政手続法32条〜36条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"行政指導に関する次の記述のうち、行政手続法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["行政指導に携わる者は、その相手方が行政指導に従わなかったことを理由として、不利益な取扱いをしてはならない。","許認可等の権限を有する行政機関が、当該権限を行使することができない場合において行政指導をする際には、その権限を行使し得る旨をことさらに示すことが許されている。","同一の行政目的を実現するため複数の者に対し行政指導をしようとするときは、行政機関は、行政指導指針を定めるよう努めなければならない。","申請の取下げ又は内容の変更を求める行政指導は、申請者が行政指導に従う意思がない旨を表明した場合でも、継続することが認められている。","口頭でされた行政指導について、相手方から趣旨・内容・責任者を記載した書面の交付を求められたときは、相手方に対しその場において完了する行為を求めるものであっても、行政上特別の支障がない限り、書面を交付しなければならない。"],"why":["正しい。32条2項。","誤り。ことさらに示すことで相手方に従うことを余儀なくさせてはならない（34条）。","誤り。行政指導指針は「定め」、かつ、行政上特別の支障がない限り「公表しなければならない」（36条）。","誤り。申請者が従う意思がない旨を表明したのに指導を継続して権利行使を妨げてはならない（33条）。","誤り。その場で完了する行為を求めるものは、書面交付義務の対象外（35条4項1号）。"],"answer":0},{"id":"q13","area":"行手法：指導・届出・意見公募","topic":"行政指導の中止等・処分等の求め","basis":["行政手続法36条の2・36条の3"],"tip":"中止等の求め＝「相手方」が「行政指導」の中止を求める。処分等の求め＝「何人も」が「処分・行政指導」を求める。主体と対象をセットで覚える。","kind":"mc","format":"妥当なもの","stem":"行政指導の中止等の求めおよび処分等の求めに関する次の記述のうち、行政手続法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["行政指導の中止等の求めは、当該行政指導の相手方に限らず、何人もすることができる。","行政指導の中止等の求めは、口頭ですることもできる。","処分等の求めを受けた行政庁は、申出をした者に対し、必ず調査の結果を通知しなければならない。","法令に違反する事実がある場合において、その是正のためにされるべき処分又は行政指導（根拠となる規定が法律に置かれているものに限る。）がされていないと思料するときは、何人も、権限を有する行政庁又は行政機関に対し、それをすることを求めることができる。","行政指導の中止等の求めは、行政指導がされた日から60日以内にしなければならない。"],"why":["誤り。中止等の求めができるのは、法令違反行為の是正を求める行政指導（法律に根拠があるもの）の相手方（36条の2第1項）。","誤り。申出書を提出してする（36条の2第2項）。","誤り。必要な調査を行い、必要があると認めるときは処分等をしなければならない（36条の3第3項）が、結果の通知義務は定められていない。","正しい。36条の3第1項（処分等の求め）。","誤り。期間の制限は定められていない。"],"answer":3},{"id":"q14","area":"行手法：指導・届出・意見公募","topic":"意見公募手続","basis":["行政手続法38条・39条・43条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"意見公募手続に関する次の記述のうち、行政手続法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["命令等制定機関は、命令等を定めようとする場合には、当該命令等の案及びこれに関連する資料をあらかじめ公示し、意見の提出先及び意見提出期間を定めて広く一般の意見を求めなければならない。","意見公募手続の意見提出期間は、公示の日から起算して20日以上でなければならない。","公益上、緊急に命令等を定める必要があるため意見公募手続を実施することが困難であるときは、意見公募手続を実施しないことができる。","命令等制定機関は、命令等を定めた後においても、その実施状況や社会経済情勢の変化等を勘案し、必要に応じて内容を検討し、その適正を確保するよう努めなければならない。","意見公募手続を実施して命令等を定めた場合には、原則として、命令等の公布と同時期に、提出意見を考慮した結果及びその理由を公示しなければならない。"],"why":["正しい。39条1項。","誤り（これが正解）。原則30日以上（39条3項）。","正しい。39条4項1号。","正しい。38条2項。","正しい。43条1項。"],"answer":1},{"id":"q15","area":"行手法：指導・届出・意見公募","topic":"届出","basis":["行政手続法2条3号・7号、3条3項、37条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"届出に関する次の記述のうち、行政手続法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["届出が法令に定められた形式上の要件に適合している場合は、当該届出が提出先とされている機関の事務所に到達したときに、届出をすべき手続上の義務が履行されたものとする。","地方公共団体の機関に対する届出は、その根拠が法律に置かれているものであっても、行政手続法の届出の規定は適用されない。","届出は、行政庁が受理したときに、届出をすべき手続上の義務が履行されたものとされる。","届出は、行政庁の諾否の応答を予定した行為である。","形式上の要件に適合しない届出については、行政庁は補正を求めなければならない。"],"why":["正しい。37条（到達主義）。","誤り。除外されるのは条例・規則に根拠がある届出（3条3項）。法律に根拠がある届出には適用される。","誤り。受理ではなく到達で義務が履行される。","誤り。諾否の応答が予定されているのは「申請」（2条3号）。","誤り。補正を求める規定は申請についてのもの（7条）。届出にはない。"],"answer":0},{"id":"q16","area":"行手法：総則・処分","topic":"理由の提示","basis":["最判平23.6.7（一級建築士免許取消）","最判昭60.1.22（旅券発給拒否）","最判昭47.12.5","行政手続法8条・14条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"処分の理由の提示に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["旅券発給拒否処分の通知書に根拠法条を示しておけば、申請者がその拒否理由を知り得る以上、理由付記として十分であるとした判例がある。","処分基準が公にされている場合の免許取消処分では、根拠法条だけでなく処分基準の適用関係まで示されなければ、原則として理由提示として不十分であるとした判例がある。","理由提示の瑕疵は、処分の内容が適法である限り、処分の取消事由とはならないとするのが判例である。","青色申告に対する更正処分の理由付記の不備は、後日の審査裁決で理由が明らかにされれば治癒されるとするのが判例である。","行政手続法は、申請に対する拒否処分を書面でするときでも、理由を書面で示すことまでは求めていない。"],"why":["誤り。最判昭60.1.22は、根拠規定を示すだけでは不十分とした。","正しい。一級建築士免許取消処分事件（最判平23.6.7）。","誤り。理由付記の不備は処分の取消事由となる。","誤り。最判昭47.12.5は、後日の裁決で理由が明らかにされても治癒されないとした。","誤り。処分を書面でするときは、理由も書面で示さなければならない（8条2項）。"],"answer":1},{"id":"q17","area":"総論：立法・裁量・一般原則","topic":"信頼保護・法の一般原則","basis":["最判昭56.1.27（宜野座村工場誘致）","最判昭62.10.30（信義則と課税）","最判昭59.12.13（公営住宅）"],"tip":"","kind":"mc","format":"妥当なもの","stem":"行政上の法律関係に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["租税法規に適合する課税処分が、信義則の法理の適用によって違法として取り消されることは一切ない。","国税滞納処分による差押えについては、民法177条は適用されない。","地方公共団体は、いったん決定した施策について、住民自治の原則にかかわらず、これを変更することは許されない。","地方公共団体が工場誘致施策を変更する場合、代償的措置を講ずることなく施策を変更し、密接な交渉を持った者に社会観念上看過できない程度の積極的損害を与えることは、やむを得ない客観的事情によるのでない限り、不法行為責任を生じさせる。","公営住宅の使用関係には公営住宅法が適用されるので、信頼関係の法理が適用される余地はない。"],"why":["誤り。最判昭62.10.30は、信義則の適用には慎重であるべきとしつつ、特別の事情がある場合には適用の余地を認めている。","誤り。判例は、滞納処分による差押えにも民法177条の適用があるとする。","誤り。宜野座村事件は、施策の変更自体は住民自治の原則から当然にあり得るとした。","正しい。宜野座村工場誘致事件（最判昭56.1.27）。","誤り。最判昭59.12.13は、公営住宅の使用関係にも信頼関係の法理の適用があるとした。"],"answer":3},{"id":"q18","area":"総論：立法・裁量・一般原則","topic":"行政裁量","basis":["行政事件訴訟法30条","最判平18.11.2（小田急）","最判平18.2.7（呉市）","最判昭52.12.20（神戸税関）"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"行政裁量に関する次の記述のうち、法令の規定および判例に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["都市計画の決定・変更は、重要な事実の基礎を欠く場合や、判断の過程で考慮すべき事情を考慮しないこと等によりその内容が社会通念に照らし著しく妥当性を欠く場合に限り、裁量権の逸脱・濫用として違法となる。","行政事件訴訟法30条は、行政庁の裁量処分については、裁量権の範囲をこえ又はその濫用があった場合に限り、裁判所はその処分を取り消すことができると定める。","行政庁の裁量処分については、裁判所は、行政庁と同一の立場に立って判断を代置し、その結論が異なれば処分を取り消すことができる。","公務員に対する懲戒処分は、懲戒権者の判断が社会観念上著しく妥当を欠き、裁量権を濫用したと認められる場合に違法となる。","公立学校施設の目的外使用の不許可処分について、考慮すべき事項を十分考慮しなかったこと等を理由に、裁量権の逸脱・濫用を認めた判例がある。"],"why":["正しい。小田急高架訴訟本案判決（最判平18.11.2）。","正しい。行政事件訴訟法30条。","誤り（これが正解）。判断代置は羈束行為の審査方法。裁量処分は逸脱・濫用がある場合に限り取り消される。","正しい。神戸税関事件（最判昭52.12.20）。","正しい。呉市公立学校施設使用不許可事件（最判平18.2.7）。"],"answer":2},{"id":"q19","area":"総論：行政指導・契約・組織","topic":"権限の委任・代理・専決","basis":["国家行政組織法14条2項","学説（委任・代理・専決）"],"tip":"委任＝権限が移る・法律の根拠必要。代理・専決＝権限は移らない。専決は根拠不要。","kind":"mc","format":"組合せ","stem":"行政機関の権限に関する次の記述ア〜オのうち、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","items":["権限の委任がされると、委任した行政庁は当該権限を失い、受任機関が自己の名と責任において権限を行使する。","権限の委任は、法律が定めた権限の所在を変更するものであるから、法律の根拠を要する。","法定代理は法律の定めに基づいて生ずるので、授権代理と異なり、被代理庁の権限は代理機関に移転する。","専決は、補助機関が行政庁の名において事実上決裁するものであり、法律の根拠を要する。","上級行政機関は、法律の根拠がなければ、下級行政機関に対して訓令・通達を発することができない。"],"itemOk":[true,true,false,false,false],"itemWhy":["正しい。委任では権限が受任機関に移り、受任機関の名で行使される。","正しい。委任には法律の根拠が必要。","誤り。代理では権限は移転しない。代理機関は被代理庁の代理であることを示して行使し、効果は被代理庁に帰属する。","誤り。専決（代決）は内部的な事務処理方式であり、法律の根拠は不要。","誤り。訓令・通達は上級機関の指揮監督権に基づくもので、個別の法律の根拠は不要（国家行政組織法14条2項参照）。"],"options":["ア・イ","ア・ウ","ア・エ","イ・エ","ウ・オ"],"answer":0},{"id":"q20","area":"総論：行政行為","topic":"行政行為の附款","basis":["学説（附款の限界・可分性）"],"tip":"","kind":"mc","format":"妥当なもの","stem":"行政行為の附款に関する次の記述のうち、\u003cb>妥当なもの\u003c/b>はどれか。","options":["負担に違反した場合、当該行政行為は当然に効力を失う。","条件とは、行政行為の効果を、将来発生することが確実な事実にかからせる附款である。","附款は本体たる行政行為と一体であるから、附款のみを対象とする取消訴訟は一切認められない。","撤回権の留保が付されていれば、行政庁は、公益上の必要性がなくても自由に撤回することができる。","附款は、法律が附款を付すことを認めている場合のほか、行政行為の内容の決定について行政庁に裁量が認められている場合にも、その裁量の範囲内で付すことができる。"],"why":["誤り。負担の不履行で当然に失効するわけではない。撤回の理由や強制執行の対象となり得る。","誤り。それは「期限」。条件は発生が不確実な事実にかからせるもの。","誤り。附款が本体と可分であれば、附款のみの取消しを求めることができると解されている。","誤り。撤回権が留保されていても、撤回には公益上の必要などの実質的理由が必要と解されている。","正しい。通説。附款は裁量の範囲内で、行政行為の目的に照らし必要な限度で付すことができる。"],"answer":4}]};
const FORM = {"action":"https://docs.google.com/forms/d/e/1FAIpQLSf2NzKJbnaql48Dd2k9GhM2BKyjMSCCrhNiJR8sUsGtXwd6DA/formResponse","fields":{"code":"896987813","question":"159852826","answer":"961523775","result":"1625749689"}};

/* ---------- storage ---------- */
const LS_KEY = "kd-"+SET.id+"-progress", DRAFT_KEY = "kd-"+SET.id+"-draft", SUM_KEY = "kd-sum-"+SET.id;

let memAnon=null;

  let k=null; try{ k=localStorage.getItem("kenpo-anon"); }catch(e){}
  if(!k){ k = memAnon || Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join(""); memAnon=k; try{ localStorage.setItem("kenpo-anon",k);}catch(e){} }
  return k;
}

function newRun(){
  let n=memRun; try{ n=parseInt(localStorage.getItem("kenpo-attempt")||"0",10)||0; }catch(e){}
  n++; memRun=n; try{ localStorage.setItem("kenpo-attempt", String(n)); }catch(e){}
  return n;
}
function examCode(){ return anonKey()+"-"+(state.run||1); }

/* ---------- Googleフォームへの自動送信 ---------- */
const formReady = !!(FORM.action && FORM.fields.code && FORM.fields.question && FORM.fields.answer && FORM.fields.result);
const mode = formReady ? "self" : "none";
function setChip(){
  const chip=document.getElementById("saveChip"), t=document.getElementById("saveChipText");
  chip.classList.remove("on","off");
  if(mode==="self"){ chip.classList.add("on"); t.textContent="自動送信オン"; } else { chip.classList.add("off"); t.textContent="自動送信オフ"; }

let chain = Promise.resolve();
function save(rec){ const p = chain.then(()=>doSave(rec)); chain = p.catch(()=>{}); return p; }
async function doSave(rec){
  if(mode!=="self") return false;
  const body = new URLSearchParams();
  body.append("entry."+FORM.fields.code, examCode());
  body.append("entry."+FORM.fields.question, rec.question);
  body.append("entry."+FORM.fields.answer, rec.answer);
  body.append("entry."+FORM.fields.result, rec.result);
  const attempt = ()=>fetch(FORM.action, {method:"POST", mode:"no-cors", body});
  try{ await attempt(); return true; }
  catch(e){ await new Promise(r=>setTimeout(r, 1000+Math.random()*1000)); try{ await attempt(); return true; }catch(e2){ return false; } }
}
function savedText(s){
  if(s==="ok") return "回答を送信しました";
  if(s==="fail") return "送信できませんでした。最後に「結果をコピー」で送ってください";
  if(s==="pending") return "送信中…";
  return "自動送信オフ：最後に「結果をコピー」で送ってください";
}
function qLabel(q,k){ return SET.code+"-Q"+String(k+1).padStart(2,"0")+" "+q.area+"/"+q.topic; }

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function renderStart(){
  const prev = lsGet(LS_KEY);
  const canResume = prev && prev.run && prev.i>=0 && prev.i<Q.length && Object.keys(prev.answers||{}).length>0;
  const nEssay = Q.length-MC.length;
  const areas = [...new Set(Q.map(q=>q.area))];
  main.innerHTML = `
    <section class="card" style="gap:14px">
      <p class="muted small">令和8年度 行政書士試験（11月8日）弱点診断</p>
      <h1>${esc(SET.title)}</h1>
      <p>${esc(SET.lead)}</p>
      <p class="muted small">5肢択一${MC.length}問${nEssay?`・記述${nEssay}問`:""}／目安${SET.minutes}分。出題分野：${esc(areas.join("・"))}</p>
      <p class="note">迷った問題も、勘で選ばずに「いちばん自信のある肢」を選んでください。最後に分野ごとの正答率と弱点が出ます。途中で閉じても、同じiPhoneのSafariなら「続きから」再開できます。${mode==="self"?"回答は1問ごとに自動で送信されます（お名前などは送りません）。":""}</p>
      <div class="row">
        ${canResume ? `<button class="btn" id="resume">続きから（第${prev.i+1}問）</button><button class="btn ghost" id="start">最初から</button>` : `<button class="btn" id="start">はじめる</button>`}
      </div>
    </section>`;
  document.getElementById("start").onclick=()=>{ state.run=newRun(); state.answers={}; state.i=0; persist(); render(); window.scrollTo(0,0); };
  if(canResume) document.getElementById("resume").onclick=()=>{ state.run=prev.run; state.answers=prev.answers; state.i=prev.i; render(); window.scrollTo(0,0); };
}
function head(q){
  return `<div class="qhead"><span class="qno">第${state.i+1}問</span><span class="tag">${esc(q.area)}</span><span class="tag">${esc(q.format)}</span></div>`;
}
function renderMC(q){
  const a = state.answers[q.id];
  const itemsHtml = q.items ? `<div class="items">${q.items.map((t,k)=>`<div><b>${KANA[k]}</b><span>${esc(t)}</span></div>`).join("")}</div>` : "";
  const opts = q.options.map((t,k)=>{
    let cls="opt";
    if(a){ if(k===q.answer) cls+=" is-right"; else if(k===a.choice) cls+=" is-wrong"; else cls+=" dim"; }
    return `<button class="${cls}" data-k="${k}" id="opt-${q.id}-${k}" ${a?"disabled":""}><span class="n">${k+1}</span><span>${esc(t)}</span></button>`;
  }).join("");
  main.innerHTML = `${head(q)}<p class="stem">${q.stem}</p>${itemsHtml}<div class="opts">${opts}</div><div id="after"></div>`;
  if(!a){ state.shownAt = Date.now(); main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(q, +b.dataset.k)); }
  else renderAfter(q, a);
}
function choose(q,k){
  const secs = Math.max(1, Math.round((Date.now()-state.shownAt)/1000));
  const rec = {choice:k, correct:k===q.answer, seconds:secs, saved: mode==="self"?"pending":"off"};
  state.answers[q.id]=rec; persist(); render();
  const after=document.getElementById("after"); if(after) after.scrollIntoView({behavior:"smooth",block:"start"});
  if(rec.saved==="pending"){
    save({question:qLabel(q,state.i), answer:"肢"+(k+1), result:(rec.correct?"○":"×")+" 正解肢"+(q.answer+1)+" "+secs+"秒"}).then(ok=>{
      rec.saved = ok?"ok":"fail"; persist();
      const el=document.getElementById("savenote-"+q.id); if(el) el.textContent=savedText(rec.saved);
    });
  }
}
function next(){ state.i++; persist(); render(); window.scrollTo(0,0); }
function renderAfter(q,a){
  const ok = a.correct;
  const whyHtml = q.items
    ? q.items.map((_,k)=>`<div><span class="mk ${q.itemOk[k]?"o":"x"}">${KANA[k]} ${q.itemOk[k]?"○":"×"}</span><span>${esc(q.itemWhy[k])}</span></div>`).join("")
    : q.why.map((t,k)=>`<div><span class="mk ${k===q.answer?"o":"x"}">肢${k+1}</span><span>${esc(t)}</span></div>`).join("");
  const isLast = state.i===Q.length-1;
  document.getElementById("after").innerHTML = `
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="verdict ${ok?"ok":"ng"}">
        <strong>${ok?"正解":"不正解"}　<span style="font-size:15px">正解は肢${q.answer+1}${ok?"":"（あなたの解答は肢"+(a.choice+1)+"）"}</span></strong>
        <span class="savenote" id="savenote-${q.id}">${savedText(a.saved)}</span>
      </div>
      <details open><summary>${q.items?"ア〜オの解説":"肢ごとの解説"}</summary><div class="why">${whyHtml}</div></details>
      ${q.basis&&q.basis.length?`<details><summary>根拠（条文・判例）</summary><ul class="basis">${q.basis.map(b=>`<li>${esc(b)}</li>`).join("")}</ul></details>`:""}
      ${q.tip?`<p class="tip"><b>解き方のコツ</b>　${esc(q.tip)}</p>`:""}
      <button class="btn" id="next">${isLast?"結果を見る":"次の問題へ"}</button>
    </div>`;
  document.getElementById("next").onclick=next;
}
function charLen(s){ return Array.from(s.replace(/\s/g,"")).length; }
function renderEssay(q){
  const a = state.answers[q.id];
  main.innerHTML = `${head(q)}<p class="stem">${q.stem}</p>
    <label for="essay" class="muted small">解答欄（目安は40〜45字。句読点も1字）</label>
    <textarea id="essay" placeholder="ここに解答を書いてください" ${a?"readonly":""}></textarea>
    <div class="count" id="count">0字</div>
    <div id="after"></div>`;
  const ta=document.getElementById("essay"), cnt=document.getElementById("count");
  const drafts = lsGet(DRAFT_KEY)||{};
  ta.value = a ? a.text : (drafts[q.id]||"");
  const upd=()=>{ const n=charLen(ta.value); cnt.textContent=n+"字"; cnt.classList.toggle("over", n>50); };
  upd();
  if(!a){
    state.shownAt = Date.now();
    ta.oninput=()=>{ upd(); const d=lsGet(DRAFT_KEY)||{}; d[q.id]=ta.value; lsSet(DRAFT_KEY,d); };
    document.getElementById("after").innerHTML = `<button class="btn" id="check">答え合わせをする</button>`;
    document.getElementById("check").onclick=()=>{
      const text=ta.value.trim();
      if(!text){ ta.focus(); cnt.textContent="解答を書いてから答え合わせをしてください"; return; }
      const secs=Math.max(1,Math.round((Date.now()-state.shownAt)/1000));
      const checks=q.elements.map(e=>e.kw.some(w=>text.includes(w)));
      state.answers[q.id]={text, checks, seconds:secs, graded:false, saved:"off"}; persist(); render();
    };
  } else renderEssayAfter(q,a);
}
function essayMax(q){ return q.elements.reduce((s,e)=>s+e.pts,0); }
function essayScore(q,checks){ return q.elements.reduce((s,e,k)=>s+(checks[k]?e.pts:0),0); }
function renderEssayAfter(q,a){
  const total=essayMax(q);
  const checksHtml = q.elements.map((e,k)=>`<label for="el-${q.id}-${k}"><input type="checkbox" id="el-${q.id}-${k}" ${a.checks[k]?"checked":""} ${a.graded?"disabled":""}><span>${esc(e.label)}</span><span class="pts">${e.pts}点</span></label>`).join("");
  const isLast = state.i===Q.length-1;
  document.getElementById("after").innerHTML = `
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="card"><p class="muted small">模範解答（${charLen(q.model)}字）</p><p class="model">${esc(q.model)}</p></div>
      <div class="card">
        <p><b>採点</b>　自分の解答に入っている要素にチェックしてください。キーワードから自動で仮チェックしています。</p>
        <div class="checks">${checksHtml}</div>
        <p class="score" id="escore">${essayScore(q,a.checks)}<small> / ${total}点</small></p>
        ${a.graded ? `<span class="savenote" id="savenote-${q.id}">${savedText(a.saved)}</span>` : `<button class="btn" id="grade">この採点で確定する</button>`}
      </div>
      <details open><summary>解説</summary><div class="why"><p>${esc(q.explain)}</p></div></details>
      ${q.basis&&q.basis.length?`<details><summary>根拠（条文・判例）</summary><ul class="basis">${q.basis.map(b=>`<li>${esc(b)}</li>`).join("")}</ul></details>`:""}
      ${q.tip?`<p class="tip"><b>メモ</b>　${esc(q.tip)}</p>`:""}
      ${a.graded ? `<button class="btn" id="next">${isLast?"結果を見る":"次の問題へ"}</button>` : ""}
    </div>`;
  if(!a.graded){
    q.elements.forEach((_,k)=>{ document.getElementById("el-"+q.id+"-"+k).onchange=ev=>{ a.checks[k]=ev.target.checked; persist(); document.getElementById("escore").firstChild.nodeValue=essayScore(q,a.checks); }; });
    document.getElementById("grade").onclick=()=>{
      a.graded=true; a.score=essayScore(q,a.checks); a.saved=mode==="self"?"pending":"off"; persist();
      const d=lsGet(DRAFT_KEY)||{}; delete d[q.id]; lsSet(DRAFT_KEY,d);
      render();
      if(a.saved==="pending"){
        save({question:qLabel(q,state.i), answer:a.text, result:"記述 "+a.score+"/"+total+"点 ["+q.elements.map((e,k)=>(a.checks[k]?"○":"×")).join("")+"] "+a.seconds+"秒"}).then(ok=>{
          a.saved=ok?"ok":"fail"; persist();
          const el=document.getElementById("savenote-"+q.id); if(el) el.textContent=savedText(a.saved);
        });
      }
    };
  } else document.getElementById("next").onclick=next;
}

/* ---------- results ---------- */
function fmtSec(s){ return s>=60 ? Math.floor(s/60)+"分"+String(s%60).padStart(2,"0")+"秒" : s+"秒"; }
function level(r){ return r<0.6 ? ["weak","要強化"] : r<0.8 ? ["mid","あと一歩"] : ["good","得点源"]; }
function areaStats(){
  const m=new Map();
  Q.forEach(q=>{
    const a=state.answers[q.id]; if(!a) return;
    if(!m.has(q.area)) m.set(q.area,{area:q.area,got:0,max:0});
    const s=m.get(q.area);
    if(q.kind==="essay"){ if(a.graded){ s.got+=a.score/essayMax(q); s.max+=1; } }
    else { s.max+=1; if(a.correct) s.got+=1; }
  });
  return [...m.values()].filter(s=>s.max>0).map(s=>({...s, rate:s.got/s.max})).sort((x,y)=>x.rate-y.rate);
}
function totals(){
  const mcOk=MC.filter(q=>state.answers[q.id]&&state.answers[q.id].correct).length;
  const es=Q.filter(q=>q.kind==="essay");
  const eGot=es.reduce((s,q)=>s+((state.answers[q.id]&&state.answers[q.id].graded)?state.answers[q.id].score:0),0);
  const eMax=es.reduce((s,q)=>s+essayMax(q),0);
  return {mcOk, eGot, eMax, es};
}
function summaryText(){
  const d=new Date(); const p=n=>String(n).padStart(2,"0");
  const stamp=`${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  const t=totals();
  const lines=[`【${SET.title} 結果】${stamp} 受験コード ${examCode()}`, `択一 ${t.mcOk}/${MC.length}問（${Math.round(t.mcOk/MC.length*100)}%）`+(t.es.length?` 記述 ${t.eGot}/${t.eMax}点`:"")];
  lines.push("■分野別");
  areaStats().forEach(s=>lines.push(`${s.area} ${Math.round(s.rate*100)}%（${level(s.rate)[1]}）`));
  lines.push("■各問");
  Q.forEach((q,k)=>{
    const a=state.answers[q.id];
    if(!a){ lines.push(`Q${k+1} 未解答 ${q.area}/${q.topic}`); return; }
    if(q.kind==="essay"){ lines.push(`Q${k+1} 記述 ${a.graded?a.score+"/"+essayMax(q)+"点":"未採点"} ${q.area}/${q.topic}`); lines.push(`  解答: ${a.text}`); }
    else lines.push(`Q${k+1} ${a.correct?"○":"×"} 肢${a.choice+1}（正解${q.answer+1}・${fmtSec(a.seconds)}） ${q.area}/${q.topic}`);
  });
  return lines.join("\n");
}
function renderResult(){
  const t=totals();
  const totalSec=Object.values(state.answers).reduce((s,a)=>s+(a.seconds||0),0);
  const anyFail = Object.values(state.answers).some(a=>a.saved==="fail"||a.saved==="off");
  const stats = areaStats();
  lsSet(SUM_KEY, {mcOk:t.mcOk, mcN:MC.length, eGot:t.eGot, eMax:t.eMax, at:Date.now(), weak:stats.filter(s=>s.rate<0.6).map(s=>s.area)});
  const areasHtml = stats.map(s=>{ const [cls,lab]=level(s.rate); const col = cls==="weak"?"var(--ng)":cls==="mid"?"var(--mid)":"var(--ok)";
    return `<div class="area"><span class="nm">${esc(s.area)}<span class="lv ${cls}">${lab}</span></span><span class="val">${Math.round(s.rate*100)}%（${Math.round(s.got*10)/10}/${s.max}）</span><span class="meter"><span style="width:${Math.max(3,Math.round(s.rate*100))}%;background:${col}"></span></span></div>`; }).join("");
  const missed = Q.filter(q=>{ const a=state.answers[q.id]; return a && (q.kind==="essay" ? (a.graded && a.score<essayMax(q)*0.6) : !a.correct); });
  const rows=Q.map((q,k)=>{
    const a=state.answers[q.id];
    if(!a) return `<tr><td>${k+1}</td><td>${esc(q.area)}</td><td>—</td><td>—</td></tr>`;
    if(q.kind==="essay") return `<tr><td>${k+1}</td><td>${esc(q.area)}</td><td>${a.graded?a.score+"/"+essayMax(q):"未採点"}</td><td>${fmtSec(a.seconds)}</td></tr>`;
    return `<tr><td>${k+1}</td><td>${esc(q.area)}</td><td class="${a.correct?"o":"x"}">${a.correct?"○":"×"} ${a.choice+1}</td><td>${fmtSec(a.seconds)}</td></tr>`;
  }).join("");
  main.innerHTML = `
    <div class="qhead"><h2>結果</h2><span class="tag">受験コード ${esc(examCode())}</span></div>
    <div class="card">
      <p class="muted small">5肢択一の正答率</p>
      <p class="score">${Math.round(t.mcOk/MC.length*100)}%<small>　${t.mcOk} / ${MC.length}問</small></p>
    </div>
    <div class="stats">
      <div><b>${t.es.length?t.eGot+"/"+t.eMax:"—"}</b><span>記述</span></div>
      <div><b>${t.mcOk*PT}</b><span>択一（${MC.length*PT}点中）</span></div>
      <div><b>${fmtSec(totalSec)}</b><span>合計時間</span></div>
    </div>
    <section class="card"><h2>分野別の正答率</h2><p class="note">60%未満は「要強化」、80%以上は「得点源」です。</p><div class="areas">${areasHtml}</div></section>
    ${missed.length?`<section class="card"><h2>復習する論点</h2><ul class="misslist">${missed.map(q=>`<li>第${Q.indexOf(q)+1}問　${esc(q.area)}／${esc(q.topic)}</li>`).join("")}</ul></section>`:""}
    <div class="tbl"><table><thead><tr><th>問</th><th>分野</th><th>結果</th><th>時間</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="card">
      <p><b>結果を送る</b></p>
      <p class="note">${mode!=="self" ? "下のボタンで結果をコピーし、LINEなどで送ってください。" : anyFail ? "一部の回答が自動送信されていません。下のボタンで結果をコピーし、LINEなどで送ってください。" : "回答は自動送信済みです。念のため、結果をコピーして送ることもできます。"}</p>
      <button class="btn${anyFail?"":" ghost"}" id="copy">結果をコピー</button>
      <p class="toast" id="toast"></p>
      <textarea id="copytext" class="copybox" readonly hidden></textarea>
    </div>
    <div class="row"><a class="btn" href="./">セット一覧へ</a><button class="btn ghost" id="again">最初から解き直す</button></div>`;
  document.getElementById("copy").onclick=async()=>{
    const tx=summaryText(), toast=document.getElementById("toast"), box=document.getElementById("copytext");
    try{ await navigator.clipboard.writeText(tx); toast.textContent="コピーしました。LINEなどに貼り付けて送ってください。"; box.hidden=true; }
    catch(err){ box.value=tx; box.hidden=false; box.focus(); box.select(); toast.textContent="自動でコピーできませんでした。下の文章を長押しして「すべてを選択」→「コピー」してください。"; }
  };
  document.getElementById("again").onclick=()=>{ state.run=newRun(); state.answers={}; state.i=0; persist(); render(); window.scrollTo(0,0); };
}
document.getElementById("setName").textContent = SET.title;
setChip();
render();
</script>
