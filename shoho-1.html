<script>window.SET = {"id":"shoho-1","code":"商法基礎法学","title":"商法・会社法・基礎法学","lead":"商法総則・商行為と会社法（設立・株式・機関・計算・組織再編）、基礎法学（法の解釈・効力・裁判制度・法令用語）を確認します。","minutes":40,"questions":[{"id":"q01","area":"商法総則・商行為","topic":"商行為の特則","basis":["商法504条・511条・512条・521条","民法404条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"商行為に関する次の記述のうち、商法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["数人の者がその一人又は全員のために商行為となる行為によって債務を負担したときは、その債務は各自が分割して負担する。","商行為によって生じた債務の法定利率は、年6分である。","商行為の代理人が本人のためにすることを示さないでこれをした場合であっても、その行為は、本人に対してその効力を生ずる。","商人がその営業の範囲内において他人のために行為をしたときでも、報酬の約束がなければ相当な報酬を請求することはできない。","商人間の留置権は、当事者の別段の意思表示によっても排除することができない。"],"why":["誤り。連帯債務となる（511条1項）。","誤り。平成29年の民法改正にあわせて商事法定利率は廃止され、民法の法定利率（404条）による。","正しい。商法504条本文。","誤り。相当な報酬を請求できる（512条）。","誤り。別段の意思表示があれば排除できる（521条ただし書）。"],"answer":2},{"id":"q02","area":"商法総則・商行為","topic":"商業登記・名板貸し・営業譲渡","basis":["商法9条・14条・17条・21条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"商法総則に関する次の記述のうち、商法の規定および判例に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["営業を譲り受けた商人が譲渡人の商号を引き続き使用する場合には、その譲受人も、譲渡人の営業によって生じた債務を弁済する責任を負う。","商法の規定により登記すべき事項は、登記の後でなければ、これをもって善意の第三者に対抗することができない。","故意又は過失によって不実の事項を登記した者は、その事項が不実であることをもって善意の第三者に対抗することができない。","支配人は、商人に代わってその営業に関する一切の裁判上又は裁判外の行為をする権限を有する。","自己の商号を使用して営業を行うことを他人に許諾した商人は、自らが営業を行うものと誤認して取引をした者に対し、その者に誤認について重大な過失があった場合でも責任を負う。"],"why":["正しい。17条1項。","正しい。9条1項前段。","正しい。9条2項。","正しい。21条1項。","誤り（これが正解）。名板貸人の責任（14条）について、判例は誤認につき重大な過失がある相手方は保護されないとする。"],"answer":4},{"id":"q03","area":"会社法（設立・株式）","topic":"設立","basis":["会社法25条・30条・33条・49条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"株式会社の設立に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["株式会社は、定款の認証を受けた時に成立する。","株式会社の設立に際して、各発起人は、設立時発行株式を1株以上引き受けなければならない。","募集設立においては、発起人は設立時発行株式を引き受ける必要はない。","定款は、公証人の認証を受けなくても、その効力を生ずる。","現物出資について、検査役の調査は、いかなる場合にも省略することができない。"],"why":["誤り。本店の所在地において設立の登記をすることによって成立する（49条）。","正しい。25条2項（発起設立・募集設立とも）。","誤り。募集設立でも各発起人は1株以上引き受ける（25条2項）。","誤り。公証人の認証を受けなければ効力を生じない（30条1項）。","誤り。少額（総額500万円以下）の場合などは省略できる（33条10項）。"],"answer":1},{"id":"q04","area":"会社法（設立・株式）","topic":"株式","basis":["会社法107条・126条・127条・188条・453条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"株式に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["株主に対してする通知は、株主名簿に記載された株主の住所にあてて発すれば足りる。","株主は、その有する株式を譲渡することができる。","株式会社は、その発行する全部の株式の内容として、譲渡による取得について株式会社の承認を要することを定款で定めることができる。","株式会社は、自己株式についても剰余金の配当をすることができる。","単元株式数は、1000及び発行済株式の総数の200分の1に当たる数を超えることはできない。"],"why":["正しい。126条1項。","正しい。127条（株式譲渡自由の原則）。","正しい。107条1項1号（譲渡制限株式）。","誤り（これが正解）。自己株式に剰余金の配当はできない（453条括弧書）。","正しい。188条2項・会社法施行規則34条。"],"answer":3},{"id":"q05","area":"会社法（機関）","topic":"株主総会","basis":["会社法295条・299条・309条・310条・831条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"株主総会に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["株主総会の特別決議は、出席した株主の議決権の過半数で成立する。","株主総会の決議の取消しの訴えは、決議の日から6か月以内に提起しなければならない。","取締役会設置会社においては、株主総会は、会社法に規定する事項及び定款で定めた事項に限り、決議をすることができる。","株主は、議決権を代理人によって行使することはできない。","公開会社の株主総会の招集通知は、総会の日の1週間前までに発すれば足りる。"],"why":["誤り。原則として出席株主の議決権の3分の2以上の多数が必要（309条2項）。","誤り。3か月以内（831条1項）。","正しい。295条2項。","誤り。代理人によって行使できる（310条1項）。","誤り。2週間前まで（299条1項）。"],"answer":2},{"id":"q06","area":"会社法（機関）","topic":"取締役・取締役会","basis":["会社法331条・339条・356条・365条・369条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"取締役および取締役会に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["取締役会設置会社において、取締役が自己のために株式会社と取引をしようとするときは、株主総会の承認を受けなければならない。","取締役会設置会社においては、取締役は3人以上でなければならない。","公開会社でない株式会社においては、取締役が株主でなければならない旨を定款で定めることができる。","取締役会の決議は、議決に加わることができる取締役の過半数が出席し、その過半数をもって行う。","取締役は、いつでも、株主総会の決議によって解任することができる。"],"why":["誤り（これが正解）。取締役会設置会社では取締役会の承認（365条1項）。","正しい。331条5項。","正しい。331条2項ただし書。","正しい。369条1項。","正しい。339条1項。"],"answer":0},{"id":"q07","area":"会社法（機関）","topic":"役員等の責任","basis":["会社法381条・423条・424条・429条・847条"],"tip":"","kind":"mc","format":"組合せ","stem":"役員等の責任に関する次の記述ア〜オのうち、会社法の規定に照らし、\u003cb>妥当なものの組合せ\u003c/b>はどれか。","items":["取締役は、その任務を怠ったときは、株式会社に対し、これによって生じた損害を賠償する責任を負う。","役員等がその職務を行うについて悪意又は重大な過失があったときは、これによって第三者に生じた損害を賠償する責任を負う。","役員等の株式会社に対する損害賠償責任は、総株主の同意がなくても、取締役会の決議のみで全部免除することができる。","株主代表訴訟は、株式を1株でも有していれば、保有期間や会社への提訴請求の有無にかかわらず、直ちに提起することができる。","監査役は、取締役と同様に、株式会社の業務執行を行う権限を有する。"],"itemOk":[true,true,false,false,false],"itemWhy":["正しい。423条1項。","正しい。429条1項。","誤り。全部免除には総株主の同意が必要（424条）。","誤り。公開会社では6か月前から引き続き株式を有する株主が、まず会社に提訴請求をする必要がある（847条）。","誤り。監査役は取締役の職務執行を監査する機関で、業務執行権はない（381条1項）。"],"options":["ア・イ","ア・ウ","イ・エ","イ・オ","ウ・エ"],"answer":0},{"id":"q08","area":"会社法（機関）","topic":"機関設計","basis":["会社法326条〜328条・333条・335条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"株式会社の機関設計に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["すべての株式会社は、取締役会を置かなければならない。","監査役は、株式会社若しくはその子会社の取締役若しくは支配人その他の使用人を兼ねることができる。","会計参与には、公認会計士・監査法人のみがなることができ、税理士はなることができない。","指名委員会等設置会社は、監査役を置かなければならない。","公開会社である大会社（監査等委員会設置会社及び指名委員会等設置会社を除く。）は、監査役会及び会計監査人を置かなければならない。"],"why":["誤り。公開会社等を除き任意（327条1項・326条2項）。","誤り。兼任禁止（335条2項）。","誤り。税理士・税理士法人もなれる（333条1項）。","誤り。監査役を置いてはならない（327条4項）。","正しい。328条1項。"],"answer":4},{"id":"q09","area":"会社法（計算・再編）","topic":"募集株式の発行","basis":["会社法2条21号・199条・201条・210条・828条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"募集株式の発行等に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["株式の発行が法令・定款に違反し又は著しく不公正な方法により行われる場合において、株主が不利益を受けるおそれがあるときは、株主はその発行をやめることを請求することができる。","公開会社において、払込金額が引受人に特に有利な金額である場合でも、取締役会の決議のみで募集事項を決定することができる。","公開会社が取締役会の決議で募集事項を定めた場合には、払込期日の2週間前までに、株主に対し募集事項を通知又は公告しなければならない。","新株予約権とは、株式会社に対して行使することにより、当該株式会社の株式の交付を受けることができる権利をいう。","公開会社における新株発行の無効の訴えは、株式の発行の効力が生じた日から6か月以内に提起しなければならない。"],"why":["正しい。210条。","誤り（これが正解）。有利発行には株主総会の特別決議が必要（201条1項・199条3項・309条2項5号）。","正しい。201条3項・4項。","正しい。2条21号。","正しい。828条1項2号（非公開会社は1年）。"],"answer":1},{"id":"q10","area":"会社法（計算・再編）","topic":"剰余金の配当","basis":["会社法445条・454条・458条・459条・462条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"剰余金の配当に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["分配可能額を超えて剰余金の配当がされた場合でも、配当を受けた株主は会社に対して金銭等を返還する義務を負わない。","剰余金の配当は、いかなる場合も取締役会の決議ですることはできない。","株式会社の純資産額が300万円を下回る場合でも、剰余金の配当をすることができる。","株式会社は、金銭以外の財産を配当することは一切できない。","剰余金の配当をする場合には、配当により減少する剰余金の額の10分の1を、準備金の額が資本金の4分の1に達するまで、資本準備金又は利益準備金として計上しなければならない。"],"why":["誤り。返還義務を負う（462条1項）。","誤り。中間配当（454条5項）や会計監査人設置会社の特則（459条）がある。","誤り。配当できない（458条）。","誤り。現物配当も可能（454条4項）。","正しい。445条4項・会社計算規則22条。"],"answer":4},{"id":"q11","area":"会社法（計算・再編）","topic":"合併・会社分割","basis":["会社法748条・754条・789条・796条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"組織再編に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["新設合併の効力は、合併契約で定めた効力発生日に生ずる。","株式会社は、合名会社と合併することはできない。","吸収合併をする場合、消滅会社の債権者は、消滅会社に対し、吸収合併について異議を述べることができる。","簡易合併の要件を満たす場合でも、存続会社の株主総会の特別決議を省略することはできない。","吸収分割においては、分割会社の債権者が異議を述べることは一切できない。"],"why":["誤り。新設合併は新設会社の成立の日（設立の登記の日）に効力を生ずる（754条1項・49条）。","誤り。会社は他の会社と合併することができる（748条）。","正しい。789条1項1号。","誤り。簡易合併では存続会社の株主総会決議を省略できる（796条2項）。","誤り。分割後に分割会社に履行を請求できなくなる債権者等は異議を述べることができる（789条1項2号）。"],"answer":2},{"id":"q12","area":"会社法（設立・株式）","topic":"株主の権利","basis":["会社法125条・189条・303条・308条・433条"],"tip":"","kind":"mc","format":"個数","stem":"株主の権利に関する次の記述ア〜オのうち、会社法の規定に照らし、\u003cb>妥当なものはいくつ\u003c/b>あるか。","items":["公開会社である取締役会設置会社では、総株主の議決権の100分の1以上又は300個以上の議決権を6か月前から引き続き有する株主は、議題の提案をすることができる。","株主は、株式会社の営業時間内は、いつでも、請求の理由を明らかにして、株主名簿の閲覧又は謄写の請求をすることができる。","総株主の議決権の100分の3以上の議決権を有する株主は、会計帳簿の閲覧又は謄写の請求をすることができる。","単元未満株主は、定款の定めによっても、残余財産の分配を受ける権利を制限されることはない。","株主総会における議決権は1株につき1個であり、株式会社が単元株式数を定款で定めている場合も同様である。"],"itemOk":[true,true,true,true,false],"itemWhy":["正しい。303条2項。","正しい。125条2項。","正しい。433条1項。","正しい。189条2項5号。","誤り。単元株式数を定めた場合は1単元につき1個（308条1項ただし書）。"],"options":["一つ","二つ","三つ","四つ","五つ"],"answer":3},{"id":"q13","area":"会社法（機関）","topic":"代表取締役","basis":["会社法349条・350条・354条・362条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"代表取締役に関する次の記述のうち、会社法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["株式会社は、代表取締役その他の代表者がその職務を行うについて第三者に加えた損害を賠償する責任を負う。","代表取締役は、いかなる場合も重要な財産の処分を単独で決定することができる。","表見代表取締役の規定により会社が責任を負うのは、第三者が悪意であっても同様である。","取締役会設置会社において、代表取締役は株主総会の決議で選定しなければならない。","代表取締役の権限に加えた制限は、善意の第三者にも対抗することができる。"],"why":["正しい。350条。","誤り。重要な財産の処分は取締役会の決議事項（362条4項1号）。","誤り。善意の第三者に対して責任を負う（354条）。","誤り。取締役会が選定する（362条3項）。","誤り。善意の第三者に対抗できない（349条5項）。"],"answer":0},{"id":"q14","area":"基礎法学","topic":"法の解釈","basis":["基礎法学（法解釈の方法）"],"tip":"","kind":"mc","format":"妥当なもの","stem":"法の解釈に関する次の記述のうち、\u003cb>妥当なもの\u003c/b>はどれか。","options":["文理解釈とは、法の目的や趣旨を重視して解釈する方法をいう。","類推解釈とは、ある事項について直接規定した法規がない場合に、類似の性質を有する事項について定めた法規を適用することをいう。","縮小解釈とは、ある規定が定める要件に該当しない事項について、その規定と反対の効果を導く解釈をいう。","刑法においては、被告人に不利益な類推解釈も広く許される。","反対解釈とは、法文の言葉の意味を通常の意味よりも広げて解釈することをいう。"],"why":["誤り。それは目的論的解釈。文理解釈は法文の文言・文法に従った解釈。","正しい。","誤り。それは反対解釈。縮小解釈は法文の意味を通常より狭く解釈すること。","誤り。罪刑法定主義から、被告人に不利益な類推解釈は禁止される。","誤り。それは拡張解釈。反対解釈は、規定のない事項について規定と反対の結論を導く解釈。"],"answer":1},{"id":"q15","area":"基礎法学","topic":"法の効力・適用","basis":["法の適用に関する通則法2条","憲法39条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"法の効力および適用に関する次の記述のうち、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["刑罰法規については、事後法の禁止の原則が妥当する。","法律は、別段の定めがない限り、公布の日から起算して20日を経過した日から施行する。","特別法は一般法に優先する。","「後法は前法を破る」の原則により、後に制定された一般法は、先に制定された特別法に優先する。","法令の効力は、原則として、その法令を制定した国の領域内のすべての人に及ぶ。"],"why":["正しい。憲法39条。","正しい。法の適用に関する通則法2条。","正しい。特別法優先の原則。","誤り（これが正解）。後法の一般法は前法の特別法を破らない。特別法優先の原則が優先する。","正しい。属地主義。"],"answer":3},{"id":"q16","area":"基礎法学","topic":"裁判制度","basis":["裁判所法31条の3・33条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"わが国の裁判制度に関する次の記述のうち、\u003cb>妥当なもの\u003c/b>はどれか。","options":["第一審判決に対する上訴を上告という。","簡易裁判所は、訴訟の目的の価額が140万円を超えない請求に関する民事訴訟について、第一審の裁判権を有する。","裁判員制度は、民事訴訟及び刑事訴訟の双方に適用される。","上告審は事実審であり、新たな証拠調べを行うのが原則である。","家庭裁判所は、少年保護事件については審判権を有するが、家事事件については審判権を有しない。"],"why":["誤り。第一審判決に対する上訴は控訴。","正しい。裁判所法33条1項1号。","誤り。一定の重大な刑事事件のみ。","誤り。上告審は原則として法律審。","誤り。家事事件の審判・調停も扱う（裁判所法31条の3）。"],"answer":1},{"id":"q17","area":"基礎法学","topic":"法令用語","basis":["基礎法学（法令用語）"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"法令用語に関する次の記述のうち、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["「みなす」とは、反対の証拠があれば覆すことができる事実の推定をいう。","「善意」とは、ある事実を知らないことをいう。","「及び」と「並びに」はいずれも併合的接続詞であり、接続が段階的になる場合、小さい接続に「及び」、大きい接続に「並びに」を用いる。","「又は」と「若しくは」はいずれも選択的接続詞であり、段階がある場合、大きい選択に「又は」、小さい選択に「若しくは」を用いる。","「以上」「以下」は、基準となる数値を含む。"],"why":["誤り（これが正解）。それは「推定する」。「みなす」は反証を許さず、法律上同一に扱う。","正しい。道徳的な善悪とは関係がない。","正しい。","正しい。","正しい。「超える」「未満」は含まない。"],"answer":0},{"id":"q18","area":"基礎法学","topic":"法源・期間の計算","basis":["民法139条〜143条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"法源および期間の計算に関する次の記述のうち、\u003cb>妥当なもの\u003c/b>はどれか。","options":["判例は、日本では成文法として法源に当たる。","期間の末日が日曜日に当たる場合、その日に取引をしない慣習があっても、期間は前日に満了する。","時間によって期間を定めたときは、その期間は翌日から起算する。","日、週、月又は年によって期間を定めたときは、期間の初日は算入しないが、その期間が午前零時から始まるときは、この限りでない。","週、月又は年によって期間を定めたときは、その期間は日に換算して計算する。"],"why":["誤り。判例は成文法ではない（事実上の拘束力にとどまるとされる）。","誤り。その日に取引をしない慣習がある場合に限り、翌日に満了する（民法142条）。","誤り。即時から起算する（民法139条）。","正しい。民法140条（初日不算入の原則）。","誤り。暦に従って計算する（民法143条1項）。"],"answer":3}]};
