<script>window.SET = {"id":"gyosei-rev","code":"行政法復習","title":"行政法 誤答の解き直し（19問）","lead":"行政法①〜③で間違えた19問だけを、肢の順番を入れ替えて出題します。解説の「根拠」まで読んで、なぜその肢が誤りかを言えるようにしてください。","minutes":30,"questions":[{"id":"q01","area":"総論：実効性確保・調査","topic":"行政調査","basis":["最大判昭47.11.22（川崎民商事件）","最判昭53.6.20（所持品検査）","最決昭55.9.22（自動車検問）","最決平16.1.20"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"行政調査に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["法人税法上の質問検査権の行使によって取得収集された資料が後に犯則事件の証拠として利用されることが想定できたとしても、直ちに質問検査権が犯則調査の手段として行使されたことにはならない。","憲法35条1項の規定は、刑事責任追及の手続でないとの理由のみで、その手続における一切の強制が当然に保障の枠外にあると判断することは相当でない。","税務調査における質問検査は、刑事責任追及のための資料の取得収集に直接結びつく作用を一般的に有するから、憲法35条・38条の保障が全面的に及び、令状なしに行うことはできない。","警察官は、職務質問に附随して、捜索に至らない程度の所持品検査を、強制にわたらない限り、必要性・緊急性等を考慮し具体的状況のもとで相当と認められる限度で行うことができる場合がある。","自動車の一斉検問は、相手方の任意の協力を求める形で、運転者等の自由を不当に制約しない方法・態様で行われる限り、適法である。"],"why":["正しい。最決平16.1.20。","正しい。同じく川崎民商事件の判示。","誤り（これが正解）。川崎民商事件（最大判昭47.11.22）は、税務調査は刑事責任追及の資料収集に直接結びつく作用を一般的に有するものではなく、令状を要しないとした。","正しい。米子銀行強盗事件（最判昭53.6.20）。","正しい。最決昭55.9.22。"],"answer":2},{"id":"q02","area":"行手法：総則・処分","topic":"定義と適用除外","basis":["行政手続法2条6号・8号、3条1項・3項"],"tip":"地方公共団体の「処分・届出」は根拠が条例・規則なら除外、「行政指導」は根拠を問わず除外。この違いが頻出。","kind":"mc","format":"妥当なもの","stem":"行政手続法の定義および適用除外に関する次の記述のうち、行政手続法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["「行政指導」とは、行政機関がその任務又は所掌事務の範囲内において一定の行政目的を実現するため特定の者に一定の作為又は不作為を求める指導、勧告、助言その他の行為であって処分に該当しないものをいう。","国会の両院若しくは一院又は議会の議決によってされる処分にも、行政手続法の規定が適用される。","「命令等」には、法律に基づく命令、審査基準、処分基準及び行政指導指針が含まれるが、規則は含まれない。","地方公共団体の機関がする行政指導には、その根拠が法律に置かれている場合には、行政手続法の行政指導の規定が適用される。","地方公共団体の機関がする処分は、その根拠となる規定が条例に置かれているものであっても、行政手続法の申請に対する処分・不利益処分の規定が適用される。"],"why":["正しい。行政手続法2条6号。","誤り。議会の議決による処分は適用除外（3条1項1号）。","誤り。「命令等」には規則も含まれる（2条8号）。","誤り。地方公共団体の機関がする行政指導は、根拠が法律か条例かを問わず適用除外（3条3項）。","誤り。条例・規則に根拠がある処分は適用除外（3条3項）。地方は自ら手続条例を定める。"],"answer":0},{"id":"q03","area":"行手法：総則・処分","topic":"申請に対する処分","basis":["行政手続法5条〜8条・10条"],"tip":"審査基準＝法的義務、標準処理期間・処分基準＝努力義務。行手法の「〜しなければならない／努めなければならない」の区別は毎年のように問われる。","kind":"mc","format":"妥当なもの","stem":"申請に対する処分に関する次の記述のうち、行政手続法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["行政庁は、申請者以外の者の利害を考慮すべきことが法令において許認可等の要件とされているものを行う場合には、必ず公聴会を開催しなければならない。","行政庁は、申請がその事務所に到達したときは遅滞なく審査を開始しなければならず、形式上の要件に適合しない申請については、速やかに補正を求めるか、許認可等を拒否しなければならない。","審査基準は、行政上特別の支障があるときを除き、公にしておくよう努めなければならない。","標準処理期間を定めた場合、行政庁はその期間内に処分をしなければならない法的義務を負う。","申請により求められた許認可等を拒否する処分をする場合、行政庁は、申請者から求めがあったときに限り、その理由を示せば足りる。"],"why":["誤り。公聴会の開催は努力義務（10条）。","正しい。7条。","誤り。審査基準は「定めるものとする」「公にしておかなければならない」（5条1項・3項）。努力義務ではない。","誤り。標準処理期間は定めるよう努める（努力義務）もので、定めたときは公にしておかなければならない（6条）。期間内に処分する義務を定めたものではない。","誤り。拒否処分をする場合は、原則として同時に理由を示さなければならない（8条1項）。"],"answer":1},{"id":"q04","area":"行手法：総則・処分","topic":"不利益処分","basis":["行政手続法12条〜14条・29条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"不利益処分に関する次の記述のうち、行政手続法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["弁明の機会の付与は、弁明書を提出してするのが原則であり、行政庁が口頭ですることを認めたときは口頭でもすることができる。","不利益処分をする場合には、原則として、その名あて人に対し、同時に当該不利益処分の理由を示さなければならない。","処分基準を定めることは法的義務であり、行政庁は処分基準を必ず定め、これを公にしておかなければならない。","公益上、緊急に不利益処分をする必要があるため意見陳述のための手続を執ることができないときは、聴聞・弁明の機会の付与の手続を執らないことができる。","許認可等を取り消す不利益処分をしようとするときは、原則として聴聞の手続を執らなければならない。"],"why":["正しい。29条1項。","正しい。14条1項。","誤り（これが正解）。処分基準は、定め、かつ公にしておくよう「努めなければならない」（12条1項）。","正しい。13条2項1号。","正しい。13条1項1号イ。"],"answer":2},{"id":"q05","area":"行手法：総則・処分","topic":"理由の提示","basis":["最判平23.6.7（一級建築士免許取消）","最判昭60.1.22（旅券発給拒否）","最判昭47.12.5","行政手続法8条・14条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"処分の理由の提示に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["青色申告に対する更正処分の理由付記の不備は、後日の審査裁決で理由が明らかにされれば治癒されるとするのが判例である。","行政手続法は、申請に対する拒否処分を書面でするときでも、理由を書面で示すことまでは求めていない。","理由提示の瑕疵は、処分の内容が適法である限り、処分の取消事由とはならないとするのが判例である。","旅券発給拒否処分の通知書に根拠法条を示しておけば、申請者がその拒否理由を知り得る以上、理由付記として十分であるとした判例がある。","処分基準が公にされている場合の免許取消処分では、根拠法条だけでなく処分基準の適用関係まで示されなければ、原則として理由提示として不十分であるとした判例がある。"],"why":["誤り。最判昭47.12.5は、後日の裁決で理由が明らかにされても治癒されないとした。","誤り。処分を書面でするときは、理由も書面で示さなければならない（8条2項）。","誤り。理由付記の不備は処分の取消事由となる。","誤り。最判昭60.1.22は、根拠規定を示すだけでは不十分とした。","正しい。一級建築士免許取消処分事件（最判平23.6.7）。"],"answer":4},{"id":"q06","area":"行審法：要件・教示","topic":"審査請求期間","basis":["行政不服審査法5条・6条・18条"],"tip":"審査請求は「知った日から3か月・処分の日から1年」、取消訴訟は「知った日から6か月・処分の日から1年」。数字の入れ替えに注意。","kind":"mc","format":"妥当でないもの","stem":"不服申立ての期間および種類に関する次の記述のうち、行政不服審査法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["処分についての審査請求は、処分があったことを知った日の翌日から起算して6か月を経過したときは、正当な理由があってもすることができない。","不作為についての審査請求には、審査請求期間の制限がない。","再審査請求は、原裁決又は当該処分を対象としてすることができる。","再調査の請求をしたときは、原則として、当該再調査の請求についての決定を経た後でなければ、審査請求をすることができない。","処分についての審査請求は、処分があった日の翌日から起算して1年を経過したときは、正当な理由がある場合を除き、することができない。"],"why":["誤り（これが正解）。主観的審査請求期間は3か月で、正当な理由があるときはこの限りでない（18条1項）。","正しい。不作為が続く限り審査請求できる。","正しい。6条2項。","正しい。5条2項。","正しい。18条2項。"],"answer":0},{"id":"q07","area":"行審法：審理・裁決","topic":"審理員","basis":["行政不服審査法9条・31条・42条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"審理員に関する次の記述のうち、行政不服審査法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["審査請求人は、審理員に対し、口頭で意見を述べる機会を与えるよう申し立てることはできない。","審理員は、審理手続を終結したときは、遅滞なく審理員意見書を作成し、速やかに処分庁に提出しなければならない。","審理員には、審査請求に係る処分に関与した者もなることができる。","審査請求がされた行政庁は、原則として、審査庁に所属する職員のうちから審理手続を行う者（審理員）を指名し、その旨を審査請求人及び処分庁等に通知しなければならない。","条例に基づく処分について条例に特別の定めがある場合でも、審理員による審理手続を省略することはできない。"],"why":["誤り。口頭意見陳述の申立てができる（31条1項）。","誤り。審理員意見書は審査庁に提出する（42条2項）。","誤り。処分に関与した者等は審理員になれない（9条2項1号）。","正しい。9条1項。","誤り。委員会等が審査庁である場合、条例に基づく処分について条例に特別の定めがある場合などは、審理員の指名を要しない（9条1項ただし書）。"],"answer":3},{"id":"q08","area":"行審法：審理・裁決","topic":"裁決","basis":["行政不服審査法45条〜48条"],"tip":"","kind":"mc","format":"個数","stem":"審査請求に対する裁決に関する次の記述ア〜オのうち、行政不服審査法の規定に照らし、\u003cb>妥当なものはいくつ\u003c/b>あるか。","items":["審査庁は、審査請求人の不利益に当該処分を変更することができる。","処分庁の上級行政庁でも処分庁でもない審査庁であっても、裁決で処分を変更することができる。","処分が違法又は不当ではあるが、これを取り消すことにより公の利益に著しい障害を生ずる場合には、一定の要件の下で、審査庁は裁決で審査請求を棄却することができる。","事実上の行為についての審査請求に理由がある場合、処分庁以外の審査庁は、裁決で当該事実上の行為が違法又は不当である旨を宣言するとともに、自ら当該事実上の行為の全部又は一部を撤廃する。","処分（事実上の行為を除く。）についての審査請求に理由がある場合、処分庁の上級行政庁である審査庁は、裁決で当該処分の全部若しくは一部を取り消し、又はこれを変更することができる。"],"itemOk":[false,false,true,false,true],"itemWhy":["誤り。不利益変更は禁止されている（48条）。","誤り。処分庁の上級行政庁又は処分庁のいずれでもない審査庁は、処分を取り消すことはできるが、変更することはできない（46条1項ただし書）。","正しい。事情裁決（45条3項）。この場合、裁決の主文で違法又は不当を宣言する。","誤り。処分庁以外の審査庁は、自ら撤廃するのではなく、処分庁に対し撤廃・変更すべき旨を「命ずる」（47条1号）。自ら撤廃・変更するのは処分庁である審査庁（同条2号）。","正しい。46条1項本文。"],"options":["一つ","二つ","三つ","四つ","五つ"],"answer":1},{"id":"q09","area":"行審法：審理・裁決","topic":"行政不服審査会への諮問","basis":["行政不服審査法43条・44条・81条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"行政不服審査会等への諮問に関する次の記述のうち、行政不服審査法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["審査請求人から行政不服審査会等への諮問を希望しない旨の申出がされている場合（参加人から反対する旨の申出がされている場合を除く。）には、諮問を要しない。","審査請求が不適法であり却下する場合には、行政不服審査会等への諮問を要しない。","審査庁が主任の大臣である場合、審理員意見書の提出を受けたときは、例外なく行政不服審査会に諮問しなければならない。","地方公共団体には、執行機関の附属機関として、行政不服審査会と同様の機関が置かれる。","審査庁は、行政不服審査会等から諮問に対する答申を受けたときは、遅滞なく、裁決をしなければならない。"],"why":["正しい。43条1項4号。","正しい。43条1項6号。","誤り（これが正解）。43条1項各号に諮問不要の場合が定められている。","正しい。81条1項。","正しい。44条。"],"answer":2},{"id":"q10","area":"行訴法：訴訟要件","topic":"訴えの利益","basis":["最判昭59.10.26","最判昭55.11.25","最判平4.1.24","最判平14.2.28","最判平21.2.27"],"tip":"","kind":"mc","format":"妥当なもの","stem":"取消訴訟の訴えの利益に関する次の記述のうち、最高裁判所の判例に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["優良運転者である旨の記載のない免許証を交付されて更新処分を受けた者は、更新処分の取消しを求める訴えの利益を有しない。","公文書非公開決定の取消訴訟において、当該公文書が書証として裁判所に提出された場合には、訴えの利益は失われる。","土地改良事業の施行認可処分の取消訴訟は、事業が完了して原状回復が社会通念上不可能になった場合には、訴えの利益を失う。","建築確認の取消訴訟は、建築工事が完了した場合には訴えの利益を失う。","運転免許停止処分の期間が経過し、無違反・無処分で1年を経過した後でも、名誉・信用の回復のため停止処分の取消しを求める訴えの利益が認められる。"],"why":["誤り。最判平21.2.27は訴えの利益を認めた。","誤り。最判平14.2.28は訴えの利益は失われないとした。","誤り。最判平4.1.24は訴えの利益は失われないとした（事情判決の問題となる）。","正しい。最判昭59.10.26。","誤り。最判昭55.11.25は訴えの利益を否定した。"],"answer":3},{"id":"q11","area":"行訴法：仮の救済・判決","topic":"執行停止・内閣総理大臣の異議","basis":["行政事件訴訟法25条・27条"],"tip":"内閣総理大臣の異議は行訴法だけの制度。行審法にはない。","kind":"mc","format":"妥当でないもの","stem":"執行停止に関する次の記述のうち、行政事件訴訟法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["執行停止の決定がされた後に内閣総理大臣の異議が述べられた場合でも、裁判所は執行停止の決定を取り消す必要はない。","執行停止は、本案について理由がないとみえるときは、することができない。","処分の取消しの訴えの提起は、処分の効力、処分の執行又は手続の続行を妨げない。","内閣総理大臣は、執行停止の申立てがあった場合には、執行停止の決定の前後を問わず、裁判所に対し異議を述べることができる。","内閣総理大臣は、やむをえない場合でなければ異議を述べてはならず、異議を述べたときは、次の常会において国会にこれを報告しなければならない。"],"why":["誤り（これが正解）。決定後に異議があったときは、裁判所は決定を取り消さなければならない（27条4項）。","正しい。25条4項。","正しい。執行不停止原則（25条1項）。","正しい。27条1項。","正しい。27条6項。"],"answer":0},{"id":"q12","area":"行訴法：取消訴訟以外","topic":"当事者訴訟・民衆訴訟・機関訴訟","basis":["行政事件訴訟法4条・5条・6条・42条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"行政事件訴訟の類型に関する次の記述のうち、行政事件訴訟法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["地方自治法上の住民訴訟は、機関訴訟の典型例である。","実質的当事者訴訟には、公法上の法律関係に関する確認の訴えは含まれない。","公職選挙法上の選挙無効訴訟は、機関訴訟に当たる。","当事者間の法律関係を確認し又は形成する処分に関する訴訟で、法令の規定によりその法律関係の当事者の一方を被告とするものは、民衆訴訟である。","民衆訴訟及び機関訴訟は、法律に定める場合において、法律に定める者に限り、提起することができる。"],"why":["誤り。住民訴訟は民衆訴訟。","誤り。4条後段は「公法上の法律関係に関する確認の訴え」を明記している。","誤り。選挙無効訴訟も民衆訴訟。","誤り。それは形式的当事者訴訟（4条前段）。","正しい。42条。"],"answer":4},{"id":"q13","area":"国賠：2条・損失補償","topic":"国家賠償法の諸規定と判例","basis":["国家賠償法2条2項・4条・6条","最判昭53.7.17","最判昭57.3.12"],"tip":"","kind":"mc","format":"個数","stem":"国家賠償に関する次の記述ア〜オのうち、法令の規定および判例に照らし、\u003cb>妥当なものはいくつ\u003c/b>あるか。","items":["裁判官がした争訟の裁判が国家賠償法上違法となるのは、裁判官が違法又は不当な目的をもって裁判をしたなど、付与された権限の趣旨に明らかに背いて行使したと認め得るような特別の事情がある場合に限られる。","公の営造物の設置又は管理の瑕疵による損害について、他に損害の原因について責に任ずべき者があるときは、国又は公共団体は、これに対して求償権を有する。","国家賠償法は、外国人が被害者である場合には、相互の保証があるときに限り、適用される。","失火責任法は国家賠償法4条の「民法」に含まれるので、公務員の失火による国家賠償責任は、当該公務員に重大な過失がある場合に限り生ずる。","国又は公共団体の損害賠償の責任については、国家賠償法の規定によるほか、民法の規定による。"],"itemOk":[true,true,true,true,true],"itemWhy":["正しい。最判昭57.3.12。","正しい。2条2項。","正しい。6条。","正しい。最判昭53.7.17（消防職員の消火活動上の失火）。","正しい。4条。"],"options":["一つ","二つ","三つ","四つ","五つ"],"answer":4},{"id":"q14","area":"地自：住民の権利","topic":"直接請求","basis":["地方自治法74条〜76条・80条・81条・86条"],"tip":"請求先は「条例＝長」「監査＝監査委員」「解散・議員・長の解職＝選挙管理委員会」「主要公務員の解職＝長」。表にして覚える。","kind":"mc","format":"個数","stem":"直接請求に関する次の記述ア〜オのうち、地方自治法の規定に照らし、\u003cb>妥当なものはいくつ\u003c/b>あるか。","items":["副知事又は副市町村長の解職の請求は、原則として選挙権を有する者の総数の3分の1以上の者の連署をもって、普通地方公共団体の長に対して行う。","条例の制定改廃の請求があったときは、長は、請求を受理した日から20日以内に議会を招集し、意見を付けてこれを議会に付議しなければならない。","事務の監査の請求は、選挙権を有する者の総数の50分の1以上の者の連署をもって、監査委員に対して行う。","長の解職の請求は、原則として選挙権を有する者の総数の3分の1以上の者の連署をもって、議会の議長に対して行う。","議会の解散の請求は、原則として選挙権を有する者の総数の3分の1以上の者の連署をもって、選挙管理委員会に対して行う。"],"itemOk":[true,true,true,false,true],"itemWhy":["正しい。86条1項。","正しい。74条3項。","正しい。75条1項。","誤り。長・議員の解職請求は選挙管理委員会に対して行う（80条・81条）。","正しい。76条1項。大規模団体には連署数の特例がある。"],"options":["一つ","二つ","三つ","四つ","五つ"],"answer":3},{"id":"q15","area":"地自：議会・執行機関","topic":"議会の招集と運営","basis":["地方自治法100条〜102条の2・115条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"普通地方公共団体の議会に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["議会は、条例で定めるところにより、定例会及び臨時会とせず、毎年、条例で定める日から翌年の当該日の前日までを会期とすることができる。","議会は長が招集するので、議長が臨時会の招集を請求しても、長が招集しないときは、臨時会を開くことはできない。","議会の会議は公開が原則であるが、議長又は議員3人以上の発議により、出席議員の3分の2以上の多数で議決したときは、秘密会を開くことができる。","議会は、当該普通地方公共団体の事務に関する調査を行い、選挙人その他の関係人の出頭及び証言並びに記録の提出を請求することができる。","議長は、議会運営委員会の議決を経て、長に対し、会議に付議すべき事件を示して臨時会の招集を請求することができる。"],"why":["正しい。通年会期（102条の2第1項）。","誤り（これが正解）。長が所定の期間内に招集しないときは、議長が臨時会を招集できる（101条5項）。","正しい。115条1項。","正しい。100条1項（百条調査権）。","正しい。101条2項。"],"answer":1},{"id":"q16","area":"地自：議会・執行機関","topic":"長と議会の関係","basis":["地方自治法176条・178条・179条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"長と議会との関係に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["議会が成立しないときであっても、長は専決処分をすることはできない。","長の不信任の議決は、議員数の過半数の者が出席し、その過半数の者の同意で足りる。","議会において長の不信任の議決をしたときは、議長は直ちにその旨を長に通知しなければならず、長はその通知を受けた日から10日以内に議会を解散することができる。","議会の議決が法令に違反すると認めるときでも、長はこれを再議に付すことはできない。","条例の制定又は改廃に関する議決について長が再議に付した場合、議会が出席議員の過半数で再び同じ議決をすれば、その議決は確定する。"],"why":["誤り。議会が成立しないときなどは専決処分ができる（179条1項）。","誤り。議員数の3分の2以上が出席し、その4分の3以上の同意が必要（178条3項）。解散後初めての議会では過半数の同意で足りる。","正しい。178条1項。","誤り。違法な議決は再議に付さなければならない（176条4項）。","誤り。出席議員の3分の2以上の同意が必要（176条3項）。"],"answer":2},{"id":"q17","area":"地自：住民の権利","topic":"住民監査請求と住民訴訟","basis":["地方自治法242条・242条の2・252条の36"],"tip":"事務監査請求（選挙権者の50分の1・すべての事務）と住民監査請求（住民1人から・財務会計行為）の違いが頻出。","kind":"mc","format":"妥当でないもの","stem":"住民監査請求および住民訴訟に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["住民監査請求は、正当な理由がない限り、当該行為のあった日又は終わった日から1年を経過したときは、することができない。","住民監査請求は、当該普通地方公共団体の住民であって、かつ選挙権を有する者でなければすることができない。","包括外部監査契約は、都道府県、指定都市及び中核市には締結が義務付けられている。","住民訴訟は、住民監査請求をした住民に限り、提起することができる。","住民訴訟の対象は、財務会計上の行為又は怠る事実に限られる。"],"why":["正しい。242条2項。","誤り（これが正解）。住民であれば足り、選挙権の有無は問わない。1人でもできる（242条1項）。","正しい。252条の36第1項・同法施行令。","正しい。監査請求前置（242条の2第1項）。","正しい。"],"answer":1},{"id":"q18","area":"地自：施設・関与・財務","topic":"国の関与","basis":["地方自治法245条の2・245条の5・250条の7・250条の13・251条の5"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"国の関与および係争処理に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["普通地方公共団体の長その他の執行機関は、国の関与に不服があるときは、国地方係争処理委員会に対し審査の申出をすることができる。","国地方係争処理委員会の勧告等に不服があるときは、普通地方公共団体の長等は、高等裁判所に対し、国の関与の取消し等を求める訴えを提起することができる。","国地方係争処理委員会は、総務省に置かれる。","普通地方公共団体は、法律又はこれに基づく政令によらなくても、その事務の処理に関し国の行政機関の関与を受けることがある。","各大臣は、自治事務の処理が法令の規定に違反していると認めるとき等には、是正の要求をすることができる。"],"why":["正しい。250条の13第1項。","正しい。251条の5第1項。","正しい。250条の7第1項。","誤り（これが正解）。関与の法定主義（245条の2）により、法律又はこれに基づく政令によらなければ関与を受けない。","正しい。245条の5。"],"answer":3},{"id":"q19","area":"地自：議会・執行機関","topic":"議員","basis":["地方自治法90条〜93条・103条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"普通地方公共団体の議会の議員に関する次の記述のうち、地方自治法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["議長は、当該普通地方公共団体の長が議員の中から指名する。","議員は、衆議院議員又は参議院議員と兼ねることができる。","議員の定数は、地方自治法で人口に応じた上限が定められている。","議員の任期は2年である。","議員は、当該普通地方公共団体に対し請負をする者に当たる場合でも、各会計年度における請負の対価の総額が政令で定める額を超えないときは、兼業禁止の対象とならない。"],"why":["誤り。議会が議員の中から選挙する（103条1項）。","誤り。兼職禁止（92条1項）。","誤り。条例で定める（90条・91条）。法定上限は廃止された。","誤り。4年（93条1項）。","正しい。92条の2（令和4年改正。政令で定める額は300万円）。"],"answer":4}]};
