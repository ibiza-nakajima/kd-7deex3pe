<script>window.SET = {"id":"kiso-2","code":"基礎知識強化","title":"基礎知識 直前強化（誤答4問＋頻出5問＋文章理解3問）","lead":"基礎知識は14問中6問（24点）未満だと不合格になります。前回0問だった「情報公開・公文書管理」と、本試験で3問出る「文章理解」を確実な得点源にします。文章理解は1問3〜4分を目安に、本文に書いてあることだけで判断してください。","minutes":20,"questions":[{"id":"q01","area":"情報公開・公文書","topic":"情報公開法","basis":["行政機関情報公開法3条・7条・8条・10条・19条"],"tip":"","kind":"mc","format":"妥当でないもの","stem":"行政機関情報公開法に関する次の記述のうち、行政機関情報公開法の規定に照らし、\u003cb>妥当でないもの\u003c/b>はどれか。","options":["行政文書の開示請求は、日本国民に限ってすることができる。","行政機関の長は、行政文書に不開示情報が記録されている場合でも、公益上特に必要があると認めるときは、開示することができる。","開示決定等は、原則として開示請求があった日から30日以内にしなければならない。","開示請求に係る行政文書が存在しているか否かを答えるだけで不開示情報を開示することとなるときは、その存否を明らかにしないで開示請求を拒否することができる。","開示決定等について審査請求があったときは、原則として、情報公開・個人情報保護審査会に諮問しなければならない。"],"why":["誤り（これが正解）。「何人も」開示請求できる（3条）。外国人・法人も可。","正しい。裁量的開示（7条）。","正しい。10条1項。","正しい。存否応答拒否（8条）。","正しい。19条1項。"],"answer":0},{"id":"q02","area":"政治・経済・社会","topic":"選挙制度","basis":["公職選挙法"],"tip":"","kind":"mc","format":"妥当なもの","stem":"日本の選挙制度に関する次の記述のうち、\u003cb>妥当なもの\u003c/b>はどれか。","options":["参議院議員選挙の選挙区選挙は、すべて都道府県を単位として行われ、複数の県を合わせた選挙区（合区）は存在しない。","選挙権年齢は、20歳以上である。","衆議院議員選挙では、小選挙区と比例代表の重複立候補は禁止されている。","衆議院議員選挙は小選挙区比例代表並立制により行われ、比例代表は全国を11のブロックに分けて行われる。","参議院議員選挙の比例代表は、拘束名簿式のみで行われる。"],"why":["誤り。鳥取・島根、徳島・高知の合区がある。","誤り。18歳以上（平成27年改正）。","誤り。重複立候補ができる（惜敗率による復活当選）。","正しい。","誤り。非拘束名簿式が原則で、一部に「特定枠」がある。"],"answer":3},{"id":"q03","area":"情報公開・公文書","topic":"公文書管理法","basis":["公文書管理法1条・5条・7条・8条・34条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"公文書等の管理に関する法律に関する次の記述のうち、公文書管理法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["行政文書ファイル管理簿は、公表する必要はない。","公文書管理法は、地方公共団体の文書にも直接適用される。","行政機関の長は、保存期間が満了した行政文書ファイル等について、歴史公文書等に該当するものは国立公文書館等に移管し、それ以外のものは廃棄の措置をとるべきことを定めなければならない。","行政機関の長は、保存期間が満了した行政文書ファイル等を、内閣総理大臣の同意なく自由に廃棄することができる。","公文書管理法の目的には、国の諸活動を現在及び将来の国民に説明する責務が全うされるようにすることは含まれない。"],"why":["誤り。公表しなければならない（7条2項）。","誤り。地方公共団体は、法律の趣旨にのっとり文書管理の施策を策定・実施するよう努める（34条）。","正しい。5条5項・8条1項。","誤り。廃棄には内閣総理大臣の同意が必要（8条2項）。","誤り。1条の目的に含まれている。"],"answer":2},{"id":"q04","area":"政治・経済・社会","topic":"国の行政組織","basis":["内閣府設置法","デジタル庁設置法","会計検査院法1条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"国の行政組織に関する次の記述のうち、\u003cb>妥当なもの\u003c/b>はどれか。","options":["デジタル庁は、総務省の外局として設置されている。","会計検査院は内閣の下に置かれ、内閣の指揮監督を受ける。","復興庁は、内閣府の外局である。","こども家庭庁は、厚生労働省の外局として設置されている。","公正取引委員会や国家公安委員会は、内閣府の外局として置かれている。"],"why":["誤り。内閣に置かれる。","誤り。内閣に対し独立の地位を有する（会計検査院法1条）。","誤り。内閣に置かれる。","誤り。内閣府の外局（令和5年設置）。","正しい。"],"answer":4},{"id":"q05","area":"情報公開・公文書","topic":"行政機関情報公開法","basis":["行政機関情報公開法3条・4条・6条・8条・10条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"行政機関の保有する情報の公開に関する法律に関する次の記述のうち、同法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["開示決定等は、原則として、開示請求があった日から60日以内にしなければならない。","何人も、行政機関の長に対し、当該行政機関の保有する行政文書の開示を請求することができ、外国に居住する外国人も開示請求をすることができる。","開示請求をするには、請求の理由や目的を明らかにしなければならない。","開示請求に係る行政文書に不開示情報が記録されている場合には、その部分を容易に区分して除くことができるときでも、行政文書の全部を不開示としなければならない。","開示請求に係る行政文書が存在しているか否かを答えるだけで不開示情報を開示することとなるときでも、行政機関の長は、その存否を明らかにしなければならない。"],"why":["誤り。原則30日以内（10条1項）。正当な理由があれば30日以内に限り延長できる（同条2項）。","正しい。3条（「何人も」）。","誤り。請求書の記載事項に理由・目的は含まれていない（4条1項）。","誤り。容易に区分して除くことができるときは、その部分を除いて開示しなければならない（部分開示・6条1項）。","誤り。その場合は存否を明らかにしないで拒否できる（存否応答拒否・8条）。"],"answer":1},{"id":"q06","area":"情報公開・公文書","topic":"公文書管理法","basis":["公文書管理法4条・5条・8条・11条・16条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"公文書等の管理に関する法律に関する次の記述のうち、同法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["行政機関の職員は、意思決定に至る過程に関する事項について、処理に係る事案が軽微なものであっても必ず文書を作成しなければならない。","国立公文書館等に移管された特定歴史公文書等については、何人も利用請求をすることができない。","行政機関の長は、行政文書ファイル等について、保存期間が満了したときの措置として、歴史公文書等に該当するものは国立公文書館等へ移管し、それ以外のものは廃棄する措置をとるべきことを定めなければならない。","公文書管理法は行政機関の文書のみを対象とし、独立行政法人等の法人文書は対象としない。","行政機関の長は、保存期間が満了した行政文書ファイル等を廃棄しようとするときでも、内閣総理大臣の同意を得る必要はない。"],"why":["誤り。処理に係る事案が軽微なものである場合を除き、文書を作成しなければならない（4条）。","誤り。何人も利用請求をすることができる（16条1項）。","正しい。5条5項。","誤り。独立行政法人等の法人文書も対象（11条以下）。","誤り。廃棄するには、あらかじめ内閣総理大臣に協議し、その同意を得なければならない（8条2項）。"],"answer":2},{"id":"q07","area":"個人情報保護","topic":"個人情報保護法（民間・委員会）","basis":["個人情報保護法2条・26条・27条・33条・133条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"個人情報の保護に関する法律に関する次の記述のうち、同法の規定に照らし、\u003cb>妥当なもの\u003c/b>はどれか。","options":["個人情報取扱事業者は、個人データの漏えい等が発生し個人の権利利益を害するおそれが大きい事態が生じた場合でも、個人情報保護委員会に報告する義務を負わない。","要配慮個人情報は、本人の同意を得ないで第三者に提供する方法として、いわゆるオプトアウトによる第三者提供をすることが認められていない。","個人情報には、生存する個人に関する情報だけでなく、死者に関する情報も含まれる。","個人情報保護委員会は、内閣総理大臣の指揮監督を受け、独立して職権を行使することはない。","個人情報取扱事業者は、本人から保有個人データの開示請求を受けた場合でも、これに応じる義務はない。"],"why":["誤り。個人情報保護委員会への報告と本人への通知が義務付けられている（26条）。","正しい。27条2項ただし書。","誤り。個人情報は「生存する個人に関する情報」（2条1項）。","誤り。委員会の委員長及び委員は、独立してその職権を行う（133条）。","誤り。原則として開示しなければならない（33条2項）。"],"answer":1},{"id":"q08","area":"政治・経済・社会","topic":"国の行政組織","basis":["内閣府設置法2条","デジタル庁設置法2条・6条","復興庁設置法2条","国家行政組織法3条・5条"],"tip":"","kind":"mc","format":"妥当なもの","stem":"国の行政組織に関する次の記述のうち、\u003cb>妥当なもの\u003c/b>はどれか。","options":["デジタル庁は内閣に置かれる行政機関であり、その長は内閣総理大臣である。","国家行政組織法上、省の外局として置かれるのは庁のみであり、委員会は置かれない。","内閣府は、国家行政組織法に基づいて設置される省の一つである。","復興庁は、復興に関係する省の外局として置かれている。","各省大臣は国務大臣の中から内閣総理大臣が命ずるが、内閣総理大臣自身が各省大臣を兼ねることはできない。"],"why":["正しい。デジタル庁設置法2条・6条1項。","誤り。省の外局として委員会及び庁が置かれる（国家行政組織法3条3項）。","誤り。内閣府は内閣府設置法に基づき「内閣に」置かれる機関で、国家行政組織法上の省ではない。","誤り。復興庁は内閣に置かれる（復興庁設置法2条）。","誤り。内閣総理大臣が自ら各省大臣に当たることも妨げない（国家行政組織法5条3項ただし書）。"],"answer":0},{"id":"q09","area":"政治・経済・社会","topic":"選挙制度","basis":["公職選挙法10条ほか"],"tip":"","kind":"mc","format":"妥当なもの","stem":"日本の国政選挙の制度に関する次の記述のうち、\u003cb>妥当なもの\u003c/b>はどれか。","options":["参議院議員の被選挙権は、年齢満25年以上の日本国民に認められる。","参議院議員の選挙においても、選挙区選挙と比例代表選挙への重複立候補が認められている。","衆議院の比例代表選挙では非拘束名簿式が採用されており、候補者個人名での投票が認められている。","衆議院議員の選挙は小選挙区比例代表並立制で行われ、候補者は一定の要件の下で小選挙区と比例代表に重複して立候補することができる。","参議院議員の比例代表選挙は、全国を11のブロックに分けて行われる。"],"why":["誤り。参議院議員の被選挙権は満30年以上（衆議院議員は満25年以上）。","誤り。重複立候補は衆議院のみ。","誤り。衆議院は拘束名簿式で政党名のみで投票する。非拘束名簿式（特定枠あり）は参議院。","正しい。衆議院は重複立候補が可能。","誤り。参議院の比例代表は全国1区。11ブロックに分けるのは衆議院の比例代表。"],"answer":3},{"id":"q10","area":"文章理解","topic":"要旨把握","basis":[],"tip":"要旨問題は、最後の段落・「しかし」の後・「〜こそ」「〜が求められる」に筆者の主張が来やすい。本文にないことを言う肢から消す。","kind":"mc","format":"要旨把握","stem":"次の文章の要旨として最も妥当なものはどれか。\u003cbr>\u003cbr>　情報を集めることと、考えることは、しばしば混同される。検索すれば数秒で大量の答えが手に入る時代には、知っていることの量がそのまま思考の深さであるかのように錯覚しやすい。しかし、集めた情報は、それだけでは判断を導かない。複数の情報のあいだの食い違いに気づき、どれをどの程度信頼するかを決め、足りない部分を自分の推論で補ってはじめて、情報は考えの材料になる。情報が手軽に得られるようになった今こそ、その手前で立ち止まり、問いを立て直す力が求められている。","options":["情報の食い違いに気づくためには、専門家の意見を聞くことが不可欠である。","検索技術の発達によって、人は以前よりも深く考えることができるようになった。","情報の量が多いほど判断は正確になるので、できる限り多くの情報を集めるべきである。","インターネット上の情報は信頼できないため、書籍などの情報だけを用いて考えるべきである。","情報が容易に得られる時代だからこそ、集めた情報を吟味し、問いを立て直して考える力が重要になる。"],"why":["誤り。専門家の意見については本文で述べていない。","誤り。本文は、情報の量を思考の深さと「錯覚しやすい」と述べており、反対の内容。","誤り。本文は「集めた情報は、それだけでは判断を導かない」と述べている。","誤り。ネットと書籍の比較は本文にない。","正しい。最終文「今こそ…問いを立て直す力が求められている」が筆者の主張で、その前の部分がその理由になっている。"],"answer":4},{"id":"q11","area":"文章理解","topic":"並べ替え","basis":[],"tip":"「〜からである」は直前の文の理由、「その結果」「こうした」は前の内容を受ける。指示語・接続語から順に固定する。","kind":"mc","format":"並べ替え","stem":"次の文に続けて、ア〜エの文を並べ替えて意味の通る文章にする場合、最も妥当な順序はどれか。\u003cbr>\u003cbr>「地域の祭りを続けていくことが、多くの町で課題になっている。」\u003cbr>ア　その結果、祭りは一部の人だけが担う行事となり、住民の関心はさらに薄れていく。\u003cbr>イ　担い手の高齢化が進み、準備や運営に関われる人が年々減っているからである。\u003cbr>ウ　こうした悪循環を断ち切るには、参加の形を多様にし、短い時間でも関われる役割を用意することが有効だろう。\u003cbr>エ　人手が足りなくなると、残った人の負担が重くなり、新たに加わろうとする人もためらってしまう。","options":["エ→ア→イ→ウ","イ→エ→ウ→ア","エ→イ→ア→ウ","イ→エ→ア→ウ","イ→ア→エ→ウ"],"why":["誤り。理由を示すイが、結果を示すアの後に来るのは不自然。","誤り。ウの「こうした悪循環」はア・エの内容を受けるので、最後に置く。","誤り。冒頭の文の理由を説明するイ（「〜からである」）が最初に来る。","正しい。課題の理由（イ「〜からである」）→人手不足の影響（エ）→その結果（ア）→「こうした悪循環」への対策（ウ）。","誤り。アの「その結果」は、エの「負担が重くなり…ためらってしまう」を受けるため、エの後に置く。"],"answer":3},{"id":"q12","area":"文章理解","topic":"空欄補充","basis":[],"tip":"空欄の前後（「〜よりも」「結果として」）との対応を確認し、極端な表現（まったく・一切）の肢は疑う。","kind":"mc","format":"空欄補充","stem":"次の文章の空欄に入る語句として最も妥当なものはどれか。\u003cbr>\u003cbr>　失敗を恐れる人ほど、準備に時間をかける。準備が十分であれば失敗は減るから、それ自体は悪いことではない。ただ、準備には終わりがない。どれだけ調べても不安は残り、もう少し整えてから始めようと考えるうちに、機会のほうが先に過ぎ去ってしまう。完璧な準備を待つよりも、（　　　）ほうが、結果として失敗から多くを学べることも少なくない。","options":["失敗しそうなことには最初から手を出さない","ある程度のところで始めてしまい、やりながら修正していく","準備をまったくせずに思いつきで行動する","他人の失敗例を十分に集めてから動く","さらに時間をかけて準備の質を高める"],"why":["誤り。「失敗から多くを学べる」とつながらない。","正しい。「完璧な準備を待つ」と対比され、「失敗から多くを学べる」につながる内容。","誤り。本文は準備自体を「悪いことではない」としており、極端すぎる。","誤り。これも準備を重ねる行動で、「完璧な準備を待つ」との対比にならない。","誤り。「準備には終わりがない」という本文の問題提起と逆。"],"answer":1}]};
